<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
  :root {
    --bg: #05050f;
    --neon1: #ff2fe0;
    --neon2: #2fe6ff;
    --neon3: #7c4dff;
    --card-bg: rgba(20, 18, 40, 0.55);
    --card-border: rgba(124, 77, 255, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: #f2f2ff;
    font-family: 'Courier New', ui-monospace, monospace;
    position: relative;
    overflow-x: hidden;
  }

  canvas#grid {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .glow-orb {
    position: fixed;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,77,255,0.30), transparent 60%);
    filter: blur(40px);
    animation: drift 14s ease-in-out infinite alternate;
    z-index: 0;
    pointer-events: none;
  }
  .glow-orb.b {
    background: radial-gradient(circle, rgba(47,230,255,0.22), transparent 60%);
    animation-duration: 18s;
    animation-direction: alternate-reverse;
    right: 0;
    bottom: 0;
  }

  @keyframes drift {
    0%   { transform: translate(-20%, -10%) scale(1); }
    100% { transform: translate(15%, 20%) scale(1.2); }
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 4rem 1.5rem 2rem;
  }

  .badge {
    display: inline-block;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--neon2);
    border: 1px solid rgba(47,230,255,0.4);
    border-radius: 999px;
    padding: 0.4em 1.2em;
    margin-bottom: 1.5rem;
    text-shadow: 0 0 8px var(--neon2);
    box-shadow: 0 0 20px rgba(47,230,255,0.15) inset;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  h1 {
    font-size: clamp(2rem, 7vw, 4.5rem);
    margin: 0;
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--neon1), var(--neon3), var(--neon2), var(--neon1));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
    text-shadow: 0 0 60px rgba(255,47,224,0.2);
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .sub {
    margin-top: 1rem;
    font-size: clamp(0.9rem, 2vw, 1.15rem);
    color: #b8b8e0;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 1.5rem 5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.75rem;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    backdrop-filter: blur(6px);
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(47,230,255,0.6);
    box-shadow: 0 12px 40px rgba(124,77,255,0.25), 0 0 0 1px rgba(47,230,255,0.2) inset;
  }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    background: var(--thumb-grad, linear-gradient(135deg, #2a1b4d, #0f2a4d));
    border-bottom: 1px solid var(--card-border);
  }

  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      transparent, transparent 3px,
      rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px
    );
    pointer-events: none;
  }

  .thumb-tag {
    position: absolute;
    bottom: 8px;
    right: 10px;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }

  .card-body {
    padding: 1.1rem 1.25rem 1.4rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .card-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.02em;
  }

  .card-desc {
    font-size: 0.85rem;
    color: #a8a8d0;
    line-height: 1.4;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem 1rem 3rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6a6a95;
  }

  footer span { color: var(--neon3); }

  #gAuthBox {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 0.75rem;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 0.45em 0.9em;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 20px rgba(124,77,255,0.15);
  }
  #gAuthBox input {
    background: rgba(5,5,15,0.6);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    color: #f2f2ff;
    padding: 0.35em 0.8em;
    font-family: inherit;
    font-size: 0.75rem;
    width: 150px;
  }
  #gAuthBox input::placeholder { color: #8888b0; }
  #gAuthBox button {
    background: transparent;
    border: 1px solid var(--neon2);
    color: var(--neon2);
    border-radius: 999px;
    padding: 0.35em 0.9em;
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  #gAuthBox button:hover { background: var(--neon2); color: #05050f; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud-sync.js?v=2"></script>
</head>
<body>
  <canvas id="grid"></canvas>
  <div class="glow-orb"></div>
  <div class="glow-orb b"></div>

  <div id="gAuthBox"></div>

  <header>
    <div class="badge">// gallery.exe online</div>
    <h1>The Gallery</h1>
    <div class="sub">a collection of html builds &amp; experiments</div>
  </header>

  <main id="cards"></main>

  <footer>status: <span>all systems nominal</span></footer>

  <script>
    const games = [
      { title: 'Duck Clicker', href: 'games/duckclicker.html', desc: 'Idle clicker with upgrades, achievements, and duck skins.', icon: '🦆', grad: 'linear-gradient(135deg, #3d2b1f, #6b4a26)' },
      { title: 'Bookworm', href: 'games/bookworm.html', desc: 'Track what you’re reading with progress and pace charts.', icon: '📖', grad: 'linear-gradient(135deg, #1f2b4d, #3d2b6b)' },
      { title: 'Pitwall', href: 'games/pitwall.html', desc: 'Study session tracker — subjects, exam countdowns, and logged time.', icon: '📝', grad: 'linear-gradient(135deg, #232833, #3a4a5c)' },
      { title: 'Driftline', href: 'games/driftline.html', desc: 'Cozy fishing sim — cast a line and reel in rare catches.', icon: '🎣', grad: 'linear-gradient(135deg, #1f2b2b, #266b5a)' },
      { title: 'GraphCalc', href: 'games/graphcalc.html', desc: 'Desmos-style graphing calculator, self-contained and embeddable.', icon: '📈', grad: 'linear-gradient(135deg, #1f2a4d, #2646a8)' },
      { title: 'LessonCanvas', href: 'games/lessoncanvas.html', desc: 'JSON-driven interactive lesson shell with an AI helper.', icon: '📚', grad: 'linear-gradient(135deg, #2b1f4d, #5a2b8a)' },
      { title: 'Quickdraw', href: 'games/quickdraw.html', desc: 'Western quick-draw shooting gallery — time your shot, break the glass.', icon: '🤠', grad: 'linear-gradient(135deg, #2b1d12, #6e4424)' }
    ];

    const main = document.getElementById('cards');
    for (const g of games) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = g.href;
      a.innerHTML = `
        <div class="thumb" style="--thumb-grad: ${g.grad}">
          <span>${g.icon}</span>
          <span class="thumb-tag">preview soon</span>
        </div>
        <div class="card-body">
          <div class="card-title">${g.title}</div>
          <div class="card-desc">${g.desc}</div>
        </div>
      `;
      main.appendChild(a);
    }

    // -----------------------------------------------------------------
    //  ACCOUNT — signing in here is the real, shared sign-in for every
    //  game on this site (they all read the same Supabase session).
    //  Signing out here ends that shared session everywhere. Each game
    //  additionally offers its own "sign out", but that only opts that
    //  one game out locally — it never touches the session created here.
    // -----------------------------------------------------------------
    CloudSync.mountAuthWidget('gAuthBox', null);

    const canvas = document.getElementById('grid');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const size = 42;
    let offset = 0;

    function draw() {
      offset = (offset + 0.15) % size;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(124,77,255,0.10)';
      ctx.lineWidth = 1;
      for (let x = -size; x < w + size; x += size) {
        ctx.beginPath();
        ctx.moveTo(x + offset, 0);
        ctx.lineTo(x + offset, h);
        ctx.stroke();
      }
      for (let y = -size; y < h + size; y += size) {
        ctx.beginPath();
        ctx.moveTo(0, y + offset);
        ctx.lineTo(w, y + offset);
        ctx.stroke();
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>

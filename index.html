<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — AI Coming Soon</title>
<style>
  :root {
    --bg: #05050f;
    --neon1: #ff2fe0;
    --neon2: #2fe6ff;
    --neon3: #7c4dff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: #f2f2ff;
    font-family: 'Courier New', ui-monospace, monospace;
    overflow: hidden;
    position: relative;
  }

  canvas#grid {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .glow-orb {
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,77,255,0.35), transparent 60%);
    filter: blur(40px);
    animation: drift 14s ease-in-out infinite alternate;
    z-index: 0;
  }
  .glow-orb.b {
    background: radial-gradient(circle, rgba(47,230,255,0.25), transparent 60%);
    animation-duration: 18s;
    animation-direction: alternate-reverse;
  }

  @keyframes drift {
    0%   { transform: translate(-20%, -10%) scale(1); }
    100% { transform: translate(15%, 20%) scale(1.2); }
  }

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
  }

  .badge {
    display: inline-block;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--neon2);
    border: 1px solid rgba(47,230,255,0.4);
    border-radius: 999px;
    padding: 0.4em 1.2em;
    margin-bottom: 1.5rem;
    text-shadow: 0 0 8px var(--neon2);
    box-shadow: 0 0 20px rgba(47,230,255,0.15) inset;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  h1 {
    font-size: clamp(2.5rem, 9vw, 6rem);
    margin: 0;
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--neon1), var(--neon3), var(--neon2), var(--neon1));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
    text-shadow: 0 0 60px rgba(255,47,224,0.25);
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .sub {
    margin-top: 1rem;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    color: #b8b8e0;
    min-height: 1.6em;
  }

  .cursor {
    display: inline-block;
    width: 0.55em;
    background: var(--neon2);
    animation: blink 1s steps(1) infinite;
    margin-left: 2px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .status {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    color: #6a6a95;
    text-transform: uppercase;
  }

  .status span {
    color: var(--neon3);
  }
</style>
</head>
<body>
  <canvas id="grid"></canvas>
  <div class="glow-orb"></div>
  <div class="glow-orb b"></div>

  <main>
    <div class="badge">// neural network online</div>
    <h1>Hello, World</h1>
    <div class="sub" id="typed">&nbsp;</div>
    <div class="status">status: <span>gallery.initializing()</span></div>
  </main>

  <script>
    const lines = [
      "compiling something beautiful...",
      "training on pure vibes...",
      "gallery.exe launching soon...",
      "01001000 01101001 :)"
    ];
    const el = document.getElementById('typed');
    let li = 0, ci = 0, deleting = false;

    function tick() {
      const full = lines[li];
      if (!deleting) {
        ci++;
        if (ci > full.length) { deleting = true; setTimeout(tick, 1400); return; }
      } else {
        ci--;
        if (ci < 0) { deleting = false; li = (li + 1) % lines.length; ci = 0; }
      }
      el.innerHTML = full.slice(0, ci) + '<span class="cursor">&nbsp;</span>';
      setTimeout(tick, deleting ? 35 : 55);
    }
    tick();

    const canvas = document.getElementById('grid');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const size = 42;
    let offset = 0;

    function draw() {
      offset = (offset + 0.15) % size;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(124,77,255,0.12)';
      ctx.lineWidth = 1;
      for (let x = -size; x < w + size; x += size) {
        ctx.beginPath();
        ctx.moveTo(x + offset, 0);
        ctx.lineTo(x + offset, h);
        ctx.stroke();
      }
      for (let y = -size; y < h + size; y += size) {
        ctx.beginPath();
        ctx.moveTo(0, y + offset);
        ctx.lineTo(w, y + offset);
        ctx.stroke();
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>

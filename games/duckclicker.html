<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duck Clicker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: linear-gradient(180deg, #bfe3f0 0%, #bfe3f0 55%, #a8d98a 55%, #8fc46e 100%);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: #24312a;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

#app {
  display: flex; flex-direction: column;
  width: 900px; max-width: 96vw; height: 620px; max-height: 94vh;
  gap: 12px;
}

/* --- HUD --- */
#hud {
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.7);
  border-radius: 12px; padding: 12px 20px; backdrop-filter: blur(6px);
  box-shadow: 0 2px 10px rgba(30,50,40,0.08);
}
#crumbCount {
  font-size: 26px; font-weight: 800; color: #7a5320; letter-spacing: 0.5px;
}
#crumbLabel { font-size: 13px; color: #4a5a4e; margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
#cpsLine { font-size: 12px; color: #5a6a5e; margin-left: 18px; }

/* --- Main area: duck stage + shop --- */
#main {
  flex: 1; display: flex; gap: 12px; min-height: 0;
}

#duckStage {
  flex: 1.4; position: relative; border-radius: 14px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,0.35), transparent 70%);
  border: 1px solid rgba(255,255,255,0.5);
  box-shadow: 0 2px 10px rgba(30,50,40,0.08);
  display: flex; align-items: center; justify-content: center;
}
#duckCanvas { cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }

#shopPanel {
  flex: 1; min-width: 260px; max-width: 320px;
  background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.7);
  border-radius: 14px; padding: 14px; backdrop-filter: blur(6px);
  box-shadow: 0 2px 10px rgba(30,50,40,0.08);
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
}
#shopPanel h2 {
  font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
  color: #4a5a4e; margin-bottom: 4px;
}
.upgrade-card {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.7);
  border-radius: 10px; padding: 10px 12px;
}
.upgrade-card.affordable { border-color: rgba(255,179,71,0.6); }
.upgrade-info { flex: 1; min-width: 0; }
.upgrade-name { font-size: 13px; font-weight: 700; color: #4a3410; letter-spacing: 0.3px; }
.upgrade-desc { font-size: 11.5px; color: #5a6a5e; line-height: 1.35; margin-top: 2px; }
.upgrade-level { font-size: 11px; color: #7a8a7e; margin-top: 3px; }
.upgrade-level b { color: #b9791a; }
.upgrade-buy-btn {
  flex-shrink: 0; padding: 8px 12px; border-radius: 16px; font-size: 12px; font-weight: 700;
  letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap;
  background: #ffb347; border: 1px solid #e89a2c; color: #4a2e08; transition: all 0.15s;
}
.upgrade-buy-btn:hover { background: #ffc26b; }
.upgrade-buy-btn:disabled {
  cursor: not-allowed; opacity: 0.45; background: rgba(255,255,255,0.5); border-color: rgba(90,106,94,0.3); color: #5a6a5e;
}

/* --- Tabs --- */
#tabs { display: flex; gap: 8px; }
.tab-btn {
  padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 700;
  letter-spacing: 1px; cursor: pointer; user-select: none;
  background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.7);
  color: #4a5a4e; transition: all 0.15s;
}
.tab-btn:hover { background: rgba(255,255,255,0.75); }
.tab-btn.active { background: #ffb347; border-color: #e89a2c; color: #4a2e08; }

.tab-panel { display: none; flex: 1; min-height: 0; }
.tab-panel.active { display: flex; }

#achievementsPanel {
  flex: 1; display: flex; flex-direction: column; gap: 10px;
  background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.7);
  border-radius: 14px; padding: 14px; overflow-y: auto;
}
.placeholder-panel {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.7);
  border-radius: 14px; color: #5a6a5e; font-size: 14px; letter-spacing: 1px;
}

.achievement-card {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.7);
  border-radius: 10px; padding: 10px 12px;
}
.achievement-card.unlocked { border-color: rgba(255,179,71,0.7); box-shadow: 0 0 0 1px rgba(255,179,71,0.25) inset; }
.achievement-card.locked { opacity: 0.55; }
.achievement-card.claimed { opacity: 0.55; }
.achievement-info { flex: 1; min-width: 0; }
.achievement-name { font-size: 13px; font-weight: 700; color: #4a3410; letter-spacing: 0.3px; }
.achievement-desc { font-size: 11.5px; color: #5a6a5e; line-height: 1.35; margin-top: 2px; }
.achievement-progress { font-size: 11px; color: #7a8a7e; margin-top: 3px; }
.achievement-claim-btn {
  flex-shrink: 0; padding: 8px 14px; border-radius: 16px; font-size: 12px; font-weight: 700;
  letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap;
  background: #ffb347; border: 1px solid #e89a2c; color: #4a2e08; transition: all 0.15s;
}
.achievement-claim-btn:hover { background: #ffc26b; }
.achievement-status {
  flex-shrink: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  color: #7a8a7e; white-space: nowrap;
}

#ducksPanel {
  flex: 1; display: flex; flex-direction: column; gap: 10px;
  background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.7);
  border-radius: 14px; padding: 14px; overflow-y: auto;
}
.skin-card {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.7);
  border-radius: 10px; padding: 10px 12px;
}
.skin-card.selected { border-color: rgba(255,179,71,0.7); box-shadow: 0 0 0 1px rgba(255,179,71,0.25) inset; }
.skin-preview {
  flex-shrink: 0; width: 56px; height: 56px; border-radius: 8px; overflow: hidden;
  background: rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center;
}
.skin-preview img { width: 100%; height: 100%; object-fit: contain; }
.skin-info { flex: 1; min-width: 0; }
.skin-name { font-size: 13px; font-weight: 700; color: #4a3410; letter-spacing: 0.3px; }
.skin-select-btn {
  flex-shrink: 0; padding: 8px 14px; border-radius: 16px; font-size: 12px; font-weight: 700;
  letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap;
  background: #ffb347; border: 1px solid #e89a2c; color: #4a2e08; transition: all 0.15s;
}
.skin-select-btn:hover { background: #ffc26b; }
.skin-status {
  flex-shrink: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  color: #b9791a; white-space: nowrap;
}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span id="crumbCount">0</span><span id="crumbLabel">breadcrumbs</span>
    <span id="cpsLine"></span>
  </div>

  <div id="tabs">
    <div class="tab-btn active" data-tab="game">Game</div>
    <div class="tab-btn" data-tab="achievements">Achievements</div>
    <div class="tab-btn" data-tab="cosmetics">Cosmetics</div>
    <div class="tab-btn" data-tab="ducks">Ducks</div>
  </div>

  <div class="tab-panel active" data-tab="game">
    <div id="main">
      <div id="duckStage">
        <canvas id="duckCanvas" width="420" height="420"></canvas>
      </div>
      <div id="shopPanel">
        <h2>Upgrades</h2>
        <div id="shopList"></div>
      </div>
    </div>
  </div>

  <div class="tab-panel" data-tab="achievements">
    <div id="achievementsPanel"></div>
  </div>

  <div class="tab-panel" data-tab="cosmetics">
    <div class="placeholder-panel">Cosmetics coming soon.</div>
  </div>

  <div class="tab-panel" data-tab="ducks">
    <div id="ducksPanel"></div>
  </div>
</div>

<script>
// ===================================================================
//  DUCK CLICKER — idle clicker. Canvas-drawn duck + click animations,
//  DOM HUD/shop/tabs. Currency: breadcrumbs.
// ===================================================================

const canvas = document.getElementById('duckCanvas');
const ctx = canvas.getContext('2d');
const CW = canvas.width, CH = canvas.height;

// -------------------------------------------------------------------
//  STATE
// -------------------------------------------------------------------
let breadcrumbs = 0;
let clickValue = 1;
const upgradeLevels = {};   // id -> current level, starts at 0 for everything
let totalClicks = 0;        // lifetime click count, separate from breadcrumbs (which get spent) — drives achievements
const claimedAchievements = {};   // id -> true once claimed

function addBreadcrumbs(n) {
  breadcrumbs += n;
  updateHUD();
  renderShop();   // affordability (greyed-out vs. buyable) depends on breadcrumbs
}
function updateHUD() {
  document.getElementById('crumbCount').textContent = Math.floor(breadcrumbs).toLocaleString();
}

// Shared core of "a click happened": reward, sound, floater, and
// lifetime click counting. Used by both performClick (real mouse
// clicks) and performAutoClick (Auto Pet / Fuzzy Duck, Ducky Fuzz
// timers) — the two differ only in whether they touch the duck's
// wobble/idle state, see below.
function registerClick(x, y) {
  addBreadcrumbs(clickValue);
  sfx.click();
  spawnFloater(x + (Math.random() * 30 - 15), y - 20, clickValue);
  totalClicks++;
  renderAchievements();
}

// Real user click: bounces the duck and cancels whatever idle animation
// (sway/preen/quack) is currently playing, same as before.
function performClick(x, y) {
  registerClick(x, y);
  triggerWobble();
  resetIdle();
}

// Auto-clicker tick (Auto Pet, Fuzzy Duck): awards the click in the
// background without touching wobble/idle state, so a duck mid-sway or
// mid-quack keeps playing that animation uninterrupted instead of being
// yanked back to neutral every time a timer fires.
function performAutoClick(x, y) {
  registerClick(x, y);
}

// -------------------------------------------------------------------
//  UPGRADE SHOP — multiplier-only for this phase (flat click-value
//  bumps and outright multipliers); passive/idle generators are a
//  later, different upgrade type per the spec and aren't built here.
//  Starter set and cost curve are both proposals, not a fixed design:
//    - "flat" upgrades add a fixed amount to click value per level,
//      unlimited levels, mild exponential cost growth (×1.15-1.18/lvl)
//    - "mult" upgrades are one-time purchases that multiply the total
//      click value, priced as big milestone jumps
// -------------------------------------------------------------------
const UPGRADES = [
  {
    id: 'nibble', name: 'Crumb Nibble', type: 'flat', amount: 1, maxLevel: Infinity,
    desc: () => '+1 breadcrumb per click.',
    cost: (lvl) => Math.round(15 * Math.pow(1.15, lvl)),
  },
  {
    id: 'chomp', name: 'Crumb Chomp', type: 'flat', amount: 5, maxLevel: Infinity,
    desc: () => '+5 breadcrumbs per click.',
    cost: (lvl) => Math.round(150 * Math.pow(1.18, lvl)),
  },
  {
    id: 'goldenBeak', name: 'Golden Beak', type: 'mult', amount: 2, maxLevel: 1,
    desc: () => 'Doubles your total click value.',
    cost: () => 1000,
  },
  {
    id: 'feastFrenzy', name: 'Feast Frenzy', type: 'mult', amount: 3, maxLevel: 1,
    desc: () => 'Triples your total click value.',
    cost: () => 10000,
  },
  {
    id: 'autoPet', name: 'Auto Pet', type: 'autoStack', maxLevel: Infinity,
    desc: () => 'Adds one automatic click every ' + AUTO_PET_INTERVAL_SEC + 's, stacking independently with each level.',
    cost: (lvl) => Math.round(50000 * Math.pow(1.2, lvl)),
  },
  {
    id: 'egg', name: 'Nest Egg', type: 'eggSpawn', maxLevel: Infinity,
    desc: () => 'A bonus egg occasionally appears on the stage — click it for 2x your click value. Each level makes eggs appear more often.',
    cost: (lvl) => Math.round(50000 * Math.pow(1.2, lvl)),
  },
  {
    id: 'cheeseFeet', name: 'Cheese Feet', type: 'mult', amount: 4, maxLevel: 1,
    desc: () => 'Quadruples your total click value.',
    cost: () => 100000,
  },
  {
    id: 'fuzzyDuck', name: 'Fuzzy Duck, Ducky Fuzz', type: 'autoScale', maxLevel: Infinity,
    desc: () => 'A second, much faster auto-clicker — every ' + fuzzyDuckIntervalSec(Math.max(1, upgradeLevels.fuzzyDuck || 1)).toFixed(2) + 's at your current level, speeding up further with each purchase.',
    cost: (lvl) => Math.round(500000 * Math.pow(1.2, lvl)),
  },
  {
    // "double bonus for clicks" — treated as a one-time x2 click multiplier
    // pending confirmation; the duckling sprite itself is a separate hook
    // (see FUZZLING_IMG below) since no PNG has been supplied yet
    id: 'yellowFuzzling', name: 'Yellow Fuzzling', type: 'mult', amount: 2, maxLevel: 1,
    desc: () => 'A duckling joins your duck, doubling your total click value.',
    cost: () => 500000,
  },
];

// -------------------------------------------------------------------
//  AUTO-CLICKERS — Auto Pet fires one independent timer per level
//  (buying level 3 means three separate 5s auto-clicks are running
//  concurrently, not one auto-click that's 3x faster). Each tick reuses
//  performClick(), so it gets the same reward/feedback/lifetime-click
//  counting as a real click, aimed at wherever the duck is currently
//  drawn (falls back to stage center if the photo hasn't loaded yet).
// -------------------------------------------------------------------
const AUTO_PET_INTERVAL_SEC = 5;   // proposed rate — not specified beyond "a few seconds", flagged as an assumption

function autoClickPosition() {
  const f = getActiveSkin().idle.frame;
  if (f) return { x: f.drawX + f.drawW / 2, y: f.drawY + f.drawH / 2 };
  return { x: DUCK_CX, y: CH * 0.5 };
}
function startAutoPetTimer() {
  setInterval(() => {
    const pos = autoClickPosition();
    performAutoClick(pos.x, pos.y);
  }, AUTO_PET_INTERVAL_SEC * 1000);
}

// Fuzzy Duck, Ducky Fuzz — unlike Auto Pet's stacking-timers model, this
// is a single self-rescheduling timer whose interval speeds up with each
// level (one clicker getting faster, not more concurrent clickers). Rate
// proposed and confirmed: 1.5s at level 1, -0.15s/level, floor 0.4s.
const FUZZY_DUCK_BASE_SEC = 1.5, FUZZY_DUCK_STEP_SEC = 0.15, FUZZY_DUCK_FLOOR_SEC = 0.4;
function fuzzyDuckIntervalSec(lvl) {
  return Math.max(FUZZY_DUCK_FLOOR_SEC, FUZZY_DUCK_BASE_SEC - (lvl - 1) * FUZZY_DUCK_STEP_SEC);
}
let fuzzyDuckLoopRunning = false;
function fuzzyDuckTick() {
  const lvl = upgradeLevels.fuzzyDuck || 0;
  if (lvl <= 0) { fuzzyDuckLoopRunning = false; return; }   // shouldn't happen, but a safe stop condition
  const pos = autoClickPosition();
  performAutoClick(pos.x, pos.y);
  setTimeout(fuzzyDuckTick, fuzzyDuckIntervalSec(lvl) * 1000);
}
function startFuzzyDuckLoopIfNeeded() {
  if (fuzzyDuckLoopRunning) return;   // already looping — it reads the current level fresh on every tick, so a
  fuzzyDuckLoopRunning = true;        // newly bought level speeds it up automatically without restarting anything
  const lvl = upgradeLevels.fuzzyDuck || 0;
  setTimeout(fuzzyDuckTick, fuzzyDuckIntervalSec(lvl) * 1000);
}

// -------------------------------------------------------------------
//  NEST EGG — a bonus egg occasionally spawns at a random point on the
//  stage while the upgrade is owned; clicking it awards 2x the current
//  click value (so it scales with upgrades, not a flat bonus) and it
//  disappears. Left unclicked, it despawns on its own after a timeout.
//  Spawn gap and despawn timeout are both proposed values — not
//  specified beyond "shorter gap per level", flagged as assumptions.
// -------------------------------------------------------------------
const EGG_DESPAWN_SEC = 8;
const EGG_RADIUS = 22;
let egg = null;   // { x, y, spawnTime } while one is on screen, else null

function eggAvgGapSec(lvl) {
  return Math.max(10, 45 * Math.pow(0.85, lvl - 1));
}

// Event-driven scheduling (not a fixed interval) so eggs never overlap:
// the next spawn is only queued once the current one is collected,
// despawns, or (if the upgrade isn't owned yet) after a short retry.
function scheduleNextEggSpawn() {
  const lvl = upgradeLevels.egg || 0;
  if (lvl <= 0) { setTimeout(scheduleNextEggSpawn, 3000); return; }
  const gap = eggAvgGapSec(lvl) * (0.7 + Math.random() * 0.6);
  setTimeout(spawnEgg, gap * 1000);
}
function spawnEgg() {
  const margin = EGG_RADIUS + 20;
  egg = {
    x: margin + Math.random() * (CW - margin * 2),
    y: margin + Math.random() * (CH - margin * 2),
    spawnTime: performance.now(),
  };
}
function collectEgg() {
  const bonus = clickValue * 2;
  addBreadcrumbs(bonus);
  spawnFloater(egg.x, egg.y - 20, bonus);
  sfx.eggCollect();
  egg = null;
  scheduleNextEggSpawn();
}
function updateEgg() {
  if (egg && performance.now() - egg.spawnTime > EGG_DESPAWN_SEC * 1000) {
    egg = null;
    scheduleNextEggSpawn();
  }
}
function isPointOnEgg(x, y) {
  if (!egg) return false;
  const dx = x - egg.x, dy = y - egg.y;
  return dx * dx + dy * dy <= EGG_RADIUS * EGG_RADIUS;
}
function drawEgg() {
  if (!egg) return;
  const age = (performance.now() - egg.spawnTime) / 1000;
  const bob = Math.sin(age * 3) * 4;   // gentle up/down bob to catch the eye
  const glow = 0.5 + Math.sin(age * 5) * 0.5;
  const x = egg.x, y = egg.y + bob;

  ctx.save();
  ctx.fillStyle = 'rgba(255,220,120,' + (0.25 + glow * 0.25) + ')';
  ctx.beginPath();
  ctx.ellipse(x, y, EGG_RADIUS * 1.6, EGG_RADIUS * 1.6, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(egg.x, egg.y + EGG_RADIUS * 1.1, EGG_RADIUS * 0.8, EGG_RADIUS * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff4d6';
  ctx.beginPath();
  ctx.ellipse(x, y, EGG_RADIUS * 0.72, EGG_RADIUS, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e8b83c';
  const spots = [[-6, -8], [7, -2], [-3, 9], [5, 12]];
  for (const [sx, sy] of spots) {
    ctx.beginPath();
    ctx.ellipse(x + sx, y + sy, 3, 2.2, 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function recomputeClickValue() {
  let flat = 1, mult = 1;
  for (const u of UPGRADES) {
    const lvl = upgradeLevels[u.id] || 0;
    if (u.type === 'flat') flat += u.amount * lvl;
    else if (u.type === 'mult' && lvl > 0) mult *= u.amount;
  }
  clickValue = flat * mult;
}

function buyUpgrade(id) {
  const u = UPGRADES.find(x => x.id === id);
  const lvl = upgradeLevels[id] || 0;
  if (lvl >= u.maxLevel) return;
  const cost = u.cost(lvl);
  if (breadcrumbs < cost) return;
  breadcrumbs -= cost;
  upgradeLevels[id] = lvl + 1;
  if (u.type === 'autoStack') startAutoPetTimer();   // this new level's own independent timer
  if (u.type === 'autoScale') startFuzzyDuckLoopIfNeeded();   // no-op if the loop is already running
  recomputeClickValue();
  updateHUD();
  renderShop();
  writeSave();
}

function renderShop() {
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  for (const u of UPGRADES) {
    const lvl = upgradeLevels[u.id] || 0;
    if (u.maxLevel === 1 && lvl >= 1) continue;   // one-time upgrade: gone once bought

    const cost = u.cost(lvl);
    const affordable = breadcrumbs >= cost;

    const card = document.createElement('div');
    card.className = 'upgrade-card' + (affordable ? ' affordable' : '');

    const info = document.createElement('div');
    info.className = 'upgrade-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'upgrade-name';
    nameEl.textContent = u.name;
    const descEl = document.createElement('div');
    descEl.className = 'upgrade-desc';
    descEl.textContent = u.desc();
    info.appendChild(nameEl);
    info.appendChild(descEl);
    if (u.maxLevel > 1 && lvl > 0) {
      const levelEl = document.createElement('div');
      levelEl.className = 'upgrade-level';
      levelEl.innerHTML = 'Level <b>' + lvl + '</b>';
      info.appendChild(levelEl);
    }

    const btn = document.createElement('button');
    btn.className = 'upgrade-buy-btn';
    btn.textContent = cost.toLocaleString();
    btn.disabled = !affordable;
    btn.addEventListener('click', () => buyUpgrade(u.id));

    card.appendChild(info);
    card.appendChild(btn);
    list.appendChild(card);
  }
}

// -------------------------------------------------------------------
//  ACHIEVEMENTS — lifetime-click milestones with a manual claim step
//  (reaching the threshold unlocks it, but the reward isn't granted
//  until the player taps Claim). State persists across sessions.
// -------------------------------------------------------------------
const ACHIEVEMENTS = [
  { id: 'clicks100', threshold: 100, reward: 50000 },
  { id: 'clicks500', threshold: 500, reward: 100000 },
  { id: 'clicks1000', threshold: 1000, reward: 150000 },
  { id: 'clicks5000', threshold: 5000, reward: 100000000 },
  { id: 'clicks10000', threshold: 10000, reward: 2000000000 },
  { id: 'clicks20000', threshold: 20000, reward: 10000000000 },
  { id: 'clicks50000', threshold: 50000, reward: 50000000000 },
  { id: 'clicks100000', threshold: 100000, reward: 100000000000 },
];

function claimAchievement(id) {
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (!a || claimedAchievements[id] || totalClicks < a.threshold) return;
  claimedAchievements[id] = true;
  addBreadcrumbs(a.reward);
  renderAchievements();
  writeSave();
}

function renderAchievements() {
  const panel = document.getElementById('achievementsPanel');
  panel.innerHTML = '';
  for (const a of ACHIEVEMENTS) {
    const claimed = !!claimedAchievements[a.id];
    const unlocked = !claimed && totalClicks >= a.threshold;
    const state = claimed ? 'claimed' : (unlocked ? 'unlocked' : 'locked');

    const card = document.createElement('div');
    card.className = 'achievement-card ' + state;

    const info = document.createElement('div');
    info.className = 'achievement-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'achievement-name';
    nameEl.textContent = a.threshold.toLocaleString() + ' Clicks';
    const descEl = document.createElement('div');
    descEl.className = 'achievement-desc';
    descEl.textContent = 'Reward: ' + a.reward.toLocaleString() + ' breadcrumbs';
    info.appendChild(nameEl);
    info.appendChild(descEl);
    if (!claimed) {
      const progressEl = document.createElement('div');
      progressEl.className = 'achievement-progress';
      progressEl.textContent = Math.min(totalClicks, a.threshold).toLocaleString() + ' / ' + a.threshold.toLocaleString() + ' clicks';
      info.appendChild(progressEl);
    }
    card.appendChild(info);

    if (claimed) {
      const status = document.createElement('div');
      status.className = 'achievement-status';
      status.textContent = '✓ Claimed';
      card.appendChild(status);
    } else if (unlocked) {
      const btn = document.createElement('button');
      btn.className = 'achievement-claim-btn';
      btn.textContent = 'Claim';
      btn.addEventListener('click', () => claimAchievement(a.id));
      card.appendChild(btn);
    } else {
      const status = document.createElement('div');
      status.className = 'achievement-status';
      status.textContent = 'Locked';
      card.appendChild(status);
    }

    panel.appendChild(card);
  }
}

// -------------------------------------------------------------------
//  PERSISTENCE — silent localStorage autosave. No save button, no
//  "saved!" toast: it just saves on an interval and on meaningful state
//  changes (upgrade purchases already call writeSave() directly above;
//  the interval below is the fallback for breadcrumbs earned by
//  clicking alone, so idle clicking isn't lost if the tab closes
//  between purchases), plus once more on tab close as a last resort.
// -------------------------------------------------------------------
const SAVE_KEY = 'duckClickerSave';
function loadSave() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    return {
      breadcrumbs: raw.breadcrumbs || 0,
      upgradeLevels: raw.upgradeLevels || {},
      totalClicks: raw.totalClicks || 0,
      claimedAchievements: raw.claimedAchievements || {},
      activeSkinId: raw.activeSkinId || 'default',
    };
  } catch (e) {
    return { breadcrumbs: 0, upgradeLevels: {}, totalClicks: 0, claimedAchievements: {}, activeSkinId: 'default' };
  }
}
function writeSave() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ breadcrumbs, upgradeLevels, totalClicks, claimedAchievements, activeSkinId }));
  } catch (e) { /* localStorage unavailable (private mode, quota, etc.) — silently skip */ }
}
setInterval(writeSave, 8000);
window.addEventListener('beforeunload', writeSave);

// -------------------------------------------------------------------
//  AUDIO — minimal Web Audio setup, just enough for the quack idle
//  animation below. Phase 4 expands this with a click sound and fills
//  in the "sfx" object properly; this is the seed of that same system.
// -------------------------------------------------------------------
let actx = null;
let audioFailed = false;
function audio() {
  if (actx || audioFailed) return actx;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { audioFailed = true; actx = null; }
  return actx;
}
function blip(freq, dur, type, vol, slideTo) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.06, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
// -------------------------------------------------------------------
//  SOUND FILES — real quack recordings that override the synthesized
//  tone when present. Both are cropped to just the quack itself (the
//  source clips had long silence padding before/after); if a file is
//  missing or fails to load, the synthesized version below still works.
// -------------------------------------------------------------------
const SOUND_FILES = {
  quack1: 'Quack1.wav',   // ~0.22s
  quack2: 'Quack2.wav',   // ~0.38s
};
const QUACK_DURATIONS = { quack1: 0.22, quack2: 0.38 };
const soundFiles = {};
for (const key in SOUND_FILES) {
  const el = new Audio(SOUND_FILES[key]);
  el.preload = 'auto';
  const entry = { el, available: true };
  el.addEventListener('error', () => { entry.available = false; });
  soundFiles[key] = entry;
}
function playSoundOr(key, fallbackFn, vol) {
  const entry = soundFiles[key];
  if (entry && entry.available) {
    try {
      entry.el.currentTime = 0;
      entry.el.volume = vol !== undefined ? vol : 0.7;
      const p = entry.el.play();
      if (p && p.catch) p.catch(() => {});
      return;
    } catch (e) { /* fall through to the synthesized version */ }
  }
  fallbackFn();
}

// HOOK: background music would plug in here later (e.g. an <audio> loop
// started on first user interaction) — not built yet, user will add it.
const sfx = {
  click: () => blip(700, 0.045, 'square', 0.045, 1000),
  eggCollect: () => { blip(660, 0.08, 'triangle', 0.06, 990); setTimeout(() => blip(990, 0.12, 'triangle', 0.06, 1320), 70); },
  // picks one of the two real quack recordings at random (falling back to
  // the synthesized tone if that file didn't load) and returns its
  // duration in seconds, so the caller can time the quack animation pulse
  // to actually match the sound instead of guessing a fixed length
  quack: () => {
    const keys = Object.keys(SOUND_FILES);
    const key = keys[Math.floor(Math.random() * keys.length)];
    playSoundOr(key, () => { blip(320, 0.09, 'sawtooth', 0.05, 180); setTimeout(() => blip(260, 0.1, 'sawtooth', 0.045, 140), 80); }, 0.8);
    return (soundFiles[key] && soundFiles[key].available) ? QUACK_DURATIONS[key] : 0.2;
  },
};

// -------------------------------------------------------------------
//  FRAME ALIGNMENT — the resting photo and the quacking photo are two
//  different stock images with different crops/framing (the quacking
//  one is a much tighter crop with no padding), so drawing both at the
//  same raw image size would make the duck visibly jump in scale when
//  it quacks. Instead, each frame is scaled/positioned from its actual
//  non-transparent content box (measured offline from the source PNGs,
//  hardcoded here since these are fixed static assets) so both frames
//  render the duck at the same height with its feet on the same spot.
// -------------------------------------------------------------------
const DUCK_CX = CW / 2;
const GROUND_Y = CH * 0.92;      // fixed on-screen point the duck's feet sit on
const TARGET_BBOX_H = 323;       // on-screen height of the duck's actual content box

// { natural W/H of the source PNG, and the non-transparent content box
// within it (x0,y0)-(x1,y1) } — measured once per asset, not runtime data
const DUCK_BBOX = { w: 500, h: 587, x0: 72, y0: 34, x1: 440, y1: 558 };
const QUACK_BBOX = { w: 260, h: 439, x0: 0, y0: 0, x1: 260, y1: 439 };

// Given a bbox spec, returns where to draw the full image (top-left x/y
// and w/h) so its content box is TARGET_BBOX_H tall and its bottom-center
// sits exactly on (DUCK_CX, GROUND_Y) — i.e. feet planted on the ground.
function frameDrawParams(bbox) {
  const scale = TARGET_BBOX_H / (bbox.y1 - bbox.y0);
  const drawW = bbox.w * scale, drawH = bbox.h * scale;
  const bottomCenterX = (bbox.x0 + bbox.x1) / 2 * scale;
  const bottomCenterY = bbox.y1 * scale;
  return { drawW, drawH, drawX: DUCK_CX - bottomCenterX, drawY: GROUND_Y - bottomCenterY };
}

// -------------------------------------------------------------------
//  DUCK SKINS (Round 3) — placeholder asset constants for skins whose
//  real art hasn't been supplied yet. Each currently points at the
//  existing default duck photo as a temporary stand-in — NOT generated
//  placeholder art, just a reference to the one real photo already in
//  this file — so that dropping in real base64 strings later is a
//  one-line swap per constant, not a refactor. Bboxes are likewise
//  copied from DUCK_BBOX/QUACK_BBOX for now and will need real
//  per-asset measurements once real art arrives (see the bbox-measuring
//  approach described in the FRAME ALIGNMENT comment above).
// -------------------------------------------------------------------
const SHY_IDLE_IMG_SRC = DUCK_IMG_SRC;        // placeholder — swap for real shy idle PNG
const SHY_IDLE_BBOX = DUCK_BBOX;              // placeholder — swap for real bbox once measured
const WOOD_IDLE_IMG_SRC = DUCK_IMG_SRC;       // placeholder — swap for real wood idle PNG
const WOOD_IDLE_BBOX = DUCK_BBOX;             // placeholder
const WOOD_QUACK_IMG_SRC = QUACK_IMG_SRC;     // placeholder — swap for real wood quack PNG
const WOOD_QUACK_BBOX = QUACK_BBOX;           // placeholder
const MALLARD_IDLE_IMG_SRC = DUCK_IMG_SRC;    // placeholder — swap for real mallard idle PNG
const MALLARD_IDLE_BBOX = DUCK_BBOX;          // placeholder
const MALLARD_QUACK_IMG_SRC = QUACK_IMG_SRC;  // placeholder — swap for real mallard quack PNG
const MALLARD_QUACK_BBOX = QUACK_BBOX;        // placeholder

// Wires an Image object's onload to compute its frameDrawParams() once
// loaded and returns the { img, bbox, loaded, frame } entry a skin
// stores for either its idle or quack asset. Used for all four skins'
// assets uniformly, whether the image object is the pre-existing
// duckImg/quackImg (default skin) or a freshly created one (the rest).
function makeSkinEntry(img, src, bbox) {
  const entry = { img, bbox, loaded: false, frame: null };
  img.onload = () => { entry.loaded = true; entry.frame = frameDrawParams(bbox); };
  img.src = src;
  return entry;
}

const defaultIdle = makeSkinEntry(duckImg, DUCK_IMG_SRC, DUCK_BBOX);
const defaultQuack = makeSkinEntry(quackImg, QUACK_IMG_SRC, QUACK_BBOX);
const shyIdle = makeSkinEntry(new Image(), SHY_IDLE_IMG_SRC, SHY_IDLE_BBOX);
const woodIdle = makeSkinEntry(new Image(), WOOD_IDLE_IMG_SRC, WOOD_IDLE_BBOX);
const woodQuack = makeSkinEntry(new Image(), WOOD_QUACK_IMG_SRC, WOOD_QUACK_BBOX);
const mallardIdle = makeSkinEntry(new Image(), MALLARD_IDLE_IMG_SRC, MALLARD_IDLE_BBOX);
const mallardQuack = makeSkinEntry(new Image(), MALLARD_QUACK_IMG_SRC, MALLARD_QUACK_BBOX);

const DUCK_SKINS = [
  { id: 'default', name: 'Classic White', idle: defaultIdle, quack: defaultQuack },
  // Shy intentionally has no unique quack asset — permanently reuses the
  // default skin's quack image/bbox (by design, unlike its idle image
  // above which IS a temporary placeholder awaiting real art).
  { id: 'shy', name: 'Shy', idle: shyIdle, quack: defaultQuack },
  { id: 'wood', name: 'Wood Duck', idle: woodIdle, quack: woodQuack },
  { id: 'mallard', name: 'Mallard', idle: mallardIdle, quack: mallardQuack },
];

let activeSkinId = 'default';
function getActiveSkin() {
  return DUCK_SKINS.find(s => s.id === activeSkinId) || DUCK_SKINS[0];
}
function setActiveSkin(id) {
  if (!DUCK_SKINS.some(s => s.id === id)) return;
  activeSkinId = id;
  writeSave();
  renderDucksTab();
}

// -------------------------------------------------------------------
//  DUCKS TAB — skin picker. Selecting a card only ever touches
//  activeSkinId; it never reads or writes breadcrumbs, upgradeLevels,
//  totalClicks, or claimedAchievements.
// -------------------------------------------------------------------
function renderDucksTab() {
  const panel = document.getElementById('ducksPanel');
  panel.innerHTML = '';
  for (const skin of DUCK_SKINS) {
    const selected = skin.id === activeSkinId;
    const card = document.createElement('div');
    card.className = 'skin-card' + (selected ? ' selected' : '');

    const preview = document.createElement('div');
    preview.className = 'skin-preview';
    const previewImg = document.createElement('img');
    previewImg.src = skin.idle.img.src;
    preview.appendChild(previewImg);
    card.appendChild(preview);

    const info = document.createElement('div');
    info.className = 'skin-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'skin-name';
    nameEl.textContent = skin.name;
    info.appendChild(nameEl);
    card.appendChild(info);

    if (selected) {
      const status = document.createElement('div');
      status.className = 'skin-status';
      status.textContent = 'Selected';
      card.appendChild(status);
    } else {
      const btn = document.createElement('button');
      btn.className = 'skin-select-btn';
      btn.textContent = 'Select';
      btn.addEventListener('click', () => setActiveSkin(skin.id));
      card.appendChild(btn);
    }

    panel.appendChild(card);
  }
}

// Wobble/click-squash animation state
let wobble = { active: false, t: 0, dur: 0.32 };
function triggerWobble() {
  wobble.active = true;
  wobble.t = 0;
}

// -------------------------------------------------------------------
//  YELLOW FUZZLING — duckling sprite that appears standing to the right
//  of the main duck once that upgrade is owned. Same bbox-based sizing/

function computeFuzzlingFrame() {
  // Anchored to whichever duck skin is currently active — the duckling's
  // own image/sizing never changes with skin, but its ground position
  // must still track the active skin's bbox (which can differ per skin
  // once real art with different crops arrives), not a fixed one.
  const skin = getActiveSkin();
  if (!skin.idle.loaded) return null;
  const duckFrame = skin.idle.frame, duckBbox = skin.idle.bbox;
  const scale = FUZZLING_TARGET_BBOX_H / (FUZZLING_BBOX.y1 - FUZZLING_BBOX.y0);
  const drawW = FUZZLING_BBOX.w * scale, drawH = FUZZLING_BBOX.h * scale;
  const bboxHalfW = (FUZZLING_BBOX.x1 - FUZZLING_BBOX.x0) / 2 * scale;
  const duckScale = duckFrame.drawW / duckBbox.w;
  const duckBboxRightEdgeX = duckFrame.drawX + duckBbox.x1 * duckScale;
  const anchorX = duckBboxRightEdgeX + FUZZLING_GAP + bboxHalfW;
  return {
    drawW, drawH,
    drawX: anchorX - ((FUZZLING_BBOX.x0 + FUZZLING_BBOX.x1) / 2) * scale,
    drawY: GROUND_Y - FUZZLING_BBOX.y1 * scale,
  };
}
function drawFuzzling() {
  if (!(upgradeLevels.yellowFuzzling >= 1) || !fuzzlingImgLoaded) return;
  const f = computeFuzzlingFrame();
  if (!f) return;
  ctx.drawImage(fuzzlingImg, f.drawX, f.drawY, f.drawW, f.drawH);
}

// -------------------------------------------------------------------
//  IDLE ANIMATIONS — after IDLE_THRESHOLD seconds with no click, the
//  duck settles into a constant gentle sway (the "looking around"
//  motion) that keeps playing for as long as it stays idle. On top of
//  that baseline, occasional "preen" or "quack" bursts fire at random
//  intervals, briefly taking over before handing back to the sway.
//  These are all transforms on the single static photo (sway/rotate/
//  dip/pulse), not real pose changes — there are no separate art
//  frames for "head turned", except the quack burst, which swaps in a
//  quacking-pose photo if one has been loaded (see QUACK_IMG below).
// -------------------------------------------------------------------
const IDLE_THRESHOLD = 1;   // seconds of no click before the sway kicks in
const BURST_TYPES = ['preen', 'quack'];
let idleT = 0;          // seconds since the last click; keeps growing while idle
let isIdle = false;
let burst = null;       // { type, t, duration } while a preen/quack burst is playing
let nextBurstAt = 0;    // idleT value at which the next burst should fire

function resetIdle() {
  idleT = 0;
  isIdle = false;
  burst = null;
}

function scheduleNextBurst() {
  nextBurstAt = idleT + 3 + Math.random() * 3;   // next burst 3-6s after this point
}

function updateIdle(dt) {
  idleT += dt;
  if (!isIdle && idleT >= IDLE_THRESHOLD) {
    isIdle = true;
    scheduleNextBurst();
  }
  if (!isIdle) return;

  if (!burst && idleT >= nextBurstAt) {
    const type = BURST_TYPES[Math.floor(Math.random() * BURST_TYPES.length)];
    burst = { type, t: 0, duration: 1.0 };
    if (type === 'quack') burst.duration = sfx.quack() + 0.1;   // sized to the actual clip that just played
  }
  if (burst) {
    burst.t += dt;
    if (burst.t >= burst.duration) {
      burst = null;
      scheduleNextBurst();
    }
  }
}

// Returns { rot, sx, sy } for the current idle pose: a continuous sway
// as the baseline, with a preen/quack burst overriding it while active.
function idleTransform() {
  if (!isIdle) return { rot: 0, sx: 1, sy: 1 };

  if (burst && burst.type === 'preen') {
    // a single forward dip (head toward tail) over the burst's duration
    const dip = Math.pow(Math.max(0, Math.sin(burst.t / burst.duration * Math.PI)), 4);
    return { rot: dip * 0.16, sx: 1 - dip * 0.04, sy: 1 + dip * 0.05 };
  }
  if (burst && burst.type === 'quack') {
    // a quick pulse "shiver" spanning the actual quack sound's length —
    // stands in for beak movement, which a static photo can't show
    // (unless QUACK_IMG is set, see drawDuck, which swaps the photo itself)
    const p = burst.t / burst.duration;
    const pulse = Math.sin(p * Math.PI * 2) * (1 - p);
    return { rot: 0, sx: 1 + pulse * 0.05, sy: 1 - pulse * 0.05 };
  }
  // baseline: slow constant side-to-side sway, like the duck looking around
  return { rot: Math.sin(idleT * 2 * Math.PI / 3.2) * 0.06, sx: 1, sy: 1 };
}

function drawDuck(dt) {
  const skin = getActiveSkin();
  if (!skin.idle.loaded) return;
  const useQuackFrame = burst && burst.type === 'quack' && skin.quack.loaded;
  const img = useQuackFrame ? skin.quack.img : skin.idle.img;
  const f = useQuackFrame ? skin.quack.frame : skin.idle.frame;

  ctx.save();
  // pivot the squash/rotate at the duck's feet (fixed ground point) so a
  // click reads as a little hop/press into the ground, and so the pivot
  // stays put even when the resting/quacking frames swap mid-animation
  ctx.translate(DUCK_CX, GROUND_Y);

  let sx = 1, sy = 1, rot = 0;
  if (wobble.active) {
    const p = wobble.t / wobble.dur;
    if (p >= 1) {
      wobble.active = false;
    } else {
      const decay = 1 - p;
      const s = Math.sin(p * Math.PI * 3) * decay * 0.14;
      sx = 1 - s; sy = 1 + s;
      rot = Math.sin(p * Math.PI * 2) * decay * 0.06;
    }
  } else if (isIdle) {
    const it = idleTransform();
    sx = it.sx; sy = it.sy; rot = it.rot;
  }
  ctx.rotate(rot);
  ctx.scale(sx, sy);

  ctx.drawImage(img, f.drawX - DUCK_CX, f.drawY - GROUND_Y, f.drawW, f.drawH);
  ctx.restore();
}

// Hit test: is (x, y) inside the duck's bounding box? Always uses the
// resting frame's box, even mid-quack — a quack burst is brief and this
// keeps the hitbox stable rather than flickering between two rectangles.
function isPointOnDuck(x, y) {
  const skin = getActiveSkin();
  if (!skin.idle.loaded) return false;
  const f = skin.idle.frame;
  const left = f.drawX, right = f.drawX + f.drawW;
  const top = f.drawY, bottom = f.drawY + f.drawH;
  return x >= left && x <= right && y >= top && y <= bottom;
}

// -------------------------------------------------------------------
//  FLOATING "+N" TEXT
// -------------------------------------------------------------------
let floaters = [];
function spawnFloater(x, y, value) {
  floaters.push({ x, y, text: '+' + value, age: 0, life: 0.9, vy: -46 });
}
function updateFloaters(dt) {
  for (const f of floaters) { f.age += dt; f.y += f.vy * dt; f.vy *= 0.98; }
  floaters = floaters.filter(f => f.age < f.life);
}
function drawFloaters() {
  ctx.textAlign = 'center';
  ctx.font = '700 22px "Segoe UI", sans-serif';
  for (const f of floaters) {
    const t = f.age / f.life;
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = '#c9891a';
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }
}

// -------------------------------------------------------------------
//  INPUT
// -------------------------------------------------------------------
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (CW / rect.width);
  const y = (e.clientY - rect.top) * (CH / rect.height);

  if (isPointOnEgg(x, y)) { collectEgg(); return; }
  if (!isPointOnDuck(x, y)) return;

  performClick(x, y);
});

// -------------------------------------------------------------------
//  MAIN LOOP
// -------------------------------------------------------------------
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (wobble.active) wobble.t += dt;
  else updateIdle(dt);
  updateFloaters(dt);
  updateEgg();

  ctx.clearRect(0, 0, CW, CH);
  drawDuck(dt);
  drawFuzzling();
  drawEgg();
  drawFloaters();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// -------------------------------------------------------------------
//  TABS — data-driven off [data-tab] so adding a future tab (e.g. the
//  planned Cosmetics/Skins tab) is pure HTML: one .tab-btn and one
//  .tab-panel sharing a new data-tab value, no JS changes needed here.
// -------------------------------------------------------------------
function setTab(which) {
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.toggle('active', el.dataset.tab === which));
  document.querySelectorAll('.tab-panel').forEach(el => el.classList.toggle('active', el.dataset.tab === which));
}
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => setTab(btn.dataset.tab));
});

// -------------------------------------------------------------------
//  LOAD — restore an existing save if present, otherwise the fresh-
//  start defaults declared above (breadcrumbs: 0, upgradeLevels: {})
//  are left untouched.
// -------------------------------------------------------------------
const loaded = loadSave();
breadcrumbs = loaded.breadcrumbs;
Object.assign(upgradeLevels, loaded.upgradeLevels);
totalClicks = loaded.totalClicks;
Object.assign(claimedAchievements, loaded.claimedAchievements);
if (DUCK_SKINS.some(s => s.id === loaded.activeSkinId)) activeSkinId = loaded.activeSkinId;
recomputeClickValue();
for (let i = 0; i < (upgradeLevels.autoPet || 0); i++) startAutoPetTimer();   // re-spawn one timer per owned level
if (upgradeLevels.fuzzyDuck > 0) startFuzzyDuckLoopIfNeeded();
scheduleNextEggSpawn();   // self-retries every 3s until the Nest Egg upgrade is actually owned

updateHUD();
renderShop();
renderAchievements();
renderDucksTab();
</script>

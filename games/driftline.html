<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driftline</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #0e1512; overflow: hidden;
  font-family: Georgia, 'Times New Roman', serif;
  display: flex; align-items: center; justify-content: center;
  color: #dfe6df;
}
#stage {
  position: relative;
  width: 480px; height: 720px;
  transform-origin: center center;
  box-shadow: 0 0 60px rgba(140,180,150,0.10), inset 0 0 140px rgba(0,0,0,0.6);
  border: 3px solid #1c2420;
  border-radius: 10px; overflow: hidden;
  background: #16211c;
}
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

/* --- HUD --- */
#hud {
  position: absolute; top: 14px; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; padding: 0 18px;
  z-index: 10; font-size: 13px; letter-spacing: 1px;
}
.hud-chip {
  background: rgba(18,26,22,0.62); border: 1px solid rgba(180,200,170,0.22);
  border-radius: 6px; padding: 6px 14px; backdrop-filter: blur(4px);
  color: rgba(223,230,223,0.85); pointer-events: none;
}
.hud-chip b { color: #e8b878; font-weight: 700; }
.hud-left { display: flex; gap: 8px; pointer-events: none; }
.hud-left > * { pointer-events: auto; }
.hud-right { display: flex; gap: 8px; }
#backpackBtn, #gambleBtn, #upgradeBtn {
  width: 34px; height: 34px; border-radius: 8px;
  background: rgba(18,26,22,0.62); border: 1px solid rgba(180,200,170,0.22);
  backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
  font-size: 17px; cursor: pointer; transition: all 0.15s; user-select: none;
}
#backpackBtn:hover, #gambleBtn:hover, #upgradeBtn:hover { background: rgba(232,184,120,0.18); border-color: rgba(232,184,120,0.5); }

/* --- Overlays (scaffolding for later phases) --- */
.overlay {
  position: absolute; inset: 0; z-index: 20;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, rgba(20,32,26,0.55), rgba(6,10,8,0.92));
  backdrop-filter: blur(3px); text-align: center; padding: 20px;
}
.overlay.show { display: flex; }
.title {
  font-size: 40px; font-weight: 700; letter-spacing: 4px;
  color: #eef2ea; text-shadow: 0 0 24px rgba(232,184,120,0.5);
  margin-bottom: 6px;
}
.subtitle { color: rgba(223,230,223,0.6); font-size: 12px; letter-spacing: 2px; margin-bottom: 18px; text-transform: uppercase; }
.btn {
  background: rgba(232,184,120,0.12); border: 1px solid rgba(232,184,120,0.5);
  border-radius: 22px; padding: 12px 34px; color: #f0cf9a; font-size: 14px;
  font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: all 0.18s;
  user-select: none; backdrop-filter: blur(4px);
}
.btn:hover { background: rgba(232,184,120,0.24); color: #fff6e6; box-shadow: 0 0 22px rgba(232,184,120,0.35); }

#castHint {
  position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
  z-index: 10; pointer-events: none; text-align: center;
  font-size: 12px; letter-spacing: 2px; color: rgba(223,230,223,0.65);
  text-shadow: 0 0 8px rgba(0,0,0,0.6);
}
#castHint kbd {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px; padding: 2px 8px; font-family: inherit; color: #f0cf9a; margin: 0 2px;
}

/* --- Phase 2: colour-matching minigame --- */
#timerBarTrack {
  width: 260px; height: 10px; border-radius: 5px; overflow: hidden;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  margin-bottom: 26px;
}
#timerBarFill {
  height: 100%; width: 100%; background: #8fc48a; transition: width 0.1s linear, background 0.3s;
}
#timerBarFill.low { background: #d9483c; }
.square-grid {
  display: grid; grid-template-columns: repeat(4, 64px); grid-template-rows: repeat(2, 64px);
  gap: 14px; margin-bottom: 28px;
}
.color-square {
  width: 64px; height: 64px; border-radius: 10px; cursor: pointer;
  border: 3px solid rgba(255,255,255,0.18);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.35);
  transition: transform 0.12s, border-color 0.15s;
}
.color-square:hover { transform: scale(1.05); }
.color-square.selected { border-color: #f0cf9a; box-shadow: 0 0 16px rgba(240,207,154,0.6); }
.color-square.solved { opacity: 0.12; cursor: default; pointer-events: none; transform: scale(0.9); }
.color-square.wrong { animation: shakeWrong 0.4s; border-color: #d9483c; }
@keyframes shakeWrong {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
#minigameMessage {
  font-size: 26px; font-weight: 700; letter-spacing: 2px; margin-top: 6px;
  color: #f0cf9a; text-shadow: 0 0 20px rgba(240,207,154,0.5);
}

/* --- Phase 3: catch reveal --- */
.btn-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
#catchRarity {
  font-size: 13px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
  margin-bottom: 6px;
}
#catchSpriteCanvas { image-rendering: pixelated; margin: 10px 0 18px; }
#catchValueChip { font-size: 17px; padding: 8px 20px; margin-bottom: 24px; }

/* --- Phase 4: inventory --- */
#inventoryScreen {
  background: #05070a; backdrop-filter: none;
  align-items: flex-start; justify-content: flex-start; padding: 54px 22px 24px;
}
.close-x {
  position: absolute; top: 14px; left: 16px;
  width: 30px; height: 30px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(217,72,60,0.15); border: 1px solid rgba(217,72,60,0.6);
  color: #d9483c; font-size: 17px; font-weight: 700; cursor: pointer;
  transition: all 0.15s; user-select: none;
}
.close-x:hover { background: rgba(217,72,60,0.3); box-shadow: 0 0 14px rgba(217,72,60,0.4); }
#inventoryTitle {
  font-size: 20px; letter-spacing: 4px; color: #eef2ea; margin-bottom: 22px;
  width: 100%; text-align: center; text-transform: uppercase;
}
.inventory-grid {
  display: grid; grid-template-columns: repeat(4, 84px); gap: 14px;
  width: 100%; justify-content: center; align-content: start;
}
.inventory-slot {
  position: relative; width: 84px; height: 84px; border-radius: 10px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center;
}
.inventory-slot canvas { image-rendering: pixelated; }
.inventory-badge {
  position: absolute; bottom: 4px; right: 5px;
  background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.25);
  border-radius: 5px; padding: 1px 5px; font-size: 11px; font-weight: 700; color: #f0cf9a;
}
#inventoryEmpty {
  color: rgba(223,230,223,0.5); font-size: 13px; letter-spacing: 1px;
  width: 100%; text-align: center; margin-top: 40px;
}

/* --- Phase 5: gamble / slot machine --- */
.stack-select { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }
.stack-chip {
  position: relative; width: 48px; height: 48px; border-radius: 8px;
  background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.16);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: all 0.15s;
}
.stack-chip:hover { border-color: rgba(232,184,120,0.5); }
.stack-chip.active { border-color: #f0cf9a; box-shadow: 0 0 14px rgba(240,207,154,0.5); }
.stack-chip-count {
  position: absolute; bottom: -3px; right: -3px;
  background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.25);
  border-radius: 5px; padding: 0 4px; font-size: 10px; font-weight: 700; color: #f0cf9a;
}
#gambleEmpty { color: rgba(223,230,223,0.5); font-size: 13px; letter-spacing: 1px; margin-bottom: 20px; display: none; }
.reel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.reel-canvas {
  width: 56px; height: 56px; border-radius: 8px; image-rendering: pixelated;
  background: rgba(0,0,0,0.35); border: 2px solid rgba(232,184,120,0.35);
}
#lever { position: relative; width: 26px; height: 70px; display: flex; justify-content: center; cursor: pointer; padding-top: 4px; }
#lever::before {
  content: ''; position: absolute; top: 8px; left: 10px; width: 6px; height: 54px;
  background: rgba(180,190,180,0.3); border-radius: 3px;
}
#leverHandle {
  position: relative; width: 20px; height: 20px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #d9483c, #8a2a20);
  border: 2px solid rgba(255,255,255,0.25); transition: transform 0.22s ease-in;
}
#leverHandle.pulled { transform: translateY(46px); }
#gambleResult {
  font-size: 24px; font-weight: 700; letter-spacing: 1px; min-height: 32px;
  text-shadow: 0 0 16px rgba(240,207,154,0.4);
}

/* --- Phase 6: upgrades --- */
#upgradeScreen {
  background: #0a0f0d; backdrop-filter: none;
  align-items: flex-start; justify-content: flex-start; padding: 54px 22px 24px;
}
.menu-tabs { display: flex; gap: 8px; margin-bottom: 18px; width: 100%; justify-content: center; }
.tab-btn {
  padding: 6px 18px; border-radius: 16px; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; font-weight: 700; cursor: pointer; user-select: none;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.16); color: rgba(223,230,223,0.6);
  transition: all 0.15s;
}
.tab-btn.active { background: rgba(232,184,120,0.2); border-color: #f0cf9a; color: #fff6e6; }
.panel { width: 100%; display: none; }
.panel.active { display: block; }

.stat-upgrade-list { display: flex; flex-direction: column; gap: 10px; }
.upg-box {
  text-align: left; border-radius: 10px; padding: 12px 14px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.upg-text { flex: 1; }
.upg-name { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #f0cf9a; text-transform: uppercase; margin-bottom: 3px; }
.upg-desc { font-size: 11px; color: rgba(223,230,223,0.6); line-height: 1.35; margin-bottom: 5px; }
.upg-level { font-size: 11px; color: rgba(223,230,223,0.75); }
.upg-level b { color: #f0cf9a; }
.upg-btn { padding: 9px 16px; font-size: 11px; letter-spacing: 1px; white-space: nowrap; }

.rod-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.rod-card {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  border-radius: 10px; padding: 12px 8px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
}
.rod-card.active { border-color: #f0cf9a; box-shadow: 0 0 14px rgba(240,207,154,0.4); }
.rod-card canvas { image-rendering: pixelated; }
.rod-name { font-size: 12px; font-weight: 700; color: #eef2ea; letter-spacing: 0.5px; }
.rod-btn { padding: 7px 14px; font-size: 10px; }

.btn.locked { opacity: 0.4; cursor: not-allowed; }
.btn.locked:hover { background: rgba(232,184,120,0.12); color: #f0cf9a; box-shadow: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-left">
      <div class="hud-chip">$ <b id="money">0</b></div>
      <div id="upgradeBtn" title="Upgrades">🛠️</div>
    </div>
    <div class="hud-right">
      <div id="gambleBtn" title="Gamble" style="display:none;">🪙</div>
      <div id="backpackBtn" title="Inventory">🎒</div>
    </div>
  </div>
  <div id="castHint">Press <kbd>Space</kbd> to cast</div>

  <!-- Phase 2: colour-matching minigame -->
  <div class="overlay" id="minigameScreen">
    <div class="subtitle">Something's biting — match the colours!</div>
    <div id="timerBarTrack"><div id="timerBarFill"></div></div>
    <div class="square-grid" id="squareGrid"></div>
    <div id="minigameMessage"></div>
  </div>

  <!-- Phase 3: catch reveal -->
  <div class="overlay" id="catchScreen">
    <div id="catchRarity">Common</div>
    <div class="title" id="catchName" style="font-size:32px;">Carp</div>
    <canvas id="catchSpriteCanvas"></canvas>
    <div class="hud-chip" id="catchValueChip">$ <b id="catchValue">10</b></div>
    <div class="btn-row">
      <div class="btn" id="sellBtn">Sell</div>
      <div class="btn" id="storeBtn">Store</div>
    </div>
  </div>

  <!-- Phase 4: inventory -->
  <div class="overlay" id="inventoryScreen">
    <div id="inventoryClose" class="close-x">✕</div>
    <div id="inventoryTitle">Tackle Box</div>
    <div class="inventory-grid" id="inventoryGrid"></div>
    <div id="inventoryEmpty">Nothing caught yet — go cast a line!</div>
  </div>

  <!-- Phase 5: gamble / slot machine -->
  <div class="overlay" id="gambleScreen">
    <div id="gambleClose" class="close-x">✕</div>
    <div class="title" style="font-size:28px;">Lucky Dip</div>
    <div class="subtitle" id="gambleSub">Spend 3 of a kind for a spin</div>
    <div class="stack-select" id="stackSelect"></div>
    <div id="gambleEmpty">Need at least 3 of one fish to play.</div>
    <div class="reel-row">
      <canvas class="reel-canvas" id="reel0" width="56" height="56"></canvas>
      <canvas class="reel-canvas" id="reel1" width="56" height="56"></canvas>
      <canvas class="reel-canvas" id="reel2" width="56" height="56"></canvas>
      <div id="lever"><div id="leverHandle"></div></div>
    </div>
    <div id="gambleResult"></div>
  </div>

  <!-- Phase 6: upgrades -->
  <div class="overlay" id="upgradeScreen">
    <div id="upgradeClose" class="close-x">✕</div>
    <div class="title" style="font-size:26px; margin-bottom:14px;">Upgrades</div>
    <div class="menu-tabs">
      <div class="tab-btn active" id="tabStats">Stats</div>
      <div class="tab-btn" id="tabRods">Rods</div>
    </div>
    <div class="panel active" id="panelStats">
      <div class="stat-upgrade-list" id="statUpgradeList"></div>
    </div>
    <div class="panel" id="panelRods">
      <div class="rod-grid" id="rodGrid"></div>
    </div>
  </div>
</div>

<script>
// ===================================================================
//  DRIFTLINE — a misty-pond fishing game
//  Phase 1: scene, boat/character, and the cast -> wait -> reel loop.
//  Structural sibling of quickdraw.html / asteroid-shooter.html: canvas-
//  drawn procedural pixel sprites, fixed virtual stage scaled via
//  transform, HUD chips, Web-Audio SFX, requestAnimationFrame loop.
// ===================================================================

const VW = 480, VH = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
canvas.width = VW; canvas.height = VH;
ctx.imageSmoothingEnabled = false;

let SCALE = 1;
function fitStage() {
  const pad = 20;
  const s = Math.min((window.innerWidth - pad) / VW, (window.innerHeight - pad) / VH);
  SCALE = (isFinite(s) && s > 0) ? Math.max(0.25, s) : 1;
  stage.style.transform = 'scale(' + SCALE + ')';
}
window.addEventListener('resize', fitStage);
window.addEventListener('load', fitStage);
fitStage();
requestAnimationFrame(fitStage);
setTimeout(fitStage, 200);

// -------------------------------------------------------------------
//  PIXEL SPRITE FACTORY
// -------------------------------------------------------------------
function makeSprite(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  draw(g, w, h);
  return c;
}

// -------------------------------------------------------------------
//  AUDIO — synthesized Web Audio SFX, same approach as the other games
// -------------------------------------------------------------------
let actx = null;
let audioFailed = false;
function audio() {
  if (actx || audioFailed) return actx;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { audioFailed = true; actx = null; }
  return actx;
}
function blip(freq, dur, type, vol, slideTo) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.06, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function noiseBurst(dur, vol, filterHz, type) {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain(); g.gain.value = vol || 0.15;
  const f = a.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = filterHz || 1600;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}
const sfx = {
  castWhoosh: () => blip(500, 0.16, 'sawtooth', 0.05, 180),
  splash: () => { noiseBurst(0.28, 0.18, 900, 'lowpass'); blip(160, 0.18, 'sine', 0.08, 70); },
  reelClick: () => blip(700, 0.03, 'square', 0.04, 900),
  click: () => blip(500, 0.04, 'square', 0.035, 700),
  select: () => blip(620, 0.05, 'triangle', 0.05, 760),
  match: () => { blip(660, 0.1, 'triangle', 0.06, 880); setTimeout(() => blip(880, 0.14, 'triangle', 0.06, 1180), 90); },
  wrong: () => blip(160, 0.18, 'sawtooth', 0.07, 90),
  tick: () => blip(900, 0.04, 'square', 0.03, 900),
  fail: () => { blip(300, 0.3, 'sawtooth', 0.07, 100); setTimeout(() => blip(220, 0.35, 'sawtooth', 0.07, 70), 140); },
  reveal: () => { blip(500, 0.1, 'triangle', 0.05, 700); setTimeout(() => blip(700, 0.14, 'triangle', 0.06, 980), 100); setTimeout(() => blip(980, 0.2, 'triangle', 0.06, 1200), 220); },
  sell: () => { blip(880, 0.06, 'square', 0.05, 1180); setTimeout(() => blip(1180, 0.1, 'square', 0.05, 1480), 70); },
  store: () => blip(320, 0.12, 'sine', 0.06, 220),
  leverPull: () => { noiseBurst(0.08, 0.1, 500, 'lowpass'); blip(200, 0.1, 'square', 0.05, 120); },
  reelStop: () => blip(500, 0.05, 'square', 0.05, 380),
  gambleWin: () => { blip(700, 0.1, 'triangle', 0.06, 940); setTimeout(() => blip(940, 0.16, 'triangle', 0.07, 1250), 100); },
  gambleLose: () => blip(220, 0.22, 'sawtooth', 0.06, 90),
  upgrade: () => { blip(440, 0.08, 'triangle', 0.05, 660); setTimeout(() => blip(660, 0.1, 'triangle', 0.05, 880), 70); },
};

// -------------------------------------------------------------------
//  PERSISTENCE
// -------------------------------------------------------------------
const SAVE_KEY = 'driftlineSave';
function loadSave() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    return {
      money: raw.money || 0,
      inventory: raw.inventory || {},
      upgrades: Object.assign({ luck: 0, speed: 0, market: 0 }, raw.upgrades || {}),
      rods: raw.rods || ['basic'],
      equippedRod: raw.equippedRod || 'basic',
    };
  } catch (e) {
    return { money: 0, inventory: {}, upgrades: { luck: 0, speed: 0, market: 0 }, rods: ['basic'], equippedRod: 'basic' };
  }
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
let save = loadSave();

// -------------------------------------------------------------------
//  BACKGROUND — misty pond: sky, treeline, water with reflection bands
// -------------------------------------------------------------------
const BG = makeSprite(VW, VH, (g, w, h) => {
  // warmer golden-hour sky: deep teal up top, softening to a dusky
  // amber near the horizon instead of a flat cool grey-green
  const sky = g.createLinearGradient(0, 0, 0, h * 0.5);
  sky.addColorStop(0, '#2c3c3e'); sky.addColorStop(0.45, '#4a5c54');
  sky.addColorStop(0.78, '#7c7458'); sky.addColorStop(1, '#9c8a5e');
  g.fillStyle = sky; g.fillRect(0, 0, w, h * 0.5);

  // a scatter of quiet stars high up, for a bit of stillness/magic
  g.fillStyle = 'rgba(240,240,225,0.4)';
  const stars = [[40, 18], [120, 38], [300, 14], [380, 52], [200, 66], [440, 28], [70, 60], [260, 30]];
  for (const [sx, sy] of stars) g.fillRect(sx, sy, 1, 1);

  // warm lantern-toned sun/moon glow — layered rings for a softer,
  // richer look than a single flat disc
  g.fillStyle = 'rgba(240,200,140,0.22)';
  g.beginPath(); g.arc(w * 0.72, h * 0.22, 64, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(248,212,155,0.42)';
  g.beginPath(); g.arc(w * 0.72, h * 0.22, 32, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,232,195,0.75)';
  g.beginPath(); g.arc(w * 0.72, h * 0.22, 14, 0, Math.PI * 2); g.fill();

  function pine(x, y, s, col) {
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(x, y - 30 * s);
    g.lineTo(x - 13 * s, y);
    g.lineTo(x + 13 * s, y);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(x, y - 20 * s);
    g.lineTo(x - 16 * s, y + 8 * s);

//  treeline, same technique as quickdraw's clouds but hazier
// -------------------------------------------------------------------
function makeFog(seed, w) {
  let s = seed * 733 + 91;
  const rnd = () => { s = (s * 16807) % 2147483647; return (s % 1000) / 1000; };
  const h = Math.round(w * 0.36);
  return makeSprite(w, h, (g, cw, ch) => {
    g.fillStyle = 'rgba(225,232,225,0.16)';
    const baseCx = cw / 2, baseCy = ch * 0.6, baseRx = cw * 0.48, baseRy = ch * 0.34;
    g.beginPath(); g.ellipse(baseCx, baseCy, baseRx, baseRy, 0, 0, Math.PI * 2); g.fill();
    let x = cw * 0.2;
    const bumps = 3 + Math.floor(rnd() * 2);
    for (let i = 0; i < bumps; i++) {
      const r = ch * 0.3 * (0.6 + rnd() * 0.5);
      g.beginPath(); g.arc(x, baseCy - baseRy * 0.4, r, 0, Math.PI * 2); g.fill();
      x += r * 1.3;
    }
  });
}

// `chance` is now each fish's SHARE WITHIN ITS TIER (sums to 1 per tier,
// not across the whole table) since every tier now holds two species —

const FISH_CONFIG = [

  { id: 'flathead', name: 'Flathead', rarity: 'common', value: 15, chance: 0.5 },

  { id: 'angelfish', name: 'Angelfish', rarity: 'epic', value: 150, chance: 0.5 },
  { id: 'seabass', name: 'Giant Sea Bass', rarity: 'epic', value: 160, chance: 0.5 },
  { id: 'squid', name: 'Colossal Squid', rarity: 'legendary', value: 500, chance: 0.5 },

];

// Base tier weights (sum to 100) — the same 50/32/11/5/2 split as before,
// now shared between two fish per tier instead of one.
const TIER_WEIGHTS = { common: 50, uncommon: 32, rare: 11, epic: 5, legendary: 2 };

// Luck (Phase 6) shifts weight away from the common tier toward the rest,
// proportional to their existing relative split. Common has an effective
// floor of 5% so odds never go negative or degenerate even though Luck
// itself has no purchase cap — see buyStatUpgrade's comment for how that
// plays out at high levels. Operates on tier weights, then splits each
// tier's weight across its fish by their intra-tier `chance` share.
function getEffectiveFishWeights() {
  const baseCommon = TIER_WEIGHTS.common;
  const commonFloorPct = 5;
  const maxRemovable = Math.max(0, baseCommon - commonFloorPct);
  const luckPercent = save.upgrades.luck * 2;
  const removed = Math.min(luckPercent, maxRemovable);

  const tierWeights = { common: baseCommon - removed };
  for (const tier in TIER_WEIGHTS) {
    if (tier === 'common') continue;
    const oldWeight = TIER_WEIGHTS[tier];
    tierWeights[tier] = oldWeight + removed * (oldWeight / baseCommon);
  }
  // re-normalize to guard against floating-point drift
  const tierTotal = Object.values(tierWeights).reduce((a, b) => a + b, 0);
  for (const t in tierWeights) tierWeights[t] = tierWeights[t] / tierTotal * 100;

  const weights = {};
  for (const f of FISH_CONFIG) weights[f.id] = tierWeights[f.rarity] * f.chance;
  return weights;
}

function rollFish() {
  const weights = getEffectiveFishWeights();
  const r = Math.random() * 100;
  let acc = 0;
  for (const f of FISH_CONFIG) {
    acc += weights[f.id];
    if (r <= acc) return f;
  }
  return FISH_CONFIG[0];   // floating-point safety net, should be unreachable
}

// Market (Phase 6) increases sell price only; Store still adds the fish
// at face value, unaffected.
function effectiveSellValue(fish) {
  return Math.round(fish.value * (1 + 0.05 * save.upgrades.market));
}

function buyStatUpgrade(key) {
  const u = STAT_UPGRADES[key];

  renderStatUpgrades();
}

// Gold is a fixed 2% chance; the remaining 98% is split evenly across
// the other five symbols (confirmed with the user rather than assumed).
const SLOT_SYMBOLS = [
  { id: 'gold', name: 'Gold', value: 1000, chance: 0.02 },
  { id: 'boot', name: 'Boot', value: -20, chance: 0.196 },
  { id: 'chest', name: 'Treasure Chest', value: 25, chance: 0.196 },

  { id: 'goldfish', name: 'Goldfish', value: 100, chance: 0.196 },
  { id: 'pirate', name: 'Pirate', value: -100, chance: 0.196 },
];
function rollSlotSymbol() {
  const r = Math.random();
  let acc = 0;
  for (const s of SLOT_SYMBOLS) {
    acc += s.chance;
    if (r <= acc) return s;
  }
  return SLOT_SYMBOLS[1];   // floating-point safety net, should be unreachable
}

function renderStackSelect() {
  const el = document.getElementById('stackSelect');
  el.innerHTML = '';

  if (!eligible.some(f => f.id === selectedGambleFish)) {
    selectedGambleFish = eligible.length ? eligible[0].id : null;

function pullHandle() {
  if (gambleSpinning || !selectedGambleFish) return;
  if ((save.inventory[selectedGambleFish] || 0) < 3) return;
  save.inventory[selectedGambleFish] -= 3;
  if (save.inventory[selectedGambleFish] <= 0) delete save.inventory[selectedGambleFish];
  writeSave();

  gambleSpinning = true;
  document.getElementById('gambleResult').textContent = '';
  sfx.leverPull();
  const durations = [0.9, 1.3, 1.7];
  reels.forEach((r, i) => {
    r.elapsed = 0; r.duration = durations[i]; r.locked = false;
    r.resultId = rollSlotSymbol().id;
  });
  renderStackSelect();
}

function updateGamble(dt) {
  if (!gambleSpinning) return;
  let allLocked = true;
  for (const r of reels) {
    if (r.locked) continue;
    r.elapsed += dt;
    if (r.elapsed >= r.duration) {
      r.locked = true;
      r.displayId = r.resultId;
      sfx.reelStop();
    } else {
      allLocked = false;
      if (Math.floor(r.elapsed / 0.07) !== Math.floor((r.elapsed - dt) / 0.07)) {
        r.displayId = SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)].id;
      }
    }
  }
  if (allLocked) {
    gambleSpinning = false;
    resolveGambleSpin();
  }
}

function resolveGambleSpin() {
  const total = reels.reduce((sum, r) => sum + SLOT_SYMBOLS.find(s => s.id === r.resultId).value, 0);
  setMoney(Math.max(0, save.money + total));
  const resultEl = document.getElementById('gambleResult');
  resultEl.textContent = (total >= 0 ? '+$' : '-$') + Math.abs(total);
  resultEl.style.color = total >= 0 ? '#8fc48a' : '#d9483c';
  if (total >= 0) sfx.gambleWin(); else sfx.gambleLose();
  renderStackSelect();
  updateGambleButtonVisibility();
}

function drawGambleReels() {
  if (!gambleScreenEl.classList.contains('show')) return;
  reels.forEach((r, i) => {
    const canvas = document.getElementById('reel' + i);
    const cctx = canvas.getContext('2d');
    cctx.imageSmoothingEnabled = false;
    cctx.clearRect(0, 0, canvas.width, canvas.height);
    const spr = SLOT_ICONS[r.displayId];
    if (spr) cctx.drawImage(spr, 0, 0, canvas.width, canvas.height);
  });

// -------------------------------------------------------------------
//  CAST / REEL STATE MACHINE
// -------------------------------------------------------------------
const CastState = { IDLE: 0, CASTING: 1, WAITING: 2, REELING: 3 };
let castState = CastState.IDLE;
let stateT = 0;                 // time elapsed in the current state
const CAST_DURATION = 0.45;
const REEL_DURATION = 0.9;

// resting (idle) and back-cast / forward-cast rod angles, in radians,
// measured from straight up (negative = tipped back, positive = forward)
const ROD_IDLE_ANGLE = 0.25;
const ROD_BACK_ANGLE = -0.9;
const ROD_CAST_ANGLE = 0.95;

let rodAngle = ROD_IDLE_ANGLE;
let hook = { x: 0, y: 0, visible: false };
let landPoint = { x: 0, y: 0 };
const castHintEl = document.getElementById('castHint');

function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
function easeInQuad(t) { return t * t; }
function lerp(a, b, t) { return a + (b - a) * t; }

function startCast() {
  if (castState !== CastState.IDLE || minigame) return;
  audio();
  castState = CastState.CASTING;
  stateT = 0;
  // pick a landing spot out on the water, with a little horizontal variety
  landPoint = { x: BOAT_X + (Math.random() - 0.5) * 140, y: VH * 0.66 + Math.random() * VH * 0.14 };
  hook.visible = true;
  sfx.castWhoosh();
  castHintEl.style.display = 'none';
}

function updateCast(dt) {
  stateT += dt;

  if (castState === CastState.CASTING) {
    const t = Math.min(1, stateT / CAST_DURATION);
    // quick whip: back-cast to forward-cast with an ease-out snap
    rodAngle = lerp(ROD_BACK_ANGLE, ROD_CAST_ANGLE, easeOutQuad(t));
    // hook flies from the rod tip to the landing point along a small arc
    const tipStart = rodTipPos(ROD_BACK_ANGLE);
    const flightT = easeInQuad(t);
    const arcH = 70 * Math.sin(Math.PI * t);
    hook.x = lerp(tipStart.x, landPoint.x, flightT);
    hook.y = lerp(tipStart.y, landPoint.y, flightT) - arcH;
    if (t >= 1) {
      hook.x = landPoint.x; hook.y = landPoint.y;
      rodAngle = ROD_IDLE_ANGLE + 0.15;
      sfx.splash();
      burstSplash(landPoint.x, landPoint.y);
      spawnRipple(landPoint.x, landPoint.y, 40, 1.3);
      castState = CastState.WAITING;
      stateT = 0;
    }
  } else if (castState === CastState.WAITING) {
    hook.y = landPoint.y + Math.sin(stateT * 2.2) * 2.5;
    if (Math.floor(stateT * 1.5) !== Math.floor((stateT - dt) * 1.5)) {
      spawnRipple(landPoint.x, landPoint.y, 22, 1.6);
    }
    if (stateT >= currentWaitDuration()) {
      castState = CastState.REELING;
      stateT = 0;
    }
  } else if (castState === CastState.REELING) {
    const t = Math.min(1, stateT / REEL_DURATION);
    const tip = rodTipPos(rodAngle);
    hook.x = lerp(landPoint.x, tip.x, t);
    hook.y = lerp(landPoint.y, tip.y, t);
    rodAngle = ROD_IDLE_ANGLE + 0.15 + Math.sin(stateT * 26) * 0.05 * (1 - t);
    if (Math.floor(stateT * 8) !== Math.floor((stateT - dt) * 8)) sfx.reelClick();
    if (t >= 1) {
      hook.visible = false;
      rodAngle = ROD_IDLE_ANGLE;
      castState = CastState.IDLE;
      stateT = 0;
      startMinigame();
    }
  }
}

function rodTipPos(angle) {
  return { x: ROD_PIVOT.x + Math.sin(angle) * ROD_LEN, y: ROD_PIVOT.y - Math.cos(angle) * ROD_LEN };
}

// -------------------------------------------------------------------
//  PHASE 2 — colour-matching minigame
// -------------------------------------------------------------------
// Four colours, each used twice (8 squares). Kept as a config array so
// it's easy to add more pairs / difficulty tiers later.
const MINIGAME_COLORS = [
  { id: 'amber', col: '#e8b878' },
  { id: 'moss', col: '#6b8f5a' },
  { id: 'slate', col: '#5a7a9a' },
  { id: 'berry', col: '#b85a5a' },
];
const MINIGAME_DURATION = 10;

let minigame = null;   // null when not active; see startMinigame()
const minigameScreenEl = document.getElementById('minigameScreen');
const minigameMessageEl = document.getElementById('minigameMessage');
const timerFillEl = document.getElementById('timerBarFill');

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startMinigame() {
  const grid = document.getElementById('squareGrid');
  grid.innerHTML = '';
  minigameMessageEl.textContent = '';
  timerFillEl.style.width = '100%'; timerFillEl.classList.remove('low');

  const colorSlots = shuffle([...MINIGAME_COLORS, ...MINIGAME_COLORS]);
  const squares = [];
  for (const c of colorSlots) {
    const el = document.createElement('div');
    el.className = 'color-square';
    el.style.background = c.col;
    const sq = { el, colorId: c.id, solved: false };
    el.addEventListener('click', () => onSquareClick(sq));
    grid.appendChild(el);
    squares.push(sq);
  }

  minigame = { timeLeft: MINIGAME_DURATION, solvedCount: 0, selected: null, locked: false, squares, lastTickSecond: MINIGAME_DURATION };
  minigameScreenEl.classList.add('show');
}

function onSquareClick(sq) {
  if (!minigame || minigame.locked || sq.solved || minigame.selected === sq) return;
  sfx.select();
  if (!minigame.selected) {
    minigame.selected = sq;
    sq.el.classList.add('selected');
    return;
  }
  const first = minigame.selected;
  minigame.selected = null;
  if (first.colorId === sq.colorId) {
    first.solved = true; sq.solved = true;
    first.el.classList.remove('selected');
    first.el.classList.add('solved');
    sq.el.classList.add('solved');
    sfx.match();
    minigame.solvedCount++;
    if (minigame.solvedCount >= 4) minigameWin();
  } else {
    minigame.locked = true;
    first.el.classList.remove('selected');
    first.el.classList.add('wrong');
    sq.el.classList.add('wrong');
    sfx.wrong();
    setTimeout(() => {
      first.el.classList.remove('wrong');
      sq.el.classList.remove('wrong');
      if (minigame) minigame.locked = false;
    }, 420);
  }
}

function updateMinigame(dt) {
  if (!minigame) return;
  minigame.timeLeft -= dt;
  const pct = Math.max(0, minigame.timeLeft / MINIGAME_DURATION) * 100;
  timerFillEl.style.width = pct + '%';
  if (minigame.timeLeft <= 3) timerFillEl.classList.add('low');
  const wholeSecond = Math.ceil(minigame.timeLeft);
  if (wholeSecond < minigame.lastTickSecond && wholeSecond >= 0 && wholeSecond <= 3) {
    sfx.tick();
    minigame.lastTickSecond = wholeSecond;
  }
  if (minigame.timeLeft <= 0) minigameLose();
}

function minigameWin() {
  minigame = null;
  minigameMessageEl.textContent = '🎣 Got one!';
  setTimeout(() => {
    minigameScreenEl.classList.remove('show');
    showCatchReveal(rollFish());
  }, 900);
}

    box.innerHTML = `
      <div class="upg-text">
        <div class="upg-name">${u.name}</div>
        <div class="upg-desc">${u.desc}</div>
        <div class="upg-level">LV <b>${level}</b>${u.maxLevel === Infinity ? '' : '/' + u.maxLevel} &middot; ${u.bonusText(level)}</div>
      </div>
      <div class="btn upg-btn${affordable ? '' : ' locked'}">${maxed ? 'MAXED' : '$' + cost}</div>
    `;
    if (affordable) box.querySelector('.upg-btn').onclick = () => buyStatUpgrade(key);
    list.appendChild(box);
  }
}

function renderRodGrid() {
  const grid = document.getElementById('rodGrid');
  grid.innerHTML = '';
  for (const rod of ROD_CONFIG) {
    const owned = save.rods.includes(rod.id);
    const equipped = save.equippedRod === rod.id;
    const card = document.createElement('div');
    card.className = 'rod-card' + (equipped ? ' active' : '');

    const preview = document.createElement('canvas');
    preview.width = 50; preview.height = 60;
    const pctx = preview.getContext('2d');
    pctx.imageSmoothingEnabled = false;
    pctx.drawImage(ROD_PREVIEWS[rod.id], 0, 0);
    card.appendChild(preview);

    const name = document.createElement('div');
    name.className = 'rod-name'; name.textContent = rod.name;
    card.appendChild(name);

    const btn = document.createElement('div');
    const affordable = owned || save.money >= rod.price;
    btn.className = 'btn rod-btn' + (affordable ? '' : ' locked');
    btn.textContent = owned ? (equipped ? 'Equipped' : 'Equip') : ('$' + rod.price);
    if (affordable) btn.onclick = () => (owned ? equipRod(rod.id) : buyRod(rod.id));
    card.appendChild(btn);

    grid.appendChild(card);
  }
}

function buyRod(id) {
  const rod = ROD_CONFIG.find(r => r.id === id);
  if (save.rods.includes(id) || save.money < rod.price) return;
  save.money -= rod.price;
  save.rods.push(id);
  save.equippedRod = id;
  writeSave();
  sfx.upgrade();
  document.getElementById('money').textContent = save.money;
  renderRodGrid();
}
function equipRod(id) {
  if (!save.rods.includes(id) || save.equippedRod === id) return;
  save.equippedRod = id;
  writeSave();
  sfx.click();
  renderRodGrid();
}

document.getElementById('upgradeBtn').addEventListener('click', openUpgradePanel);
document.getElementById('upgradeClose').addEventListener('click', () => {
  sfx.click();
  upgradeScreenEl.classList.remove('show');
});
document.getElementById('tabStats').addEventListener('click', () => {
  sfx.click();
  document.getElementById('tabStats').classList.add('active');
  document.getElementById('tabRods').classList.remove('active');
  document.getElementById('panelStats').classList.add('active');
  document.getElementById('panelRods').classList.remove('active');
});
document.getElementById('tabRods').addEventListener('click', () => {
  sfx.click();
  document.getElementById('tabRods').classList.add('active');
  document.getElementById('tabStats').classList.remove('active');
  document.getElementById('panelRods').classList.add('active');
  document.getElementById('panelStats').classList.remove('active');
});

document.getElementById('money').textContent = save.money;
updateGambleButtonVisibility();

// -------------------------------------------------------------------
//  UPDATE
// -------------------------------------------------------------------
let lastT = performance.now();
function update(dt) {
  for (const f of fogBanks) {
    f.x += f.speed * dt;
    if (f.x - f.spr.width / 2 > VW) f.x = -f.spr.width / 2;
  }
  for (const fl of fireflies) {
    fl.phase += dt * fl.speed;
    fl.x = fl.baseX + Math.sin(fl.phase) * fl.radius;
    fl.y = fl.baseY + Math.cos(fl.phase * 0.7) * fl.radius * 0.6;
  }
  for (const r of ripples) r.age += dt;
  ripples = ripples.filter(r => r.age < r.life);
  for (const p of particles) {
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
  }
  particles = particles.filter(p => p.age < p.life);

  updateCast(dt);
  updateMinigame(dt);
  updateGamble(dt);
}

// -------------------------------------------------------------------
//  DRAW
// -------------------------------------------------------------------
function drawRodAndLine() {
  const tip = rodTipPos(rodAngle);
  const pal = ROD_PALETTES[save.equippedRod] || ROD_PALETTES.basic;

  ctx.save();
  if (pal.glow) { ctx.shadowColor = pal.glow; ctx.shadowBlur = 6; }
  ctx.strokeStyle = pal.main; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ROD_PIVOT.x, ROD_PIVOT.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = pal.hi; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ROD_PIVOT.x, ROD_PIVOT.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  if (pal.vein) {
    ctx.strokeStyle = pal.vein; ctx.lineWidth = 1.2;
    for (let t = 0.15; t < 0.9; t += 0.22) {
      const px = lerp(ROD_PIVOT.x, tip.x, t), py = lerp(ROD_PIVOT.y, tip.y, t);
      ctx.beginPath(); ctx.moveTo(px - 2, py); ctx.lineTo(px + 2, py + 4); ctx.stroke();
    }
  }

  if (hook.visible) {
    // line from rod tip to hook, with a slight sag for a natural curve
    const midx = (tip.x + hook.x) / 2, midy = (tip.y + hook.y) / 2 + 10;
    ctx.strokeStyle = 'rgba(230,236,230,0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.quadraticCurveTo(midx, midy, hook.x, hook.y); ctx.stroke();
    // bobber
    ctx.fillStyle = '#d9483c';
    ctx.beginPath(); ctx.arc(hook.x, hook.y, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#eee6d8';
    ctx.beginPath(); ctx.arc(hook.x, hook.y - 2, 2, 0, Math.PI * 2); ctx.fill();
  }
}

function drawRipples() {
  for (const r of ripples) {
    const p = r.age / r.life;
    ctx.strokeStyle = `rgba(225,235,228,${0.35 * (1 - p)})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.maxR * p, r.maxR * p * 0.35, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

function draw() {
  ctx.drawImage(BG, 0, 0);
  for (const f of fogBanks) ctx.drawImage(f.spr, f.x - f.spr.width / 2, f.y);
  for (const fl of fireflies) {
    ctx.globalAlpha = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(fl.phase * 2.2));
    ctx.drawImage(FIREFLY_SPRITE, fl.x - 2, fl.y - 2);
    ctx.globalAlpha = 1;
  }

  drawRipples();

  // boat + angler, then the dynamically-animated rod/line on top
  ctx.drawImage(ANGLER_SPRITE, ANGLER_DRAW_X, ANGLER_DRAW_Y);
  drawRodAndLine();

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  drawGambleReels();
}

function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

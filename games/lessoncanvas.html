<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LessonCanvas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.min.js" integrity="sha384-a6tyz0CYLcg0g2DeSvkgaOLuDQopfPMUn1mzAgfwGmtTheHbzNtr9ZQ56jiqKYXo" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#f7f8fb; --panel:#ffffff; --border:#e6e8f0; --text:#22252f; --text-dim:#767b8c;
    --accent:#5b6cf0; --accent-dim:#eef0fe; --accent-text:#3542c9;
    --good:#1e9e6b; --good-bg:#e7f8f0; --bad:#d64550; --bad-bg:#fdeceb; --warn:#b8790a; --warn-bg:#fff5e0;
    --radius:14px;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-heading:var(--font-body);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:var(--font-body);color:var(--text);background:var(--bg);}
  .lc-app{display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;z-index:1;}
  input[type=range], input[type=checkbox]{accent-color:var(--accent);}
  .lc-block-heading, .lc-title, .lc-mc-question, .lc-end-title, .lc-overview-title, .lc-source-label{
    font-family:var(--font-heading);
  }

  #lc-ambient-layer{
    position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  }
  .lc-ambient-canvas{position:absolute;inset:0;width:100%;height:100%;}
  .lc-ambient-frame{position:absolute;inset:0;width:100%;height:100%;border:none;}

  /* Sprites: decorative, non-interactive foreground elements (theme.sprites) that
     persist across every slide -- above the app content (z-index above .lc-app's 1)
     but below modals (200) and the dev panel (100), and pointer-events:none on the
     layer itself so a sprite can never sit on top of a button and eat its click. */
  #lc-sprite-layer{
    position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden;
  }
  .lc-sprite{position:absolute;}
  .lc-sprite img{display:block;width:100%;height:auto;}
  .lc-sprite-frame{width:100%;height:100%;border:none;display:block;}
  @keyframes lc-anim-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
  @keyframes lc-anim-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  @keyframes lc-anim-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  @keyframes lc-anim-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes lc-anim-sway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
  .lc-sprite-anim-float{animation:lc-anim-float 3s ease-in-out infinite;}
  .lc-sprite-anim-bounce{animation:lc-anim-bounce 1.2s ease-in-out infinite;}
  .lc-sprite-anim-pulse{animation:lc-anim-pulse 2s ease-in-out infinite;}
  .lc-sprite-anim-spin{animation:lc-anim-spin 6s linear infinite;}
  .lc-sprite-anim-sway{animation:lc-anim-sway 2.4s ease-in-out infinite;transform-origin:bottom center;}

  .lc-devmode-badge{
    font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--bad);
    padding:4px 8px;border-radius:6px;flex-shrink:0;
  }
  .lc-help-devlink{
    font-size:11px;background:transparent;border:1px dashed var(--border);color:var(--text-dim);
    border-radius:6px;padding:3px 8px;cursor:pointer;margin-right:6px;
  }
  .lc-help-devlink:hover{background:var(--accent-dim);}
  .lc-inspect-ai-body{flex:1;overflow-y:auto;padding:16px 20px;}
  .lc-inspect-ai-section-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);
    font-weight:700;margin:16px 0 8px 0;
  }
  .lc-inspect-ai-section-title:first-child{margin-top:0;}
  .lc-inspect-ai-note{
    font-size:12.5px;color:var(--text-dim);background:var(--warn-bg);border:1px solid #f2dca0;
    border-radius:8px;padding:8px 12px;margin-bottom:6px;
  }
  .lc-inspect-ai-code{
    background:#f4f5fb;border-radius:8px;padding:10px 12px;font-family:ui-monospace,Consolas,monospace;
    font-size:11.5px;color:#33374a;white-space:pre-wrap;word-break:break-word;margin:0 0 10px 0;overflow-x:auto;
  }
  .lc-inspect-ai-kv{font-size:12.5px;margin-bottom:4px;}
  .lc-inspect-ai-kv b{color:var(--text);}
  .lc-code-textarea{
    flex:1;margin:16px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;border:1px solid var(--border);
    border-radius:8px;padding:12px;resize:none;background:var(--bg);color:var(--text);
  }
  .lc-code-textarea[readonly]{background:#f4f5fb;color:#555;}
  .lc-code-toolbar{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0;}
  .lc-code-status{font-size:12px;color:var(--text-dim);padding:0 16px 10px 16px;min-height:16px;flex-shrink:0;}

  .lc-header{
    display:flex;align-items:center;gap:16px;padding:14px 22px;background:var(--panel);
    border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .lc-title{font-size:16px;font-weight:700;flex-shrink:0;}
  .lc-progress{display:flex;align-items:center;gap:6px;flex:1;justify-content:center;flex-wrap:wrap;}
  .lc-dot{
    width:9px;height:9px;border-radius:50%;background:var(--border);cursor:pointer;flex-shrink:0;
    transition:background-color .25s ease, transform .25s ease;
    border:none;padding:0;appearance:none;
  }
  .lc-dot.active{background:var(--accent);transform:scale(1.35);}
  .lc-dot.done{background:#c7cbf5;}
  .lc-header-right{display:flex;gap:8px;flex-shrink:0;}
  /* Below ~700px the title + progress dots + six header buttons no longer fit on
     one line. Letting the button group shrink and wrap (rather than overflow or
     clip) keeps every button reachable at any width, at the cost of a taller header. */
  @media (max-width: 700px){
    .lc-header-right{flex-wrap:wrap;flex-shrink:1;justify-content:flex-end;}
  }

  .lc-btn{
    border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 14px;
    font-size:13px;cursor:pointer;font-weight:600;
  }
  .lc-btn:hover{background:var(--accent-dim);}
  .lc-btn:disabled{opacity:.35;cursor:default;background:var(--panel);}
  .lc-btn:focus-visible, .lc-mc-option:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .lc-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .lc-btn-primary:hover{background:#4a5adf;}
  .lc-btn-primary:disabled{opacity:.35;background:var(--accent);}
  .lc-btn-small{padding:5px 10px;font-size:12px;border-radius:8px;}

  .lc-toolbar{
    display:flex;gap:8px;padding:8px 22px;background:var(--panel);border-bottom:1px solid var(--border);
    flex-shrink:0;align-items:center;font-size:12px;color:var(--text-dim);
  }

  .lc-viewport{flex:1;overflow:hidden;position:relative;display:flex;justify-content:center;}
  .lc-slide{
    width:100%;max-width:820px;overflow-y:auto;padding:36px 40px 60px 40px;
  }
  .lc-slide::-webkit-scrollbar{width:8px;}
  .lc-slide::-webkit-scrollbar-thumb{background:#d6d9e6;border-radius:8px;}

  .lc-block{margin-bottom:22px;}
  .lc-block h1,.lc-block h2{margin:0 0 6px 0;font-weight:800;letter-spacing:-.01em;}
  .lc-block-heading{font-size:26px;font-weight:800;margin-bottom:14px;letter-spacing:-.01em;}
  .lc-block-text{font-size:15.5px;line-height:1.65;color:var(--text);}
  .lc-block-text ul{margin:6px 0;padding-left:22px;}
  .lc-cite-link{color:var(--accent-text);text-decoration:underline;text-decoration-style:dotted;cursor:pointer;font-weight:600;}
  .lc-cite-link:hover{text-decoration-style:solid;}
  .lc-block-math{font-size:17px;padding:10px 2px;}
  .lc-block-image{max-width:100%;}
  .lc-block-image img{max-width:100%;border-radius:10px;display:block;}
  .lc-block-image .lc-caption{font-size:12.5px;color:var(--text-dim);margin-top:6px;}
  .lc-block-pdf canvas{max-width:100%;border-radius:10px;border:1px solid var(--border);display:block;}
  .lc-block-video video, .lc-block-video iframe{width:100%;aspect-ratio:16/9;border-radius:10px;border:none;display:block;}
  .lc-video-fallback{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;text-decoration:none;}
  .lc-video-fallback-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75;}
  .lc-video-fallback-play{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:4px;box-shadow:0 0 0 3px rgba(255,255,255,.85);}
  .lc-video-fallback-label{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:8px 12px;font-size:13px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:left;}
  .lc-video-fallback:hover .lc-video-fallback-play{background:rgba(0,0,0,.8);}

  .lc-end-screen{
    position:relative;min-height:360px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;padding:30px;text-align:center;
  }
  .lc-end-confetti{background:linear-gradient(180deg,#eef2ff,#fbfaff);}
  .lc-confetti-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .lc-end-plain{background:var(--panel);border:1px solid var(--border);}
  .lc-end-content{position:relative;z-index:1;}
  .lc-end-emoji{font-size:52px;margin-bottom:10px;}
  .lc-end-title{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px;}
  .lc-end-message{font-size:14.5px;color:var(--text);line-height:1.6;max-width:480px;margin:0 auto;}

  .lc-overview-title, .lc-performance-card .lc-overview-title{font-size:16px;font-weight:800;margin-bottom:10px;}
  .lc-overview-list{margin:0;padding-left:20px;font-size:14.5px;line-height:1.7;color:var(--text);}
  .lc-performance-score{font-size:20px;font-weight:800;color:var(--accent-text);margin-bottom:14px;}
  .lc-performance-list{display:flex;flex-direction:column;gap:6px;}
  .lc-performance-row{display:flex;align-items:flex-start;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--border);}
  .lc-performance-row:first-child{border-top:none;}
  .lc-performance-icon{flex-shrink:0;}
  .lc-performance-label{color:var(--text);}

  .lc-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;
  }

  .lc-widget-button{
    background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 18px;
    font-size:14px;font-weight:700;cursor:pointer;
  }
  .lc-widget-button:hover{background:#4a5adf;}

  .lc-hidden-reveal{display:none;}
  .lc-hidden-reveal.shown{display:block;margin-top:12px;}

  .lc-slider-row{display:flex;align-items:center;gap:12px;}
  .lc-slider-row input[type=range]{flex:1;}
  .lc-slider-val{font-weight:700;min-width:48px;text-align:right;color:var(--accent-text);}
  .lc-slider-label{font-size:13.5px;color:var(--text-dim);margin-bottom:8px;}

  .lc-mc-option{
    display:block;width:100%;text-align:left;background:var(--panel);color:var(--text);border:1.5px solid var(--border);border-radius:10px;
    padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:14.5px;transition:border-color .1s,background .1s;
  }
  .lc-mc-option:hover{border-color:var(--accent);}
  .lc-mc-option.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:700;}
  .lc-mc-option.incorrect{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:700;}
  .lc-mc-option.disabled{cursor:default;}
  .lc-mc-question{font-weight:700;margin-bottom:12px;font-size:15px;}
  .lc-feedback{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;}
  .lc-feedback.good{background:var(--good-bg);color:var(--good);}
  .lc-feedback.bad{background:var(--bad-bg);color:var(--bad);}

  .lc-reveal-toggle{
    background:transparent;border:1.5px dashed var(--border);color:var(--accent-text);border-radius:10px;
    padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .lc-reveal-toggle:hover{background:var(--accent-dim);}

  .lc-num-row{display:flex;gap:8px;align-items:center;}
  .lc-num-row input[type=text]{
    border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;font-size:14.5px;width:140px;
  }

  .lc-steps-list{margin-top:10px;padding:10px 14px;background:#f4f5fb;border-radius:9px;font-size:13.5px;}
  .lc-steps-list ol{margin:0;padding-left:18px;}
  .lc-steps-list li{margin-bottom:4px;}

  .lc-warn-banner{
    display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);
    border:1px solid #f2dca0;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:10px;font-weight:600;
  }

  .lc-lib-warning-banner{
    display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);
    border-bottom:1px solid #f2dca0;padding:9px 16px;font-size:12.5px;font-weight:600;flex-shrink:0;
  }
  .lc-lib-warning-banner span{flex:1;}
  .lc-lib-warning-dismiss{
    border:none;background:transparent;color:var(--warn);cursor:pointer;font-size:14px;
    width:22px;height:22px;border-radius:5px;flex-shrink:0;
  }
  .lc-lib-warning-dismiss:hover{background:rgba(0,0,0,.06);}

  .lc-custom-frame{width:100%;border:1px solid var(--border);border-radius:10px;min-height:120px;display:block;}

  .lc-footer{
    display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:var(--panel);
    border-top:1px solid var(--border);flex-shrink:0;
  }

  .lc-dev-panel{
    position:fixed;top:0;right:0;bottom:0;width:420px;max-width:90vw;background:var(--panel);border-left:1px solid var(--border);
    box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:100;display:flex;flex-direction:column;padding:16px;
  }
  .lc-dev-panel textarea{
    flex:1;font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--border);border-radius:8px;
    padding:10px;resize:none;margin:10px 0;
  }
  .lc-dev-panel-header{display:flex;justify-content:space-between;align-items:center;}
  .lc-dev-status{font-size:12px;color:var(--text-dim);margin-top:6px;min-height:16px;}

  .lc-empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);
    text-align:center;gap:10px;padding:40px;
  }

  .lc-modal-backdrop{
    position:fixed;inset:0;background:rgba(20,22,30,.45);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .lc-modal-panel{
    background:var(--panel);border-radius:16px;width:min(1100px,96vw);height:min(760px,90vh);
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .lc-modal-header{
    display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
    border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .lc-modal-header strong{font-size:14px;}
  .lc-modal-body{flex:1;min-height:0;}
  .lc-modal-body iframe{width:100%;height:100%;border:none;display:block;}
  .lc-modal-body-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 20px;}

  .lc-whiteboard-window{
    position:fixed;z-index:250;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 16px 44px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;
    min-width:320px;min-height:280px;
  }
  .lc-whiteboard-titlebar{
    display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
    background:var(--accent-dim);border-bottom:1px solid var(--border);cursor:move;user-select:none;
    flex-shrink:0;touch-action:none;
  }
  .lc-whiteboard-titlebar strong{font-size:13px;}
  .lc-whiteboard-subtitle{font-weight:400;font-size:11px;color:var(--text-dim);margin-left:4px;}
  .lc-whiteboard-toolbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;
    border-bottom:1px solid var(--border);flex-shrink:0;font-size:12px;color:var(--text-dim);
  }
  .lc-wb-colors{display:flex;gap:6px;}
  .lc-wb-swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
  .lc-wb-swatch.active{border-color:var(--text);}
  .lc-wb-size-label{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .lc-wb-size-label input[type=range]{width:70px;}
  .lc-wb-eraser-toggle.active{background:var(--accent);color:#fff;}
  .lc-whiteboard-canvas-wrap{flex:1;min-height:0;position:relative;background:#fff;}
  .lc-whiteboard-canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;}
  .lc-whiteboard-resize-handle{
    position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;touch-action:none;
    background:linear-gradient(135deg,transparent 50%,var(--text-dim) 50%);opacity:.5;border-radius:2px;
  }

  .lc-ai-panel{width:420px;max-width:94vw;height:min(600px,86vh);}
  .lc-ai-messages{flex:1;min-height:0;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
  .lc-ai-msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
  .lc-ai-msg-user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
  .lc-ai-msg-bot{align-self:flex-start;background:var(--accent-dim);color:var(--text);border-bottom-left-radius:4px;}
  .lc-ai-msg-error{align-self:flex-start;background:var(--bad-bg);color:var(--bad);}
  .lc-ai-inputrow{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;}
  .lc-ai-inputrow textarea{
    flex:1;resize:none;border:1px solid var(--border);border-radius:10px;padding:8px 10px;
    font-size:13.5px;font-family:inherit;min-height:38px;max-height:100px;
  }

  .lc-badge{
    display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;
    padding:0 4px;margin-left:5px;border-radius:8px;background:var(--accent);color:#fff;
    font-size:10px;font-weight:800;vertical-align:middle;
  }
  .lc-sources-toolbar{display:flex;justify-content:flex-end;padding:0 20px 8px 20px;flex-shrink:0;}
  .lc-source-card{
    display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;margin-bottom:10px;transition:outline-color .3s ease;
  }
  .lc-source-card-flash{outline:3px solid var(--accent);outline-offset:2px;}
  .lc-source-icon{font-size:20px;flex-shrink:0;line-height:1;}
  .lc-source-main{flex:1;min-width:0;}
  .lc-source-label-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px;}
  .lc-source-label{font-weight:700;font-size:14px;word-break:break-word;margin-bottom:0;}
  .lc-source-manual-tag{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);
    background:#eef0f2;padding:2px 6px;border-radius:5px;flex-shrink:0;
  }
  .lc-icon-btn-delete{
    flex-shrink:0;border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--text-dim);
    width:26px;height:26px;border-radius:6px;
  }
  .lc-icon-btn-delete:hover{background:var(--bad-bg);color:var(--bad);}
  .lc-source-sub{font-size:12px;color:var(--text-dim);word-break:break-all;}
  .lc-source-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;}
  .lc-source-thumb{max-width:100%;max-height:160px;border-radius:8px;display:block;margin-top:8px;}
  .lc-source-pdf-preview canvas{max-width:100%;border-radius:8px;border:1px solid var(--border);margin-top:8px;}
  .lc-sources-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:30px 10px;}

  .lc-inspect-section-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);
    font-weight:700;margin:16px 0 8px 0;
  }
  .lc-inspect-section-title:first-child{margin-top:0;}
  .lc-inspect-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .lc-inspect-name{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:13px;color:var(--accent-text);margin-bottom:4px;}
  .lc-inspect-desc{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:8px;}
  .lc-inspect-example{
    background:#f4f5fb;border-radius:7px;padding:8px 10px;font-family:ui-monospace,Consolas,monospace;
    font-size:11.5px;color:#33374a;white-space:pre-wrap;word-break:break-word;margin:0;user-select:text;
  }
</style>
</head>
<body>
<div id="lc-ambient-layer"></div>
<div id="lc-sprite-layer"></div>
<div id="lc-root" class="lc-app"></div>

<script>
/* =========================================================================
   LessonCanvas — JSON-driven interactive teaching shell.
   Public entry point: window.loadLesson(lessonObject)
   ========================================================================= */
(function(){

  const root = document.getElementById('lc-root');

  // ---- state ----
  let lesson = { title:'Untitled Lesson', slides:[] };
  let currentSlide = 0;
  let assets = {}; // id -> {kind:'image', dataUrl} | {kind:'pdf', doc: pdfjs document, pageCount}
  let assetSeq = 0;
  // blockId -> { type, correct, selected|value, question } — recorded whenever a
  // graded block (multiple_choice/number_input) is answered, for two purposes:
  // (1) letting an answer survive navigating away and back (opt out per-block via
  //     the AI-authored `lockAnswer:false`, never a student-facing control), and
  // (2) powering the performance_summary end-screen block, which reads this
  //     regardless of lockAnswer so scoring always works even if the UI doesn't lock.
  let answerState = {};

  // blockId -> arbitrary UI-state fields (slider `value`, buildStepsUI's `stepsShown`
  // counter, ...) -- a sibling of answerState, but for widget presentation state
  // rather than graded answers. renderSlide() rebuilds the DOM from scratch on every
  // navigation, so without this a slider snaps back to its default and revealed hint
  // steps disappear the moment you navigate away and back. Blocks with no "id" can't
  // be keyed into this store, so their state just doesn't persist (warned once per
  // render, consistent with checkBlockIds()).
  let widgetState = {};

  // ---- theming ----
  // A lesson can set a top-level `theme` field to restyle the whole shell: colors,
  // fonts, corner radius, and an optional decorative ambient layer behind the
  // slide content (a built-in like "stars", or AI-authored custom HTML/JS for
  // anything else). Applying a theme just sets CSS custom properties, so every
  // existing color reads from var(...) and repaints automatically.
  const THEME_DEFAULTS = {
    bg:'#f7f8fb', panel:'#ffffff', border:'#e6e8f0', text:'#22252f', textDim:'#767b8c',
    accent:'#5b6cf0', accentDim:'#eef0fe', accentText:'#3542c9',
    good:'#1e9e6b', goodBg:'#e7f8f0', bad:'#d64550', badBg:'#fdeceb', warn:'#b8790a', warnBg:'#fff5e0',
    radius:'14px',
    fontBody:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif',
    fontHeading:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'
  };
  const THEME_COLOR_VARS = {
    bg:'--bg', panel:'--panel', border:'--border', text:'--text', textDim:'--text-dim',
    accent:'--accent', accentDim:'--accent-dim', accentText:'--accent-text',
    good:'--good', goodBg:'--good-bg', bad:'--bad', badBg:'--bad-bg', warn:'--warn', warnBg:'--warn-bg'
  };

  // Custom ambient theme elements an AI authors for one lesson (e.g. swimming fish
  // for a theme the built-in library has no preset for) — cleared on every
  // loadLesson() like everything else lesson-scoped, and surfaced in Inspect
  // Elements under a lesson-only section.
  let lessonLocalCatalog = [];

  // Bumped by loadLesson()/undoLastLoad(). renderCustomAmbient/renderCustomSprite each hang
  // a `message` listener and a multi-second timeout off the current lesson; if a new lesson
  // loads before either settles, the old iframe's callback would otherwise fire late and
  // push a stray entry into the *new* lesson's lessonLocalCatalog. Every such callback
  // captures the generation it was created under and checks it against this before acting.
  let lessonGeneration = 0;

  // Only letters/digits/spaces/commas/hyphens/quotes are allowed through -- this
  // value goes straight into an inline style property with no other escaping, so
  // anything shaped like CSS-injection (e.g. `; } body{background:url(...)}`) is
  // rejected in favor of the safe default rather than trusted as authored.
  const SAFE_FONT_PATTERN = /^[A-Za-z0-9 ,'"-]+$/;
  function sanitizeFontValue(value, fallback, label){
    if(typeof value !== 'string' || !value.trim()) return fallback;
    if(!SAFE_FONT_PATTERN.test(value)){
      console.warn('[LessonCanvas] theme.fonts.'+label+' ("'+value+'") contains characters not expected in a CSS font-family value -- using the default font instead.');
      return fallback;
    }
    return value;
  }

  function applyTheme(theme){
    const root = document.documentElement;
    const colors = (theme && theme.colors) || {};
    Object.keys(THEME_COLOR_VARS).forEach(key=>{
      root.style.setProperty(THEME_COLOR_VARS[key], colors[key] || THEME_DEFAULTS[key]);
    });
    root.style.setProperty('--radius', (theme && theme.radius) || THEME_DEFAULTS.radius);
    const fonts = (theme && theme.fonts) || {};
    root.style.setProperty('--font-body', sanitizeFontValue(fonts.body, THEME_DEFAULTS.fontBody, 'body'));
    root.style.setProperty('--font-heading', sanitizeFontValue(fonts.heading || fonts.body, THEME_DEFAULTS.fontHeading, 'heading'));

    renderAmbient(theme);
    renderSprites(theme);
  }

  function renderAmbient(theme){
    const layer = document.getElementById('lc-ambient-layer');
    if(!layer) return;
    layer.innerHTML = '';

    if(theme && theme.ambient && theme.ambient.type === 'stars'){
      renderStarsAmbient(layer, theme.ambient.density);
    }
    if(theme && theme.customAmbient && theme.customAmbient.html){
      renderCustomAmbient(layer, theme.customAmbient);
    }
  }

  // Built-in ambient effect: a soft, slowly-drifting starfield (the space-theme
  // example from the spec). Anything not covered by a built-in goes through
  // renderCustomAmbient() below instead.
  function renderStarsAmbient(container, density){
    const canvas = document.createElement('canvas');
    canvas.className = 'lc-ambient-canvas';
    container.appendChild(canvas);
    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    const ctx = canvas.getContext('2d');
    const count = Math.max(20, Math.min(300, density || 90));
    const stars = [];
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        r: Math.random()*1.5+0.3, phase: Math.random()*Math.PI*2,
        twinkleSpeed: 0.6+Math.random()*1.2, drift: (Math.random()-0.5)*0.15, fall: 0.05+Math.random()*0.12
      });
    }
    function onResize(){ resize(); }
    window.addEventListener('resize', onResize);
    let t = 0;
    function frame(){
      if(!canvas.isConnected){ window.removeEventListener('resize', onResize); return; }
      t += 0.02;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      stars.forEach(s=>{
        s.y += s.fall; s.x += s.drift;
        if(s.y > canvas.height) s.y = 0;
        if(s.x < 0) s.x = canvas.width; if(s.x > canvas.width) s.x = 0;
        const twinkle = 0.5 + 0.5*Math.sin(t*s.twinkleSpeed + s.phase);
        ctx.globalAlpha = 0.2 + twinkle*0.55;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // AI-authored ambient decoration, sandboxed exactly like `custom` blocks
  // (allow-scripts only). "Quality verification" here means: it must actually
  // load and run without failing within a few seconds, proven by a heartbeat
  // signal back to the parent -- not just trusted blindly. If it never signals,
  // it's removed and a console warning is logged.
  function renderCustomAmbient(container, customAmbient){
    const ifr = document.createElement('iframe');
    ifr.className = 'lc-ambient-frame';
    ifr.setAttribute('sandbox', 'allow-scripts');
    const errorListener = `
<script>
window.__lcAmbientFailed = false;
window.addEventListener('error', function(){ window.__lcAmbientFailed = true; });
<\/script>
`;
    const readinessCheck = `
<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    try{
      var hasContent = document.body && document.body.children.length > 0;
      parent.postMessage({ __lessonCanvasAmbientReady: !window.__lcAmbientFailed && hasContent }, '*');
    }catch(e){
      parent.postMessage({ __lessonCanvasAmbientReady:false }, '*');
    }
  }, 50);
});
<\/script>
`;
    ifr.srcdoc = errorListener + (customAmbient.html || '') + readinessCheck;
    container.appendChild(ifr);

    const myGeneration = lessonGeneration;
    let settled = false;
    function onMsg(e){
      if(settled || e.source !== ifr.contentWindow || !e.data || typeof e.data.__lessonCanvasAmbientReady === 'undefined') return;
      settled = true;
      clearTimeout(timeoutId);
      window.removeEventListener('message', onMsg);
      if(myGeneration !== lessonGeneration) return; // a newer lesson has since loaded; this result is stale
      if(e.data.__lessonCanvasAmbientReady === true){
        lessonLocalCatalog.push({
          type: 'theme.customAmbient',
          desc: (customAmbient.description || 'AI-authored decorative theme element for this lesson.') + ' (passed load verification)',
          example: JSON.stringify({ theme:{ customAmbient:{ description: customAmbient.description||'...', html:'<canvas>...</canvas>' } } })
        });
      } else {
        console.warn('[LessonCanvas] Custom theme ambient failed verification (script error or produced no content) — removed. Description: ' + (customAmbient.description || '(none given)'));
        if(ifr.isConnected) ifr.remove();
      }
    }
    window.addEventListener('message', onMsg);
    const timeoutId = setTimeout(()=>{
      if(!settled){
        settled = true;
        window.removeEventListener('message', onMsg);
        if(myGeneration !== lessonGeneration) return; // a newer lesson has since loaded; don't touch it
        console.warn('[LessonCanvas] Custom theme ambient failed verification (no response within 3s — likely hung or crashed before signaling) — removed. Description: ' + (customAmbient.description || '(none given)'));
        if(ifr.isConnected) ifr.remove();
      }
    }, 3000);
  }

  // ---- Sprites: decorative, non-interactive foreground elements (theme.sprites) ----
  // Persist across the whole lesson, like theme.ambient/customAmbient, but sit in a
  // fixed corner above the slide content instead of full-screen behind it. Two
  // flavors: a built-in image + animation preset (src), or a fully custom sandboxed
  // sprite (html) verified the exact same way as theme.customAmbient.
  const SPRITE_POSITIONS = ['top-left','top-right','bottom-left','bottom-right'];
  function renderSprites(theme){
    const layer = document.getElementById('lc-sprite-layer');
    if(!layer) return;
    layer.innerHTML = '';
    ((theme && theme.sprites) || []).forEach(sprite=>renderSprite(layer, sprite));
  }
  function renderSprite(layer, sprite){
    if(!sprite || (!sprite.src && !sprite.html)) return;
    const box = document.createElement('div');
    box.className = 'lc-sprite';
    const position = SPRITE_POSITIONS.includes(sprite.position) ? sprite.position : 'bottom-right';
    const offX = (sprite.offset && typeof sprite.offset.x === 'number') ? sprite.offset.x : 16;
    const offY = (sprite.offset && typeof sprite.offset.y === 'number') ? sprite.offset.y : 16;
    box.style.width = sprite.size || '90px';
    box.style[position.includes('top') ? 'top' : 'bottom'] = offY + 'px';
    box.style[position.includes('left') ? 'left' : 'right'] = offX + 'px';

    if(sprite.html){
      renderCustomSprite(box, sprite);
    } else {
      const img = document.createElement('img');
      img.src = resolveAssetSrc(sprite.src);
      img.alt = sprite.description || '';
      const anim = sprite.animation && sprite.animation !== 'none' ? sprite.animation : null;
      if(anim) img.className = 'lc-sprite-anim-' + anim;
      box.appendChild(img);
    }
    layer.appendChild(box);
  }

  // AI-authored custom sprite, sandboxed exactly like theme.customAmbient (allow-scripts
  // only) -- must self-report loading successfully within 3s via the same postMessage
  // handshake, or it's removed and a console warning is logged, so a broken custom
  // sprite can never sit there silently failed or half-drawn.
  function renderCustomSprite(container, sprite){
    const ifr = document.createElement('iframe');
    ifr.className = 'lc-sprite-frame';
    ifr.setAttribute('sandbox', 'allow-scripts');
    const errorListener = `
<script>
window.__lcSpriteFailed = false;
window.addEventListener('error', function(){ window.__lcSpriteFailed = true; });
<\/script>
`;
    const readinessCheck = `
<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    try{
      var hasContent = document.body && document.body.children.length > 0;
      parent.postMessage({ __lessonCanvasSpriteReady: !window.__lcSpriteFailed && hasContent }, '*');
    }catch(e){
      parent.postMessage({ __lessonCanvasSpriteReady:false }, '*');
    }
  }, 50);
});
<\/script>
`;
    ifr.srcdoc = errorListener + (sprite.html || '') + readinessCheck;
    container.appendChild(ifr);

    const myGeneration = lessonGeneration;
    let settled = false;
    function onMsg(e){
      if(settled || e.source !== ifr.contentWindow || !e.data || typeof e.data.__lessonCanvasSpriteReady === 'undefined') return;
      settled = true;
      clearTimeout(timeoutId);
      window.removeEventListener('message', onMsg);
      if(myGeneration !== lessonGeneration) return; // a newer lesson has since loaded; this result is stale
      if(e.data.__lessonCanvasSpriteReady === true){
        lessonLocalCatalog.push({
          type: 'theme.sprites (custom)',
          desc: (sprite.description || 'AI-authored decorative sprite for this lesson.') + ' (passed load verification)',
          example: JSON.stringify({ theme:{ sprites:[{ description: sprite.description||'...', position: sprite.position||'bottom-right', html:'<canvas>...</canvas>' }] } })
        });
      } else {
        console.warn('[LessonCanvas] Custom sprite failed verification (script error or produced no content) — removed. Description: ' + (sprite.description || '(none given)'));
        if(container.isConnected) container.remove();
      }
    }
    window.addEventListener('message', onMsg);
    const timeoutId = setTimeout(()=>{
      if(!settled){
        settled = true;
        window.removeEventListener('message', onMsg);
        if(myGeneration !== lessonGeneration) return; // a newer lesson has since loaded; don't touch it
        console.warn('[LessonCanvas] Custom sprite failed verification (no response within 3s — likely hung or crashed before signaling) — removed. Description: ' + (sprite.description || '(none given)'));
        if(container.isConnected) container.remove();
      }
    }, 3000);
  }

  function recordAnswer(blockId, data){
    if(!blockId) return;
    answerState[blockId] = data;
  }

  function computeLessonScore(){
    const items = [];
    (lesson.slides||[]).forEach(slide=>{
      (slide.blocks||[]).forEach(block=>{
        if((block.type==='multiple_choice' || block.type==='number_input') && block.id){
          const ans = answerState[block.id];
          items.push({
            id: block.id,
            question: block.question || '(untitled question)',
            answered: !!ans,
            correct: !!(ans && ans.correct)
          });
        }
      });
    });
    return {
      items,
      total: items.length,
      answeredCount: items.filter(i=>i.answered).length,
      correctCount: items.filter(i=>i.correct).length
    };
  }

  function uid(prefix){ return (prefix||'id') + '-' + Math.random().toString(36).slice(2,9); }

  // ---- lightweight markdown for `text` blocks ----
  function renderMiniMarkdown(text){
    const lines = String(text||'').split('\n');
    let html = '';
    let inList = false;
    let paraLines = []; // consecutive non-blank, non-list lines being grouped into one <p>

    // Grouping matters for two reasons: (1) a **bold**/*italic* marker split across
    // two source lines never matched when each line became its own <p> -- joining
    // them first lets inlineFormat see the whole paragraph as one string; (2) a blank
    // line used to also emit a literal <br>, which on top of <p>'s own block margin
    // produced visibly double-spaced paragraphs.
    function flushParagraph(){
      if(paraLines.length){
        html += '<p>' + inlineFormat(paraLines.join(' ')) + '</p>';
        paraLines = [];
      }
    }

    lines.forEach(line=>{
      const trimmed = line.trim();
      if(/^[-*]\s+/.test(trimmed)){
        flushParagraph();
        if(!inList){ html += '<ul>'; inList = true; }
        html += '<li>' + inlineFormat(trimmed.replace(/^[-*]\s+/,'')) + '</li>';
      } else {
        if(inList){ html += '</ul>'; inList = false; }
        if(trimmed === ''){ flushParagraph(); }
        else paraLines.push(trimmed);
      }
    });
    flushParagraph();
    if(inList) html += '</ul>';
    return html;
  }
  function inlineFormat(s){
    return s
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/\[(.+?)\]\(cite:(\d+)\)/g, (match, text, num)=>{
        const idx = parseInt(num, 10) - 1;
        const source = (lesson.sources || [])[idx];
        if(!source){
          console.warn('[LessonCanvas] Inline citation cite:'+num+' has no matching entry in lesson.sources (only '+((lesson.sources||[]).length)+' defined) — rendered as plain text.');
          return text;
        }
        return '<a href="#" class="lc-cite-link" data-cite-index="'+idx+'" title="'+escAttr(source.label||'Source')+'">'+text+'</a>';
      });
  }
  function escAttr(str){
    return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  // Inline citations ([quoted text](cite:N), 1-based index into lesson.sources) are
  // delegated from the document root rather than wired per-block, since block HTML
  // is built via innerHTML strings (renderMiniMarkdown) with no per-element hook.
  document.addEventListener('click', (e)=>{
    const link = e.target.closest('.lc-cite-link');
    if(!link) return;
    e.preventDefault();
    const idx = parseInt(link.dataset.citeIndex, 10);
    const source = (lesson.sources || [])[idx];
    if(!source) return;
    if(source.type === 'link' && source.url){
      window.open(source.url, '_blank', 'noopener');
    } else {
      openSourcesModalAt(idx);
    }
  });
  function renderMathIn(el){
    if(window.renderMathInElement){
      try{
        renderMathInElement(el, {
          delimiters: [
            {left:'$$', right:'$$', display:true},
            {left:'$', right:'$', display:false}
          ],
          throwOnError:false
        });
      }catch(e){}
    }
  }

  // ---- asset registry (Phase 5) ----
  function registerImageAsset(dataUrl){
    const id = uid('img');
    assets[id] = { kind:'image', dataUrl };
    return id;
  }
  // pdf.js's own worker is configured here, on first real use, rather than
  // unconditionally at the top of this IIFE -- if the CDN script never loaded, this
  // is the one place that needs to fail (as a readable error a caller can catch),
  // instead of a bare `pdfjsLib is not defined` throw at page-load time taking the
  // entire app down with it before anything else gets a chance to render.
  function ensurePdfWorkerConfigured(){
    if(typeof pdfjsLib === 'undefined'){
      throw new Error('pdf.js failed to load (offline or the CDN is blocked) -- PDF upload/rendering is unavailable.');
    }
    if(!pdfjsLib.GlobalWorkerOptions.workerSrc){
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }
  }
  async function registerPdfAsset(arrayBuffer){
    ensurePdfWorkerConfigured();
    const id = uid('pdf');
    const doc = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
    assets[id] = { kind:'pdf', doc, pageCount: doc.numPages };
    return id;
  }

  // ---- video URL detection ----
  function videoEmbedUrl(src){
    const yt = src.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]+)/);
    if(yt) return { kind:'iframe', provider:'youtube', id: yt[1], url: 'https://www.youtube.com/embed/' + yt[1], watchUrl: 'https://www.youtube.com/watch?v=' + yt[1] };
    const vimeo = src.match(/vimeo\.com\/(\d+)/);
    if(vimeo) return { kind:'iframe', provider:'vimeo', id: vimeo[1], url: 'https://player.vimeo.com/video/' + vimeo[1], watchUrl: 'https://vimeo.com/' + vimeo[1] };
    return { kind:'file', url: src };
  }

  // ---- Phase 6: math verification ----
  // Two independent checks, both must pass for block._verified to stay true:
  //  1. check_expression (evaluated with check_variable=check_value) must equal expected_result --
  //     this only proves the author's own arithmetic is self-consistent with itself.
  //  2. expected_result must agree with block.correct_answer (number_input only) -- this is the
  //     check that actually ties verification back to the value the student is graded against.
  //     Without it, a self-consistent check_expression/expected_result pair could still silently
  //     disagree with correct_answer and nothing would catch it.
  let warnedMathMissing = false;
  function verifyBlock(block){
    const v = block.verification;
    if(!v || !v.check_expression) return; // nothing to auto-check
    if(typeof math === 'undefined'){
      // math.js's CDN script never loaded -- this is an environment problem, not an
      // authoring one, so skip silently (leave _verified untouched, no amber banner)
      // rather than throwing or claiming "the answer key may be incorrect."
      if(!warnedMathMissing){
        warnedMathMissing = true;
        console.warn('[LessonCanvas] math.js failed to load (offline or the CDN is blocked) -- automatic answer verification is unavailable for this session.');
      }
      return;
    }
    if(v.expected_result === undefined) v.expected_result = block.correct_answer;
    try{
      const scope = {}; scope[v.check_variable] = v.check_value;
      const result = math.evaluate(v.check_expression, scope);
      const expected = v.expected_result;
      const ok = typeof result === 'number' && typeof expected === 'number' && Math.abs(result-expected) < 1e-6;
      block._verified = ok;
      block._verifyComputed = result;
      if(!ok){
        console.warn('[LessonCanvas] Verification MISMATCH for block "'+(block.id||'(no id)')+'": '+
          'stated correct_answer='+JSON.stringify(block.correct_answer)+', check_expression="'+v.check_expression+'" '+
          'evaluated to '+result+' but expected_result='+expected);
      }
    }catch(e){
      block._verified = false;
      block._verifyComputed = null;
      console.warn('[LessonCanvas] Verification could not be evaluated for block "'+(block.id||'(no id)')+'": '+e.message);
    }
    // Independent second check: even a self-consistent check_expression/expected_result pair is
    // worthless if expected_result has drifted from the actual answer key (correct_answer) --
    // this is what originally let a wrong correct_answer pass verification cleanly.
    if(block.type === 'number_input' && typeof v.expected_result === 'number' && typeof block.correct_answer === 'number'){
      if(Math.abs(v.expected_result - block.correct_answer) >= 1e-6){
        block._verified = false;
        console.warn('[LessonCanvas] Verification/answer-key DISAGREEMENT for block "'+(block.id||'(no id)')+'": '+
          'verification.expected_result='+v.expected_result+' but block.correct_answer='+block.correct_answer+
          ' -- these describe the same value and must match.');
      }
    }
  }
  // Load-time shape/type validation for every graded block, independent of whether the
  // author opted into `verification`. verifyBlock() above only ever runs for blocks that
  // declare a `verification` field -- every other graded block's correct_answer went
  // completely unchecked. A string correct_answer on a multiple_choice matches no option
  // index, so the app highlights option 0 as "correct" and still tells the student "Not
  // quite"; a missing correct_answer on a number_input makes every comparison NaN, so
  // every answer is wrong forever. Neither case produced any warning before this.
  function validateGradedBlock(block){
    const id = block.id || '(no id)';
    if(block.type === 'multiple_choice'){
      if(!Array.isArray(block.options) || block.options.length < 2){
        block._verified = false;
        console.warn('[LessonCanvas] Invalid multiple_choice block "'+id+'": options must be an array of at least 2 entries, got '+JSON.stringify(block.options));
        return;
      }
      if(typeof block.correct_answer !== 'number'){
        block._verified = false;
        console.warn('[LessonCanvas] Invalid multiple_choice block "'+id+'": correct_answer must be a number (an option index), got '+JSON.stringify(block.correct_answer));
        return;
      }
      if(!Number.isInteger(block.correct_answer) || block.correct_answer < 0 || block.correct_answer > block.options.length - 1){
        block._verified = false;
        console.warn('[LessonCanvas] Invalid multiple_choice block "'+id+'": correct_answer='+block.correct_answer+' is not a valid index into options (0..'+(block.options.length-1)+')');
      }
    } else if(block.type === 'number_input'){
      if(typeof block.correct_answer !== 'number' || !isFinite(block.correct_answer)){
        block._verified = false;
        console.warn('[LessonCanvas] Invalid number_input block "'+id+'": correct_answer must be a finite number, got '+JSON.stringify(block.correct_answer));
      }
      if(block.tolerance !== undefined && (typeof block.tolerance !== 'number' || !isFinite(block.tolerance) || block.tolerance < 0)){
        block._verified = false;
        console.warn('[LessonCanvas] Invalid number_input block "'+id+'": tolerance must be a non-negative finite number when present, got '+JSON.stringify(block.tolerance));
      }
    }
  }

  function runVerificationPass(lessonObj){
    (lessonObj.slides||[]).forEach(slide=>{
      (slide.blocks||[]).forEach(block=>{
        if(block.type==='multiple_choice' || block.type==='number_input'){
          validateGradedBlock(block);
          const structurallyValid = block._verified !== false;
          if(block.verification) verifyBlock(block);
          // a passing arithmetic check_expression can't paper over a structural problem
          // (bad correct_answer/options/tolerance) that validateGradedBlock already found
          if(!structurallyValid) block._verified = false;
        }
      });
    });
  }

  // Block ids key answerState, findBlockById(), and reveal targets, but uniqueness/presence
  // was never checked anywhere. Two blocks sharing an id silently share answer state and
  // findBlockById() only ever resolves the first one; a graded block with no id is silently
  // excluded from performance_summary (computeLessonScore() keys entirely on block.id).
  // Warn-only, deliberately: auto-generating a missing id would break lockAnswer restore
  // across reloads, since the id has to be the exact one the author ships next time too.
  function checkBlockIds(lessonObj){
    const idCounts = new Map();
    function visit(block){
      if(block.id) idCounts.set(block.id, (idCounts.get(block.id)||0) + 1);
      if((block.type === 'multiple_choice' || block.type === 'number_input') && !block.id){
        console.warn('[LessonCanvas] Graded block with no id (question: "'+(block.question||'(untitled)')+'") -- '+
          'it will be silently excluded from performance_summary, since computeLessonScore() keys entirely on block.id.');
      }
      // reveal blocks can nest their own block list in `content`; those blocks are just as
      // capable of colliding on id as top-level ones, so they need to be walked too
      if(block.type === 'reveal' && Array.isArray(block.content)){
        block.content.forEach(visit);
      }
    }
    (lessonObj.slides||[]).forEach(slide=>{
      (slide.blocks||[]).forEach(visit);
    });
    idCounts.forEach((count, id)=>{
      if(count > 1){
        console.warn('[LessonCanvas] Duplicate block id "'+id+'" appears '+count+' times in this lesson -- '+
          'duplicates will share answerState and findBlockById() will only ever resolve the first one.');
      }
    });
  }

  // ---- block renderers ----
  function findBlockById(blockId){
    return document.querySelector('[data-block-id="'+CSS.escape(blockId)+'"]');
  }

  function makeWarnBanner(block){
    const el = document.createElement('div');
    el.className = 'lc-warn-banner';
    el.innerHTML = '⚠️ <span>This question could not be automatically verified — the answer key may be incorrect. '+
      '(stated vs. computed check mismatch — see console for details)</span>';
    return el;
  }

  let currentTargetedIds = new Set();
  function computeTargetedIds(blocks){
    const ids = new Set();
    (blocks||[]).forEach(b=>{
      if(b.type === 'button' && b.action && (b.action.type === 'reveal_block' || b.action.type === 'reveal_hint') && b.action.target){
        ids.add(b.action.target);
      }
      if(b.type === 'slider' && b.on_threshold && b.on_threshold.reveal_block){
        ids.add(b.on_threshold.reveal_block);
      }
      // a reveal block's own nested content can itself contain a button/slider that
      // targets an id elsewhere on the slide (or inside another nested reveal), so it
      // has to be walked too -- this previously only ever looked at top-level blocks,
      // leaving nested targets visible before the trigger that's supposed to reveal them
      if(b.type === 'reveal' && Array.isArray(b.content)){
        computeTargetedIds(b.content).forEach(id=>ids.add(id));
      }
    });
    return ids;
  }

  // The one place a reveal_block/on_threshold target's visibility is changed. Toggles
  // only the `shown` class -- the CSS rule `.lc-hidden-reveal.shown{display:block;...}`
  // already owns display from there, so there is no second, inline-style source of
  // truth that can drift out of sync with the class or get stuck in a state the class
  // alone can't undo.
  function setBlockRevealed(targetEl, shown){
    targetEl.classList.toggle('shown', shown);
    targetEl.style.removeProperty('display');
  }

  function renderBlocks(blocks, container){
    (blocks||[]).forEach(block=>{
      const el = renderBlock(block);
      if(el) container.appendChild(el);
    });
  }

  // renderBlock dispatches purely by looking up BLOCK_REGISTRY[block.type] — there
  // is no separate switch statement to fall out of sync with. BLOCK_REGISTRY (defined
  // further down, once all the individual renderXBlock/renderXWidget functions exist)
  // is also exactly what the Inspect Elements panel reads to document every block
  // type, so a new block type only has to be added in this one place to become both
  // renderable and documented. This is a structural nudge, not an enforced rule —
  // checkBlockRegistryIntegrity() below only console.warns on a mismatch (e.g. a
  // render function with no desc/example), it doesn't block anything from shipping.
  function renderBlock(block){
    const wrap = document.createElement('div');
    wrap.className = 'lc-block';
    if(block.id) wrap.dataset.blockId = block.id;
    // a block targeted by a button's reveal_block/reveal_hint action or a slider's
    // on_threshold starts hidden — otherwise there's nothing for the trigger to reveal
    if(block.id && block.type !== 'reveal' && currentTargetedIds.has(block.id)){
      wrap.classList.add('lc-hidden-reveal');
    }

    const entry = BLOCK_REGISTRY[block.type];
    if(entry){
      entry.render(block, wrap);
    } else {
      const unk = document.createElement('div');
      unk.style.cssText = 'color:#b3261e;font-size:12px;';
      unk.textContent = 'Unsupported block type: ' + block.type;
      wrap.appendChild(unk);
    }
    return wrap;
  }

  function renderHeadingBlock(block, wrap){
    const h = document.createElement('div');
    h.className = 'lc-block-heading';
    h.textContent = block.text || '';
    wrap.appendChild(h);
    renderMathIn(h);
  }
  function renderTextBlock(block, wrap){
    const t = document.createElement('div');
    t.className = 'lc-block-text';
    t.innerHTML = renderMiniMarkdown(block.text || '');
    wrap.appendChild(t);
    renderMathIn(t);
  }
  function renderMathBlock(block, wrap){
    const m = document.createElement('div');
    m.className = 'lc-block-math';
    if(typeof katex === 'undefined'){
      m.textContent = block.latex || ''; // KaTeX's CDN script never loaded -- show the raw source instead of a blank block
    } else {
      try{
        katex.render(block.latex || '', m, { throwOnError:false, displayMode: block.display !== false });
      }catch(e){ m.textContent = block.latex || ''; }
    }
    wrap.appendChild(m);
  }
  function renderImageBlock(block, wrap){
    const box = document.createElement('div');
    box.className = 'lc-block-image';
    const img = document.createElement('img');
    const asset = assets[block.src];
    img.src = asset ? asset.dataUrl : block.src;
    img.alt = block.caption || '';
    box.appendChild(img);
    if(block.caption){
      const cap = document.createElement('div');
      cap.className = 'lc-caption';
      cap.textContent = block.caption;
      box.appendChild(cap);
    }
    wrap.appendChild(box);
  }
  function renderPdfPageBlock(block, wrap){
    const box = document.createElement('div');
    box.className = 'lc-block-pdf';
    const canvas = document.createElement('canvas');
    box.appendChild(canvas);
    wrap.appendChild(box);
    renderPdfPage(block.src, block.page || 1, canvas);
  }
  function renderVideoBlock(block, wrap){
    const box = document.createElement('div');
    box.className = 'lc-block-video';
    const info = videoEmbedUrl(block.src || '');
    // YouTube/Vimeo's iframe embed API requires a real http(s) origin and
    // reliably fails (YouTube Error 153: "Video player configuration error")
    // when loaded from a local file:// page, which is exactly how a
    // LessonCanvas lesson is normally opened. Fall back to a clickable
    // thumbnail/link card in that case instead of showing a broken player;
    // the real inline embed still works fine for an http(s)-hosted copy.
    if(info.kind === 'iframe' && location.protocol === 'file:'){
      box.appendChild(buildVideoFallbackCard(info));
    } else if(info.kind === 'iframe'){
      const ifr = document.createElement('iframe');
      ifr.src = info.url;
      ifr.setAttribute('allowfullscreen','');
      ifr.setAttribute('frameborder','0');
      box.appendChild(ifr);
    } else {
      const v = document.createElement('video');
      v.src = info.url;
      v.controls = true;
      box.appendChild(v);
    }
    wrap.appendChild(box);
  }

  function buildVideoFallbackCard(info){
    const a = document.createElement('a');
    a.className = 'lc-video-fallback';
    a.href = info.watchUrl;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    if(info.provider === 'youtube'){
      const img = document.createElement('img');
      img.className = 'lc-video-fallback-thumb';
      img.src = 'https://img.youtube.com/vi/' + info.id + '/hqdefault.jpg';
      img.alt = '';
      a.appendChild(img);
    }
    const playBadge = document.createElement('div');
    playBadge.className = 'lc-video-fallback-play';
    playBadge.textContent = '▶';
    a.appendChild(playBadge);
    const label = document.createElement('div');
    label.className = 'lc-video-fallback-label';
    label.textContent = 'Watch on ' + (info.provider === 'youtube' ? 'YouTube' : 'Vimeo') + ' ↗';
    a.appendChild(label);
    return a;
  }

  async function renderPdfPage(assetId, pageNum, canvas){
    const asset = assets[assetId];
    if(!asset || asset.kind !== 'pdf'){
      const ctx = canvas.getContext('2d');
      canvas.width = 400; canvas.height = 80;
      ctx.fillStyle = '#fdeceb'; ctx.fillRect(0,0,400,80);
      ctx.fillStyle = '#d64550'; ctx.font = '13px sans-serif';
      ctx.fillText('PDF asset "'+assetId+'" not found in registry', 10, 44);
      return;
    }
    try{
      const page = await asset.doc.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.5 });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    }catch(e){
      const ctx = canvas.getContext('2d');
      canvas.width = 400; canvas.height = 60;
      ctx.fillStyle = '#d64550'; ctx.font = '12px sans-serif';
      ctx.fillText('Could not render page '+pageNum+': '+e.message, 10, 32);
    }
  }

  // ---- Phase 3: base widget library ----
  function runAction(action){
    if(!action) return;
    if(action.type === 'reveal_block' || action.type === 'reveal_hint'){
      const target = findBlockById(action.target);
      if(target){
        const revealEl = target.classList.contains('lc-hidden-reveal') ? target : (target.querySelector('.lc-hidden-reveal') || target);
        setBlockRevealed(revealEl, true);
      } else {
        console.warn('[LessonCanvas] Button action "'+action.type+'" targets id "'+action.target+'", which does not resolve to any block on the current slide.');
      }
    } else if(action.type === 'go_to_slide'){
      const idx = lesson.slides.findIndex(s=>s.id === action.target);
      if(idx >= 0) goToSlide(idx);
    }
  }

  function renderButtonWidget(block, wrap){
    const btn = document.createElement('button');
    btn.className = 'lc-widget-button';
    btn.textContent = block.label || 'Go';
    btn.addEventListener('click', ()=> runAction(block.action));
    wrap.appendChild(btn);
  }

  function renderSliderWidget(block, wrap){
    if(!block.id){
      console.warn('[LessonCanvas] slider "'+(block.label||'(no label)')+'" has no "id" -- its value will not persist across slide navigation.');
    }
    const card = document.createElement('div');
    card.className = 'lc-card';
    if(block.label){
      const lbl = document.createElement('div');
      lbl.className = 'lc-slider-label';
      lbl.textContent = block.label;
      card.appendChild(lbl);
    }
    const row = document.createElement('div');
    row.className = 'lc-slider-row';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = block.min ?? 0;
    input.max = block.max ?? 10;
    input.step = block.step ?? 1;
    // restore a previously-set value on this slide-navigation cycle, if there is one;
    // otherwise honour an authored starting value before falling back to min
    const persisted = block.id && widgetState[block.id];
    input.value = (persisted && typeof persisted.value === 'number') ? persisted.value : (block.value ?? block.min ?? 0);
    const val = document.createElement('span');
    val.className = 'lc-slider-val';
    val.textContent = input.value;
    row.appendChild(input); row.appendChild(val);
    card.appendChild(row);
    wrap.appendChild(card);

    function applyThreshold(){
      if(block.on_threshold && block.on_threshold.reveal_block){
        const target = findBlockById(block.on_threshold.reveal_block);
        if(target){
          const revealEl = target.classList.contains('lc-hidden-reveal') ? target : (target.querySelector('.lc-hidden-reveal') || target);
          // "direction" flips which side of the threshold counts as crossed; default
          // "above" preserves the original >= -only behavior
          const direction = block.on_threshold.direction === 'below' ? 'below' : 'above';
          const crossed = direction === 'below'
            ? parseFloat(input.value) <= parseFloat(block.on_threshold.value)
            : parseFloat(input.value) >= parseFloat(block.on_threshold.value);
          setBlockRevealed(revealEl, crossed);
        }
      }
    }
    // A restored value that already crosses the threshold must reveal its target
    // immediately, not wait for the next drag -- renderBlock() hides targeted blocks
    // by default, so without this a restored slider could disagree with what it's
    // pointing at until the student nudges it. Deferred to a microtask because the
    // target block may not exist in the DOM yet: renderBlocks() appends blocks in
    // order, so a target later in the same slide hasn't been rendered when this
    // slider (rendered first) would otherwise try to look it up synchronously.
    queueMicrotask(applyThreshold);

    input.addEventListener('input', ()=>{
      val.textContent = input.value;
      if(block.id){
        widgetState[block.id] = Object.assign({}, widgetState[block.id], { value: parseFloat(input.value) });
      }
      applyThreshold();
    });
  }

  function buildStepsUI(block, container){
    if(!block.verification || !block.verification.steps || !block.verification.steps.length) return;
    if(!block.id){
      console.warn('[LessonCanvas] '+block.type+' "'+(block.question||'(no question)')+'" has no "id" -- its revealed-steps progress will not persist across slide navigation.');
    }
    const steps = block.verification.steps;
    const persisted = block.id && widgetState[block.id];
    let shown = (persisted && typeof persisted.stepsShown === 'number') ? Math.min(persisted.stepsShown, steps.length) : 0;
    const btn = document.createElement('button');
    btn.className = 'lc-btn lc-btn-small';
    btn.style.marginTop = '8px';
    const list = document.createElement('div');
    list.className = 'lc-steps-list';
    const ol = document.createElement('ol');
    list.appendChild(ol);
    // rebuild whatever was already revealed before this navigation, so the step
    // list picks up exactly where the student left it instead of collapsing back
    // to zero every time renderSlide() rebuilds the DOM from scratch
    for(let i=0; i<shown; i++){
      const li = document.createElement('li');
      li.textContent = steps[i];
      ol.appendChild(li);
      renderMathIn(li);
    }
    list.style.display = shown > 0 ? 'block' : 'none';
    btn.textContent = shown >= steps.length ? 'All steps shown' : 'Show next step ('+(shown+1)+'/'+steps.length+')';
    if(shown >= steps.length) btn.disabled = true;
    btn.addEventListener('click', ()=>{
      if(shown < steps.length){
        const li = document.createElement('li');
        li.textContent = steps[shown];
        ol.appendChild(li);
        renderMathIn(li);
        shown++;
        list.style.display = 'block';
        if(block.id){
          widgetState[block.id] = Object.assign({}, widgetState[block.id], { stepsShown: shown });
        }
      }
      if(shown >= steps.length){
        btn.textContent = 'All steps shown';
        btn.disabled = true;
      } else {
        btn.textContent = 'Show next step ('+(shown+1)+'/'+steps.length+')';
      }
    });
    container.appendChild(btn);
    container.appendChild(list);
  }

  function renderMultipleChoiceWidget(block, wrap){
    const card = document.createElement('div');
    card.className = 'lc-card';
    if(block._verified === false){
      card.appendChild(makeWarnBanner(block));
    }
    const q = document.createElement('div');
    q.className = 'lc-mc-question';
    q.textContent = block.question || '';
    card.appendChild(q);
    renderMathIn(q);

    let answered = false;
    const feedback = document.createElement('div');
    feedback.className = 'lc-feedback';
    feedback.style.display = 'none';
    feedback.setAttribute('aria-live', 'polite'); // announces right/wrong to screen readers as soon as it's set

    const explanationEl = document.createElement('div');
    explanationEl.className = 'lc-hidden-reveal';
    if(block.explanation){
      explanationEl.innerHTML = renderMiniMarkdown(block.explanation);
    }

    function applyAnswer(idx){
      const isCorrect = idx === block.correct_answer;
      card.querySelectorAll('.lc-mc-option').forEach((b,i)=>{
        b.classList.add('disabled');
        if(i === block.correct_answer) b.classList.add('correct');
        else if(i === idx) b.classList.add('incorrect');
      });
      feedback.style.display = 'block';
      feedback.className = 'lc-feedback ' + (isCorrect ? 'good':'bad');
      feedback.textContent = isCorrect ? 'Correct!' : 'Not quite — the correct answer is highlighted above.';
      if(block.explanation){
        explanationEl.classList.add('shown');
        explanationEl.style.display = 'block';
      }
    }

    (block.options||[]).forEach((opt, idx)=>{
      const optBtn = document.createElement('button');
      optBtn.className = 'lc-mc-option';
      optBtn.textContent = opt;
      optBtn.addEventListener('click', ()=>{
        if(answered) return;
        answered = true;
        applyAnswer(idx);
        recordAnswer(block.id, { type:'multiple_choice', selected: idx, correct: idx === block.correct_answer, question: block.question });
      });
      card.appendChild(optBtn);
    });
    card.appendChild(feedback);
    if(block.explanation) card.appendChild(explanationEl);
    buildStepsUI(block, card);
    wrap.appendChild(card);

    // AI-authored flag (never student-facing): whether a previously locked-in
    // answer should be restored, read-only, when the student navigates back here.
    const lockEnabled = block.lockAnswer !== false;
    const existing = block.id && answerState[block.id];
    if(existing && lockEnabled){
      answered = true;
      applyAnswer(existing.selected);
    }
  }

  function renderRevealWidget(block, wrap){
    const card = document.createElement('div');
    const btn = document.createElement('button');
    btn.className = 'lc-reveal-toggle';
    const showLabel = block.label_show || 'Show hint';
    const hideLabel = block.label_hide || 'Hide';
    btn.textContent = showLabel;
    const content = document.createElement('div');
    content.className = 'lc-hidden-reveal';
    if(Array.isArray(block.content)){
      renderBlocks(block.content, content);
    } else if(typeof block.content === 'string'){
      content.innerHTML = renderMiniMarkdown(block.content);
    }
    btn.addEventListener('click', ()=>{
      const shown = content.classList.toggle('shown');
      content.style.display = shown ? 'block' : 'none';
      btn.textContent = shown ? hideLabel : showLabel;
    });
    card.appendChild(btn);
    card.appendChild(content);
    wrap.appendChild(card);
    renderMathIn(content);
  }

  function renderNumberInputWidget(block, wrap){
    const card = document.createElement('div');
    card.className = 'lc-card';
    if(block._verified === false){
      card.appendChild(makeWarnBanner(block));
    }
    const q = document.createElement('div');
    q.className = 'lc-mc-question';
    q.textContent = block.question || '';
    card.appendChild(q);
    renderMathIn(q);

    const row = document.createElement('div');
    row.className = 'lc-num-row';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Your answer';
    const checkBtn = document.createElement('button');
    checkBtn.className = 'lc-btn lc-btn-small lc-btn-primary';
    checkBtn.textContent = 'Check';
    row.appendChild(input); row.appendChild(checkBtn);
    card.appendChild(row);

    const feedback = document.createElement('div');
    feedback.className = 'lc-feedback';
    feedback.style.display = 'none';
    feedback.setAttribute('aria-live', 'polite'); // announces right/wrong to screen readers as soon as it's set
    card.appendChild(feedback);

    function applyAnswer(val, ok){
      input.value = val;
      input.disabled = true;
      checkBtn.disabled = true;
      feedback.style.display = 'block';
      feedback.className = 'lc-feedback ' + (ok ? 'good' : 'bad');
      feedback.textContent = ok ? 'Correct!' : 'Not quite — try again.';
    }

    checkBtn.addEventListener('click', ()=>{
      const val = parseFloat(input.value);
      const tol = block.tolerance ?? 0;
      const ok = isFinite(val) && Math.abs(val - block.correct_answer) <= tol;
      applyAnswer(val, ok);
      recordAnswer(block.id, { type:'number_input', value: val, correct: ok, question: block.question });
    });
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') checkBtn.click(); });

    buildStepsUI(block, card);
    wrap.appendChild(card);

    // AI-authored flag (never student-facing): whether a previously locked-in
    // answer should be restored, read-only, when the student navigates back here.
    const lockEnabled = block.lockAnswer !== false;
    const existing = block.id && answerState[block.id];
    if(existing && lockEnabled){
      applyAnswer(existing.value, existing.correct);
    }
  }

  // Custom widgets are arbitrary-height content in a sandboxed iframe. A fixed/short
  // iframe height forces internal scrolling, which can hide the top of the widget
  // (e.g. a diagram) while the user scrolls down to reach a button below it — a real
  // trap for any AI-authored widget whose content height isn't known in advance.
  // Fix: every custom iframe self-reports its content height via postMessage (the one
  // channel available even without allow-same-origin), and the shell resizes the
  // iframe to fit exactly, so nothing ever scrolls inside it.
  const RESIZE_REPORTER_SNIPPET = `
<script>
(function(){
  function reportSize(){
    var h = Math.max(
      document.documentElement.scrollHeight,
      document.body ? document.body.scrollHeight : 0,
      document.documentElement.getBoundingClientRect().height,
      document.body ? document.body.getBoundingClientRect().height : 0
    );
    parent.postMessage({ __lessonCanvasResize: true, height: h }, '*');
  }
  window.addEventListener('load', reportSize);
  if(window.ResizeObserver){
    new ResizeObserver(reportSize).observe(document.documentElement);
    if(document.body) new ResizeObserver(reportSize).observe(document.body);
  }
  // layout can keep settling after load (fonts, canvas scaling, etc.) — keep
  // re-measuring for a bit rather than trusting a single early snapshot
  [50, 150, 300, 600, 1000, 1800].forEach(function(delay){ setTimeout(reportSize, delay); });

  window.addEventListener('message', function(e){
    if(!e.data || !e.data.__lessonCanvasResize) return;

      if(f.contentWindow === e.source){
        // only ever grow to fit — a later, more-settled measurement should win,
        // but a stray early undershoot must never shrink it back down
        const prevMax = parseFloat(f.dataset.maxReportedHeight || '0');
        const nextMax = Math.max(prevMax, e.data.height);
        if(nextMax > prevMax){
          f.dataset.maxReportedHeight = String(nextMax);

    // seconds after it's actually in the live DOM, since a widget's own
    // internal timers can fire before the surrounding page has finished
    // laying out and painting the iframe box itself.
    let pings = 0;
    const maxPings = 20;
    function ping(){
      pings++;
      const goodEnough = parseFloat(ifr.dataset.maxReportedHeight || '0') > 40;
      if(pings > maxPings || goodEnough || !ifr.isConnected) return;
      try{ ifr.contentWindow.postMessage({ __lessonCanvasRequestResize: true }, '*'); }catch(e){}

  function startConfetti(canvas, container){

    // into the live DOM (renderBlocks appends the returned element afterwards),
    // so clientWidth/Height would read 0 if measured synchronously here — defer
    // sizing (and therefore particle placement) to the next animation frame,
    // by which point the browser has laid the slide out for real.
    const ctx = canvas.getContext('2d');
    const colors = ['#5b6cf0','#d64550','#1e9e6b','#e8a33d','#8a5cf0'];
    let particles = [];
    let ready = false;

    function resize(){
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    function initParticles(){
      resize();
      if(canvas.width < 2 || canvas.height < 2) return false; // still not laid out — try again next frame
      particles = [];
      for(let i=0;i<130;i++){
        particles.push({
          x: Math.random()*canvas.width,
          y: -20 - Math.random()*canvas.height,
          w: 6+Math.random()*6,
          h: 8+Math.random()*8,
          color: colors[Math.floor(Math.random()*colors.length)],
          speed: 1.5+Math.random()*2.5,
          drift: (Math.random()-0.5)*1.5,
          rotation: Math.random()*360,

      if(!canvas.isConnected){ window.removeEventListener('resize', onResize); return; } // slide navigated away
      if(!ready){
        ready = initParticles();
        requestAnimationFrame(frame);
        return;
      }
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p=>{
        p.y += p.speed;
        p.x += p.drift;
        p.rotation += p.rotSpeed;
        if(p.y > canvas.height + 20){ p.y = -20; p.x = Math.random()*canvas.width; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation*Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);

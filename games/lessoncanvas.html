        previousFocus.focus();
      }
    }
    // lets a caller's own "if already open" branch close it (`xModalEl._modalClose()`)
    // without needing to keep a second handle variable alongside the element itself
    backdrop._modalClose = close;

    document.getElementById(closeButtonId).addEventListener('click', close);
    backdrop.addEventListener('mousedown', (e)=>{ if(e.target === backdrop) close(); });

    const handle = { el: backdrop, panel, close };
    modalStack.push(handle);

    if(onMount) onMount(panel, close);

    return handle;
  }

  // ---- embedded calculator (GraphCalc, opened alongside a lesson) ----
  function decodeGraphCalcHtml(){
    const binary = atob(GRAPHCALC_HTML_B64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  let calcModalEl = null;
  function toggleCalculatorModal(){
    if(calcModalEl){ calcModalEl._modalClose(); return; }
    const handle = openModal({
      id: 'calc',
      title: 'Calculator',
      bodyHtml: '<div class="lc-modal-body"><iframe title="Graphing calculator"></iframe></div>',
      // openModal() has already wired the close button, click-outside, and Escape by
      // the time onMount runs, so a decode/load failure below can never leave an
      // undismissable overlay behind.
      onMount(panel){
        // GraphCalc is embedded inline (base64-decoded) rather than loaded via a
        // relative src="graphcalc.html" -- that broke whenever this lesson file was
        // copied, renamed, or opened from somewhere graphcalc.html wasn't sitting
        // right next to it. Embedding it means the calculator travels with this
        // single file no matter where it goes.
        try{
          panel.querySelector('iframe').srcdoc = decodeGraphCalcHtml();
        }catch(err){
          console.error('[LessonCanvas] Calculator failed to load:', err);
          const body = panel.querySelector('.lc-modal-body');
          body.innerHTML = '<div style="padding:20px;color:var(--bad);font-size:14px;">The calculator could not be loaded (' + err.message + '). Close this and continue with the lesson -- this does not affect anything else.</div>';
        }
      },
      onClose(){ calcModalEl = null; }
    });
    calcModalEl = handle.el;
  }

  // ---- Whiteboard (floating, draggable, resizable scratch-drawing window) ----
  let whiteboardWindowEl = null;
  let whiteboardCtx = null;
  let whiteboardDrawing = false;
  let whiteboardLastPoint = null;
  let whiteboardColor = '#1e1e1e';
  let whiteboardErasing = false;
  const WHITEBOARD_COLORS = ['#1e1e1e', '#e53935', '#1e88e5', '#43a047', '#fdd835', '#8e24aa', '#ffffff'];

  function toggleWhiteboardWindow(){
    if(whiteboardWindowEl){ closeWhiteboardWindow(); return; }
    whiteboardWindowEl = document.createElement('div');
    whiteboardWindowEl.className = 'lc-whiteboard-window';
    const startW = Math.min(520, window.innerWidth - 40);
    const startH = Math.min(420, window.innerHeight - 100);
    whiteboardWindowEl.style.left = Math.max(20, (window.innerWidth - startW) / 2) + 'px';
    whiteboardWindowEl.style.top = Math.max(70, (window.innerHeight - startH) / 3) + 'px';
    whiteboardWindowEl.style.width = startW + 'px';
    whiteboardWindowEl.style.height = startH + 'px';
    whiteboardWindowEl.innerHTML = `
      <div class="lc-whiteboard-titlebar" id="lc-whiteboard-titlebar">
        <strong>🖊️ Whiteboard <span class="lc-whiteboard-subtitle">— a visual scratch tool; nothing drawn here is saved or graded</span></strong>
        <button class="lc-btn lc-btn-small" id="lc-whiteboard-close">✕</button>
      </div>
      <div class="lc-whiteboard-toolbar">
        <div class="lc-wb-colors" id="lc-wb-colors"></div>
        <label class="lc-wb-size-label">Pen <input type="range" id="lc-wb-pen-size" min="1" max="30" value="4"></label>
        <button class="lc-btn lc-btn-small" id="lc-wb-eraser-toggle">🧽 Eraser</button>
        <label class="lc-wb-size-label">Eraser <input type="range" id="lc-wb-eraser-size" min="5" max="80" value="24"></label>
        <button class="lc-btn lc-btn-small" id="lc-wb-clear">🗑 Clear all</button>
      </div>
      <div class="lc-whiteboard-canvas-wrap">
        <canvas id="lc-whiteboard-canvas" aria-label="Whiteboard drawing surface — a visual scratch tool, not saved or graded" role="img"></canvas>
      </div>
      <div class="lc-whiteboard-resize-handle" id="lc-whiteboard-resize"></div>
    `;
    document.body.appendChild(whiteboardWindowEl);

    const colorsWrap = document.getElementById('lc-wb-colors');
    WHITEBOARD_COLORS.forEach(c => {
      const sw = document.createElement('button');
      sw.className = 'lc-wb-swatch' + (c === whiteboardColor ? ' active' : '');
      sw.style.background = c;
      if(c === '#ffffff') sw.style.boxShadow = 'inset 0 0 0 1px var(--border)';
      sw.title = c;
      sw.addEventListener('click', () => {
        whiteboardColor = c;
        whiteboardErasing = false;
        document.getElementById('lc-wb-eraser-toggle').classList.remove('active');
        [...colorsWrap.children].forEach(el => el.classList.remove('active'));
        sw.classList.add('active');
      });
      colorsWrap.appendChild(sw);
    });

    const canvas = document.getElementById('lc-whiteboard-canvas');
    setupWhiteboardCanvas(canvas);

    document.getElementById('lc-whiteboard-close').addEventListener('click', closeWhiteboardWindow);
    document.getElementById('lc-wb-eraser-toggle').addEventListener('click', (e) => {
      whiteboardErasing = !whiteboardErasing;
      e.currentTarget.classList.toggle('active', whiteboardErasing);
    });
    document.getElementById('lc-wb-clear').addEventListener('click', () => {
      whiteboardCtx.clearRect(0, 0, canvas.width, canvas.height);
    });

    setupWhiteboardDrag(document.getElementById('lc-whiteboard-titlebar'));
    setupWhiteboardResize(document.getElementById('lc-whiteboard-resize'), canvas);
  }

  function closeWhiteboardWindow(){
    if(!whiteboardWindowEl) return;
    whiteboardWindowEl.remove();
    whiteboardWindowEl = null;
    whiteboardCtx = null;
  }

  function setupWhiteboardCanvas(canvas){
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = Math.round(rect.width);
    canvas.height = Math.round(rect.height);
    whiteboardCtx = canvas.getContext('2d');
    whiteboardCtx.lineCap = 'round';
    whiteboardCtx.lineJoin = 'round';

    canvas.addEventListener('pointerdown', (e) => {
      whiteboardDrawing = true;
      // pointer capture can fail in some embedding contexts; it's an optimization
      // (keeps the stroke going if the pointer leaves the canvas mid-drag), not a
      // requirement, so a failure here must not abort setting the start point below.
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      whiteboardLastPoint = whiteboardCanvasPoint(canvas, e);
      // a single tap/click should leave a dot, not require movement to draw anything
      whiteboardDrawSegment(whiteboardLastPoint, whiteboardLastPoint);
    });
    canvas.addEventListener('pointermove', (e) => {
      if(!whiteboardDrawing) return;
      const pt = whiteboardCanvasPoint(canvas, e);
      whiteboardDrawSegment(whiteboardLastPoint, pt);
      whiteboardLastPoint = pt;
    });
    const endStroke = () => { whiteboardDrawing = false; whiteboardLastPoint = null; };
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);
    canvas.addEventListener('pointerleave', endStroke);
  }

  function whiteboardCanvasPoint(canvas, e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function whiteboardDrawSegment(from, to){
    if(!whiteboardCtx || !from) return;
    const eraserSize = Number(document.getElementById('lc-wb-eraser-size').value);
    const penSize = Number(document.getElementById('lc-wb-pen-size').value);
    whiteboardCtx.globalCompositeOperation = whiteboardErasing ? 'destination-out' : 'source-over';
    whiteboardCtx.strokeStyle = whiteboardColor;
    whiteboardCtx.lineWidth = whiteboardErasing ? eraserSize : penSize;
    whiteboardCtx.beginPath();
    whiteboardCtx.moveTo(from.x, from.y);
    whiteboardCtx.lineTo(to.x, to.y);
    whiteboardCtx.stroke();
  }

  function setupWhiteboardDrag(titlebar){
    let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;
    titlebar.addEventListener('pointerdown', (e) => {
      if(e.target.closest('button')) return;
      dragging = true;
      try{ titlebar.setPointerCapture(e.pointerId); }catch(err){}
      startX = e.clientX; startY = e.clientY;
      const r = whiteboardWindowEl.getBoundingClientRect();
      startLeft = r.left; startTop = r.top;
    });
    titlebar.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      let left = startLeft + dx, top = startTop + dy;
      left = Math.max(0, Math.min(left, window.innerWidth - 80));
      top = Math.max(0, Math.min(top, window.innerHeight - 40));
      whiteboardWindowEl.style.left = left + 'px';
      whiteboardWindowEl.style.top = top + 'px';
    });
    const stop = () => { dragging = false; };
    titlebar.addEventListener('pointerup', stop);
    titlebar.addEventListener('pointercancel', stop);
  }

  function setupWhiteboardResize(handle, canvas){
    let resizing = false, startX = 0, startY = 0, startW = 0, startH = 0;
    handle.addEventListener('pointerdown', (e) => {
      resizing = true;
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      startX = e.clientX; startY = e.clientY;
      const r = whiteboardWindowEl.getBoundingClientRect();
      startW = r.width; startH = r.height;
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', (e) => {
      if(!resizing) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      const newW = Math.max(320, startW + dx);
      const newH = Math.max(280, startH + dy);
      whiteboardWindowEl.style.width = newW + 'px';
      whiteboardWindowEl.style.height = newH + 'px';
      resizeWhiteboardCanvas(canvas);
    });
    const stop = () => { resizing = false; };
    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
  }

  function resizeWhiteboardCanvas(canvas){
    const rect = canvas.parentElement.getBoundingClientRect();
    const newW = Math.round(rect.width), newH = Math.round(rect.height);
    if(canvas.width === newW && canvas.height === newH) return;
    const prev = document.createElement('canvas');
    prev.width = canvas.width; prev.height = canvas.height;
    prev.getContext('2d').drawImage(canvas, 0, 0);
    canvas.width = newW; canvas.height = newH;
    whiteboardCtx = canvas.getContext('2d');
    whiteboardCtx.lineCap = 'round';
    whiteboardCtx.lineJoin = 'round';
    whiteboardCtx.drawImage(prev, 0, 0);
  }

  // ---- Sources section ----
  // A lesson-wide place for the authoring AI to list everything it drew on
  // (links, PDFs, images, plain citations) — separate from slide content, so
  // it's somewhere to both recall from while authoring and for the student to
  // check. Lives on lessonObject.sources, an array of:
  //   { type:'link', url, label }
  //   { type:'image', src, label }   -- src resolves against the asset registry, like image blocks
  //   { type:'pdf', src, label, page }
  //   { type:'text', label }         -- a plain citation with no attachment
  function resolveAssetSrc(src){
    const asset = assets[src];
    return (asset && asset.kind === 'image') ? asset.dataUrl : src;
  }

  function renderSourceCard(source, index){
    const card = document.createElement('div');
    card.className = 'lc-source-card';
    card.id = 'lc-source-card-' + index;
    const icon = document.createElement('div');
    icon.className = 'lc-source-icon';
    icon.textContent = { link:'🔗', image:'🖼️', pdf:'📄', text:'📝' }[source.type] || '📎';
    card.appendChild(icon);

    const main = document.createElement('div');
    main.className = 'lc-source-main';
    const labelRow = document.createElement('div');
    labelRow.className = 'lc-source-label-row';
    const label = document.createElement('div');
    label.className = 'lc-source-label';
    label.textContent = source.label || '(untitled source)';
    labelRow.appendChild(label);
    if(source.manual){
      const tag = document.createElement('span');
      tag.className = 'lc-source-manual-tag';
      tag.textContent = 'uploaded by you';
      labelRow.appendChild(tag);
    }
    main.appendChild(labelRow);

    if(source.type === 'link' && source.url){
      const sub = document.createElement('div');
      sub.className = 'lc-source-sub';
      sub.textContent = source.url;
      main.appendChild(sub);
      const actions = document.createElement('div');
      actions.className = 'lc-source-actions';
      const a = document.createElement('a');
      a.href = source.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.className = 'lc-btn lc-btn-small';
      a.textContent = 'Open link ↗';
      actions.appendChild(a);
      main.appendChild(actions);
    } else if(source.type === 'image' && source.src){
      const img = document.createElement('img');
      img.className = 'lc-source-thumb';
      img.src = resolveAssetSrc(source.src);
      img.alt = source.label || '';
      main.appendChild(img);
    } else if(source.type === 'pdf' && source.src){
      const actions = document.createElement('div');
      actions.className = 'lc-source-actions';
      const viewBtn = document.createElement('button');
      viewBtn.className = 'lc-btn lc-btn-small';
      viewBtn.textContent = 'View page ' + (source.page || 1);
      const previewWrap = document.createElement('div');
      previewWrap.className = 'lc-source-pdf-preview';
      previewWrap.style.display = 'none';
      let rendered = false;
      viewBtn.addEventListener('click', ()=>{
        const shown = previewWrap.style.display === 'none';
        previewWrap.style.display = shown ? 'block' : 'none';
        if(shown && !rendered){
          rendered = true;
          const canvas = document.createElement('canvas');
          previewWrap.appendChild(canvas);
          renderPdfPage(source.src, source.page || 1, canvas);
        }
      });
      actions.appendChild(viewBtn);
      main.appendChild(actions);
      main.appendChild(previewWrap);
    }
    card.appendChild(main);

    // Only sources the user manually uploaded (PNG/PDF toolbar) can be deleted —
    // anything the authoring AI put in lesson.sources has no createdBlockId/
    // createdSlideIds and no manual flag, so it never gets a delete button here.
    // Manual uploads are always deletable by the user. AI-given sources are only
    // deletable in Dev Mode (elevated, dev-only capability) — never by a regular user.
    if(source.manual || devModeActive){
      const delBtn = document.createElement('button');
      delBtn.className = 'lc-icon-btn-delete';
      delBtn.title = source.manual ? 'Remove this upload from the lesson' : 'Remove this AI-given source (Dev Mode)';
      delBtn.textContent = '🗑';
      delBtn.addEventListener('click', ()=>{
        const warning = source.manual
          ? 'Remove "' + (source.label||'this upload') + '"? This also removes it from the slide(s) it was added to.'
          : '[Dev Mode] Remove AI-given source "' + (source.label||'this source') + '"? A regular user cannot do this.';
        if(confirm(warning)){
          deleteSource(index);
        }
      });
      card.appendChild(delBtn);
    }
    return card;
  }

  function deleteSource(index){
    const source = (lesson.sources||[])[index];
    if(!source || !(source.manual || devModeActive)) return; // AI-given sources are only removable in Dev Mode
    if(source.createdBlockId){
      lesson.slides.forEach(slide=>{
        slide.blocks = (slide.blocks||[]).filter(b=>b.id !== source.createdBlockId);
      });
    }
    if(source.createdSlideIds && source.createdSlideIds.length){
      lesson.slides = lesson.slides.filter(s=>!source.createdSlideIds.includes(s.id));
    }
    lesson.sources.splice(index,1);
    if(currentSlide >= lesson.slides.length) currentSlide = Math.max(0, lesson.slides.length-1);
    updateSourcesButton();
    if(sourcesModalEl) renderSourcesModalBody();
    renderSlide(currentSlide);
  }

  function updateSourcesButton(){
    const badge = document.getElementById('lc-sources-badge');
    if(!badge) return;
    const count = (lesson.sources || []).length;
    badge.textContent = String(count);
    badge.style.display = count > 0 ? 'inline-flex' : 'none';
  }

  function clearSources(){
    lesson.sources = [];
    updateSourcesButton();
    if(sourcesModalEl) renderSourcesModalBody();
  }
  window.clearSources = clearSources; // lets the shell be wiped clean when repurposed for a new lesson

  function addSource(source){
    if(!lesson.sources) lesson.sources = [];
    lesson.sources.push(source);
    updateSourcesButton();
    if(sourcesModalEl) renderSourcesModalBody();
  }

  let sourcesModalEl = null;
  function renderSourcesModalBody(){
    const body = sourcesModalEl.querySelector('.lc-modal-body-scroll');
    body.innerHTML = '';
    const sources = lesson.sources || [];
    if(!sources.length){
      const empty = document.createElement('div');
      empty.className = 'lc-sources-empty';
      empty.textContent = 'No sources added for this lesson yet.';

  function toggleSourcesModal(){
    if(sourcesModalEl){ sourcesModalEl._modalClose(); return; }
    const handle = openModal({
      id: 'sources',
      title: 'Sources',
      bodyHtml: '<div class="lc-sources-toolbar"><button class="lc-btn lc-btn-small" id="lc-sources-clear">Erase all sources</button></div><div class="lc-modal-body-scroll"></div>',
      onMount(panel){
        // onMount runs before openModal() returns, i.e. before the line below that
        // assigns sourcesModalEl from the handle -- but renderSourcesModalBody() (also
        // called from elsewhere, e.g. addSource/clearSources) reads sourcesModalEl
        // directly, so it has to be set here first or that first render sees null.
        sourcesModalEl = panel.parentElement;
        renderSourcesModalBody();

            clearSources();

        });
      },
      onClose(){ sourcesModalEl = null; }
    });
    sourcesModalEl = handle.el;
  }
  // Opens the Sources panel (if not already open) and scrolls/flashes a specific
  // entry -- used by inline citation clicks for sources with no direct url.
  function openSourcesModalAt(idx){
    if(!sourcesModalEl) toggleSourcesModal();
    const card = document.getElementById('lc-source-card-' + idx);
    if(!card) return;
    card.scrollIntoView({ block:'center', behavior:'smooth' });
    card.classList.add('lc-source-card-flash');
    setTimeout(()=>card.classList.remove('lc-source-card-flash'), 1600);
  }

  // ---- AI helper (chat panel backed by a Worker /api/ask endpoint) ----
  let aiHelperModalEl = null;
  let aiHelperMessages = [];
  let aiRequestInFlight = false; // guards against Enter/Send firing a second overlapping request

  function getCurrentSlideContext(){
    const slide = lesson.slides[currentSlide];
    if(!slide) return '';
    const parts = [];
    (slide.blocks||[]).forEach(b=>{
      if(b.type==='heading') parts.push(b.text||'');
      else if(b.type==='text') parts.push(String(b.text||'').replace(/<[^>]+>/g,' '));
      else if(b.type==='math') parts.push('Math: ' + (b.latex||''));
      else if(b.type==='image' && b.caption) parts.push('Image caption: ' + b.caption);
    });
    return parts.join('\n').trim();
  }

  // A style directive prepended to every request's `context` field, since the
  // Worker itself is a separate deployment with its own system prompt we can't
  // edit from here — this is the one lever available client-side to steer tone
  // without touching the backend. Kept short and stated once per request rather
  // than baked into `question` so the model's actual answer content isn't
  // competing with instructions for the same field.
  const AI_HELPER_STYLE_WRAP = 'Answer concisely, in an academic but approachable tone: precise, well-organized, and genuinely helpful. Avoid sounding robotic or like a canned FAQ response — write like a knowledgeable tutor explaining something to a student, not a customer-support script. No unnecessary filler, hedging, or repetition.';

  function buildAiHelperContext(){
    const slideContext = getCurrentSlideContext();
    return AI_HELPER_STYLE_WRAP + (slideContext ? '\n\nCurrent slide content:\n' + slideContext : '');
  }

  function renderAiHelperMessages(){
    const body = aiHelperModalEl.querySelector('.lc-ai-messages');
    body.innerHTML = '';
    if(!aiHelperMessages.length){
      const hint = document.createElement('div');
      hint.className = 'lc-ai-msg lc-ai-msg-bot';
      hint.textContent = "Hi! Ask me about this slide, or anything else you're stuck on.";
      body.appendChild(hint);
    }
    aiHelperMessages.forEach(m=>{
      const el = document.createElement('div');
      el.className = 'lc-ai-msg ' + (m.role==='user' ? 'lc-ai-msg-user' : m.role==='error' ? 'lc-ai-msg-error' : 'lc-ai-msg-bot');
      el.textContent = m.text;
      body.appendChild(el);
    });
    body.scrollTop = body.scrollHeight;
  }

  async function sendAiHelperQuestion(){
    const input = document.getElementById('lc-ai-input');
    const question = input.value.trim();
    if(!question) return;
    if(aiRequestInFlight) return; // Enter/Send firing again mid-request must not stack a second call
    aiRequestInFlight = true;
    input.value = '';
    aiHelperMessages.push({role:'user', text:question});
    const sendBtn = document.getElementById('lc-ai-send');
    sendBtn.disabled = true;
    // held as a live reference, not popped by array index -- that way whichever branch below
    // settles it mutates the right message in place regardless of anything else that might
    // touch aiHelperMessages while this request is in flight
    const placeholder = {role:'bot', text:'Thinking…'};
    aiHelperMessages.push(placeholder);
    renderAiHelperMessages();
    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), 30000);
    try{
      const res = await fetch('https://lessoncanvas.jtraini.workers.dev/api/ask', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ question, context: buildAiHelperContext() }),
        signal: controller.signal
      });
      if(!res.ok) throw new Error('request failed (' + res.status + ')');
      const data = await res.json();
      placeholder.role = 'bot';
      placeholder.text = data.answer || '(no answer returned)';
    }catch(err){
      placeholder.role = 'error';
      placeholder.text = (err.name === 'AbortError')
        ? 'AI helper took too long to respond. Please try again.'
        : 'AI helper is unavailable right now (' + err.message + ').';
    }finally{
      clearTimeout(timeoutId);
      aiRequestInFlight = false;
      sendBtn.disabled = false;
      renderAiHelperMessages();
    }
  }

  function toggleAiHelperModal(){
    if(aiHelperModalEl){ aiHelperModalEl._modalClose(); return; }
    const handle = openModal({
      id: 'ai',
      title: '🤖 AI Helper',
      panelClass: 'lc-ai-panel',
      headerExtraHtml: devModeActive ? '<button class="lc-help-devlink" id="lc-ai-inspect-toggle">🔍 Inspect (Dev Mode)</button>' : '',
      bodyHtml: '<div class="lc-ai-messages"></div><div class="lc-ai-inputrow"><textarea id="lc-ai-input" placeholder="Ask about this slide..." rows="1"></textarea><button class="lc-btn lc-btn-primary lc-btn-small" id="lc-ai-send">Send</button></div>',
      onMount(panel){
        // onMount runs before openModal() returns, i.e. before the line below that
        // assigns aiHelperModalEl from the handle -- but renderAiHelperMessages()
        // (also called from sendAiHelperQuestion()) reads aiHelperModalEl directly,
        // so it has to be set here first or this first render sees null.
        aiHelperModalEl = panel.parentElement;
        renderAiHelperMessages();
        document.getElementById('lc-ai-send').addEventListener('click', sendAiHelperQuestion);
        document.getElementById('lc-ai-input').addEventListener('keydown', (e)=>{
          if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendAiHelperQuestion(); }
        });
        const inspectBtn = document.getElementById('lc-ai-inspect-toggle');
        if(inspectBtn) inspectBtn.addEventListener('click', toggleAiHelperInspectView);
        document.getElementById('lc-ai-input').focus();
      },
      onClose(){ aiHelperModalEl = null; }
    });
    aiHelperModalEl = handle.el;
  }

  // ---- AI Helper "behind the scenes" inspector (Dev Mode only) ----
  // Shows exactly what's actually here — nothing invented. The client-side
  // functions are read live via .toString(), so this can never drift out of
  // sync with the real implementation the way a hand-copied snippet could.
  // What this can NOT show: the Worker's own server-side code, model config, or
  // system prompt — lessoncanvas.jtraini.workers.dev is a separate deployment
  // outside this repo, built in a different session. That's disclosed here
  // rather than faked.
  let aiInspectViewEl = null;
  function toggleAiHelperInspectView(){
    if(!devModeActive) return;
    if(aiInspectViewEl){ aiInspectViewEl.remove(); aiInspectViewEl = null; return; }
    aiInspectViewEl = document.createElement('div');
    aiInspectViewEl.className = 'lc-modal-backdrop';
    const panel = document.createElement('div');
    panel.className = 'lc-modal-panel';

  const w = canvas.width, h = canvas.height;

  function hillY(t){
    return 40 + (h-90) * (t*t);

  function drawHill(ballT){

    ctx.strokeStyle = '#5b6cf0';
    ctx.lineWidth = 4;
    ctx.beginPath();

      const t = i/100;

      ctx.arc(bx, by, 10, 0, Math.PI*2);
      ctx.fill();

  });

  const trackStart = 30, trackEnd = w - 30;

  const speedAInput = document.getElementById('speedA');
  const speedBInput = document.getElementById('speedB');
  const speedAVal = document.getElementById('speedAVal');
  const speedBVal = document.getElementById('speedBVal');
  speedAInput.addEventListener('input', function(){ speedAVal.textContent = speedAInput.value; });
  speedBInput.addEventListener('input', function(){ speedBVal.textContent = speedBInput.value; });

  function draw(posA, posB){
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = '#c7cbf5';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(trackStart, 50); ctx.lineTo(trackEnd, 50); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(trackStart, 110); ctx.lineTo(trackEnd, 110); ctx.stroke();
    ctx.strokeStyle = '#5b6cf0';
    ctx.beginPath(); ctx.moveTo(trackEnd, 30); ctx.lineTo(trackEnd, 130); ctx.stroke();
    ctx.fillStyle = '#d64550';
    ctx.beginPath(); ctx.arc(trackStart + posA*(trackEnd-trackStart), 50, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1e9e6b';
    ctx.beginPath(); ctx.arc(trackStart + posB*(trackEnd-trackStart), 110, 9, 0, Math.PI*2); ctx.fill();
  }

  draw(0,0);

  let animId = null;
  document.getElementById('raceBtn').addEventListener('click', function(){
    if(animId) cancelAnimationFrame(animId);
    const speedA = parseFloat(speedAInput.value);
    const speedB = parseFloat(speedBInput.value);
    const distance = 100;
    const start = performance.now();
    let finished = false;
    function frame(now){
      const t = (now - start) / 1000;
      const distA = Math.min(distance, speedA * t);
      const distB = Math.min(distance, speedB * t);
      draw(distA/distance, distB/distance);
      document.getElementById('raceReadout').textContent =
        'A: ' + distA.toFixed(1) + ' units  |  B: ' + distB.toFixed(1) + ' units  (t=' + t.toFixed(1) + 's)';
      if(distA >= distance || distB >= distance){
        if(!finished){
          finished = true;
          const winner = distA >= distB ? 'Runner A' : 'Runner B';
          document.getElementById('raceReadout').textContent =
            'Finish \\u2192 ' + winner + ' wins! Faster rate (distance \\u00f7 time) gets there first.';
        }
        return;
      }
      animId = requestAnimationFrame(frame);
    }
    animId = requestAnimationFrame(frame);
  });
})();
<\/script>
</div>

          { type:"text", text:`A **rate of change** tells you how fast something is changing — whether that's a ball speeding up as it rolls downhill, or a runner covering ground over time.

- It's always a *ratio*: how much one quantity changes compared to another
- On a graph, it's the slope of the line connecting two points
- The steeper the slope, the faster the rate of change

We'll explore this two ways: a hill (where the rate keeps changing) and a race (where the rate stays constant).` },

  // Only meaningful for a single book (need one target page count to count
  // down to) -- "All books" has no one length to estimate against, so this
  // stays blank until the tracker's own book filter narrows to one title.
  function bwTrackerFinishEstimateRow(avgPpm){
    if(!bwTrackerBookFilter) return "";
    var book = bwBookById(bwTrackerBookFilter);
    if(!book || book.totalPages == null) return "";
    var pagesRemaining = Math.max(0, book.totalPages - (book.currentPage || 0));
    if(pagesRemaining === 0){
      return '<div class="bw-log-summary-row"><span>Pages left in "' + book.title +
        '"</span><span class="bw-stat-value">Finished!</span></div>';
    }
    if(avgPpm <= 0) return "";
    var estMinutes = Math.round(pagesRemaining / avgPpm);
    return '<div class="bw-log-summary-row"><span>Estimated time to finish "' + book.title +
      '"</span><span class="bw-stat-value">' + bwFormatDuration(estMinutes) +
      ' &middot; ' + pagesRemaining + ' page' + (pagesRemaining === 1 ? "" : "s") + ' left</span></div>';
  }

  function bwRenderTrackerSpeed(){
    var container = document.getElementById("bw-tracker-speed-content");

    var allDone = bwState.sessions.filter(function(s){ return s.status === "done"; });
    if(allDone.length === 0){
      container.innerHTML =
        '<div class="bw-empty">Once you time a reading session and enter the page you reached when you stop, ' +
        'this tab will chart your pages-per-minute over time and show how your books compare by length and progress.</div>';
      return;
    }

    var allUsable = allDone.filter(bwSessionUsableForSpeed);
    if(allUsable.length === 0){
      container.innerHTML =
        '<div class="bw-empty">Sessions are logged, but none have a page number recorded. ' +
        'The "page reached" field you fill in when you stop a timer is what drives these charts -- ' +
        'enter it next time and this tab will start filling in.</div>';
      return;
    }

    var doneInScope = bwTrackerDoneSessionsInScope();
    var usable = doneInScope.filter(bwSessionUsableForSpeed);
    var excludedCount = doneInScope.length - usable.length;

    if(usable.length === 0){
      container.innerHTML = '<div class="bw-empty">No sessions with page numbers match this book/range filter.</div>';
      return;
    }

    var totalPages = 0, totalMinutes = 0;
    usable.forEach(function(s){
      totalPages += (s.pageEnd - s.pageStart);
      totalMinutes += s.actualMinutes;
    });
    var n = usable.length;
    var avgPpm = totalMinutes > 0 ? totalPages / totalMinutes : 0;
    var avgSessionLen = totalMinutes / n;
    var avgProgress = totalPages / n;

    var points = bwAggregateSessionsByDay(usable);
    var smallSample = n < 5;
    var drawAvg = !smallSample && points.length > 1;
    var avgLine = drawAvg ? bwTrailingAverage(points, 3) : [];

    var html = "";
    html += '<div class="bw-chart-card">';
    html += bwBuildSpeedChartSvg(points, avgLine, drawAvg, bwChartAvailableWidth());
    if(drawAvg){
      html += '<div class="bw-tracker-legend">' +
        '<span class="bw-tracker-legend-item"><span class="bw-tracker-legend-swatch" style="background:var(--accent-cognac);"></span>Daily pace</span>' +
        '<span class="bw-tracker-legend-item"><span class="bw-tracker-legend-swatch" style="background:var(--accent-gold);"></span>Running average (3-day)</span>' +
        '</div>';
    }
    html += '</div>';

    html += '<div class="bw-card-list" style="margin-top:14px;">';
    html += '<div class="bw-log-summary-row"><span>Average pace</span><span class="bw-stat-value">' +
      bwFormatPpm(avgPpm) + ' pages/min &middot; ' + n + ' session' + (n === 1 ? "" : "s") + '</span></div>';
    html += '<div class="bw-log-summary-row"><span>Average session length</span><span class="bw-stat-value">' +
      bwFormatDuration(Math.round(avgSessionLen)) + '</span></div>';
    html += '<div class="bw-log-summary-row"><span>Typical progress per session</span><span class="bw-stat-value">' +
      Math.round(avgProgress * 10) / 10 + ' pages</span></div>';
    html += bwTrackerFinishEstimateRow(avgPpm);
    html += '</div>';

    if(smallSample){
      html += '<p class="bw-chart-note bw-chart-note-small">' + n + ' session' + (n === 1 ? "" : "s") +
        ' so far -- these will settle as you log more.</p>';
    }
    if(excludedCount > 0){
      html += '<p class="bw-chart-note">' + excludedCount + ' session' + (excludedCount === 1 ? "" : "s") +
        ' not shown -- no page numbers recorded.</p>';
    }

    container.innerHTML = html;
  }

  // ---- Chart 2: book lengths and how far through ----

  var bwTrackerLengthMode = "total"; // "total" | "read"

  // Upcoming books only count if they have a page count -- there's no
  // progress to show for them either way, so "reading"/"finished" without a
  // page count and "upcoming" without one both land in the same excluded list.
  function bwTrackerLengthChartBooks(){
    return bwState.books.filter(function(b){
      return b.totalPages != null &&
        (b.status === "reading" || b.status === "finished" || b.status === "upcoming");
    });
  }

  function bwTrackerBooksMissingPages(){
    return bwState.books.filter(function(b){ return b.totalPages == null; });
  }

  // Rough average character width for Inter -- not pixel-perfect, but good
  // enough to decide when an SVG <text> label needs truncating so a long
  // title can't run into the bar or off the chart (SVG text doesn't wrap).
  function bwEstimateTextWidth(text, fontSize){
    return text.length * fontSize * 0.55;
  }

  function bwTruncateForWidth(text, maxWidth, fontSize){
    if(bwEstimateTextWidth(text, fontSize) <= maxWidth) return text;
    var lo = 0, hi = text.length;
    while(lo < hi){
      var mid = Math.ceil((lo + hi) / 2);
      var candidate = text.slice(0, mid) + "…";
      if(bwEstimateTextWidth(candidate, fontSize) <= maxWidth) lo = mid; else hi = mid - 1;
    }
    return text.slice(0, lo) + "…";
  }

  function bwEscapeXml(s){
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function bwBuildLengthChartSvg(books, maxPages, mode, W){
    W = W || 640;
    var padL = 12, padR = 12, labelColW = 96, rowH = 46, barH = 16, titleFont = 13;
    var plotW = W - padL - padR - labelColW;
    var H = books.length * rowH + 10;

    var svg = '<svg class="bw-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
      'Book lengths' + (mode === "read" ? " and pages read" : "") + ', one bar per book">';

    // Same fine page-edge hairlines as the fore-edge progress bar, so a book
    // length bar reads as a stack of pages too rather than a flat rectangle.
    svg += '<defs>' +
      '<pattern id="bwHairlineTrack" width="3" height="' + barH + '" patternUnits="userSpaceOnUse">' +
        '<rect width="1" height="' + barH + '" fill="rgba(139,111,71,0.16)"/></pattern>' +
      '<pattern id="bwHairlineRead" width="3" height="' + barH + '" patternUnits="userSpaceOnUse">' +
        '<rect width="1" height="' + barH + '" fill="rgba(255,255,255,0.22)"/></pattern>' +
      '</defs>';

    books.forEach(function(book, i){
      var rowTop = i * rowH + 4;
      var isUpcoming = book.status === "upcoming";
      // Upcoming books still get the split in "Pages read" mode -- almost
      // always 0%, since they're real, honest zero progress rather than a
      // number to hide. Only the dimming (opacity/title colour) marks them
      // as not started; the bar itself behaves the same as any other book.
      var showRead = mode === "read";
      var barW = Math.max(plotW * 0.05, (book.totalPages / maxPages) * plotW);
      var barY = rowTop + 16;

      var titleColor = isUpcoming ? "var(--muted-accent)" : "var(--text-primary)";
      var fullTitle = book.title;
      var shownTitle = bwTruncateForWidth(fullTitle, plotW + labelColW, titleFont);
      svg += '<text x="' + padL + '" y="' + (rowTop + 10) + '" font-size="' + titleFont + '" fill="' + titleColor + '">' +
        bwEscapeXml(shownTitle);
      if(shownTitle !== fullTitle) svg += '<title>' + bwEscapeXml(fullTitle) + '</title>';
      svg += '</text>';

      var barRectAttrs = 'x="' + padL + '" y="' + barY + '" width="' + barW.toFixed(1) + '" height="' + barH + '" rx="4"';
      svg += '<rect ' + barRectAttrs + ' fill="var(--muted-accent)"' + (isUpcoming ? ' opacity="0.6"' : '') + '/>';
      svg += '<rect ' + barRectAttrs + ' fill="url(#bwHairlineTrack)"' + (isUpcoming ? ' opacity="0.6"' : '') + '/>';

      var labelText;
      if(showRead){
        var current = book.currentPage || 0;
        var pct = Math.round((current / book.totalPages) * 100);
        var readW = Math.max(0, Math.min(barW, (current / book.totalPages) * barW));
        var readRectAttrs = 'x="' + padL + '" y="' + barY + '" width="' + readW.toFixed(1) + '" height="' + barH + '" rx="4"';
        svg += '<rect ' + readRectAttrs + ' fill="var(--accent-cognac)"' + (isUpcoming ? ' opacity="0.6"' : '') + '/>';
        svg += '<rect ' + readRectAttrs + ' fill="url(#bwHairlineRead)"' + (isUpcoming ? ' opacity="0.6"' : '') + '/>';
        labelText = current + ' / ' + book.totalPages + ' (' + pct + '%)';
      } else {
        labelText = book.totalPages + ' pages';
      }
      svg += '<text x="' + (padL + plotW + labelColW) + '" y="' + (barY + barH - 3) +
        '" font-size="12" text-anchor="end" fill="var(--text-secondary)">' + bwEscapeXml(labelText) + '</text>';
    });

    svg += '</svg>';
    return svg;
  }

  function bwRenderTrackerLength(){
    var container = document.getElementById("bw-tracker-length-content");
    var books = bwTrackerLengthChartBooks();
    var missing = bwTrackerBooksMissingPages();

    if(books.length === 0){
      container.innerHTML = '<div class="bw-empty">' +
        (missing.length > 0 ?
          'None of your books have a total page count yet -- add one from the Edit button on a book to see it charted here.' :
          'Add a book with a total page count to see it charted here.') +
        '</div>';
      return;
    }

    var sorted = books.slice().sort(function(a, b){ return b.totalPages - a.totalPages; });
    var maxPages = sorted[0].totalPages;

    var chartW = bwChartAvailableWidth();
    var html = '<div class="bw-chart-card">' + bwBuildLengthChartSvg(sorted, maxPages, bwTrackerLengthMode, chartW) + '</div>';

    if(missing.length > 0){
      html += '<p class="bw-chart-note">No page count set, so not shown above: ' +
        missing.map(function(b){ return b.title; }).join(", ") + '.</p>';
    }

    container.innerHTML = html;
  }

  function bwSetTrackerLengthMode(mode){
    bwTrackerLengthMode = mode;
    document.getElementById("bw-tracker-lengthmode-total").setAttribute("aria-pressed", String(mode === "total"));
    document.getElementById("bw-tracker-lengthmode-read").setAttribute("aria-pressed", String(mode === "read"));
    bwRenderTrackerLength();
  }

  document.getElementById("bw-tracker-lengthmode-total").addEventListener("click", function(){ bwSetTrackerLengthMode("total"); });
  document.getElementById("bw-tracker-lengthmode-read").addEventListener("click", function(){ bwSetTrackerLengthMode("read"); });

  function bwRenderTracker(){
    bwRefreshTrackerBookSelect();
    bwRenderTrackerSpeed();
    bwRenderTrackerLength();
  }

  document.getElementById("bw-tracker-book-select").addEventListener("change", function(e){
    bwTrackerBookFilter = e.target.value;
    bwRenderTrackerSpeed();
  });

  document.getElementById("bw-tracker-range-select").addEventListener("change", function(e){
    bwTrackerRange = e.target.value;
    bwRenderTrackerSpeed();
  });

  // =========================================================================
  // export / import
  // =========================================================================

  function bwExportData(){
    var ids = bwState.books.filter(function(b){ return b.hasCover; }).map(function(b){ return b.id; });
    Promise.all(ids.map(function(id){ return bwGetCover(id).then(function(dataUrl){ return { id: id, dataUrl: dataUrl }; }); }))
      .then(function(covers){
        var coverMap = {};
        covers.forEach(function(c){ if(c.dataUrl) coverMap[c.id] = c.dataUrl; });
        var exportObj = {
          version: bwState.version,
          books: bwState.books.map(function(b){
            var copy = Object.assign({}, b);
            if(coverMap[b.id]) copy.coverDataUrl = coverMap[b.id];
            return copy;
          }),
          sessions: bwState.sessions,
          settings: bwState.settings
        };
        var blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "bookworm-backup-" + bwTodayKey() + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
  }

  function bwShowDatabarMessage(text){
    var existing = document.getElementById("bw-databar-message");
    if(existing) existing.remove();
    var panel = document.getElementById("bw-databar-panel");
    panel.removeAttribute("hidden");
    document.getElementById("bw-databar-toggle").setAttribute("aria-expanded", "true");
    var msg = document.createElement("div");
    msg.id = "bw-databar-message";
    msg.style.cssText = "width:100%;text-align:center;font-size:12px;font-weight:600;color:var(--text-primary);padding:4px 6px;";
    msg.textContent = text;
    panel.appendChild(msg);
    setTimeout(function(){ if(msg.parentNode) msg.remove(); }, 5000);
  }

  document.getElementById("bw-databar-toggle").addEventListener("click", function(){
    var panel = document.getElementById("bw-databar-panel");
    var willShow = panel.hasAttribute("hidden");
    if(willShow) panel.removeAttribute("hidden"); else panel.setAttribute("hidden", "");
    this.setAttribute("aria-expanded", String(willShow));
  });

  var bwPendingImportState = null;
  var bwPendingImportCovers = null;

  function bwHandleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{
        parsed = JSON.parse(reader.result);
      }catch(e){
        bwShowDatabarMessage("That file isn't valid JSON.");
        return;
      }
      var looksValid = parsed && typeof parsed === "object" &&
        Array.isArray(parsed.books) && Array.isArray(parsed.sessions);
      if(!looksValid){
        bwShowDatabarMessage("That file doesn't look like a Bookworm backup.");
        return;
      }

      var covers = {};
      var books = parsed.books.map(function(b){
        var copy = Object.assign({}, b);
        if(copy.coverDataUrl){
          covers[copy.id] = copy.coverDataUrl;
          delete copy.coverDataUrl;
          copy.hasCover = true;
        } else {
          copy.hasCover = false;
        }
        return copy;
      });

      bwPendingImportState = {
        version: parsed.version || 1,
        books: books,
        sessions: parsed.sessions,
        settings: Object.assign({ weeklyTargets: {} }, parsed.settings || {})
      };
      bwPendingImportCovers = covers;

      var body = document.getElementById("bw-import-modal-body");
      body.innerHTML =
        "<p>This file has <strong>" + books.length + "</strong> books and " +
        "<strong>" + parsed.sessions.length + "</strong> logged sessions.</p>" +
        "<p>Importing will <strong>replace</strong> your current data -- " +
        bwState.books.length + " books, " + bwState.sessions.length + " sessions -- entirely, " +
        "including every stored cover photo. This can't be undone.</p>";
      document.getElementById("bw-import-modal").style.display = "flex";
    };
    reader.readAsText(file);
  }

  document.getElementById("bw-export-btn").addEventListener("click", bwExportData);

  document.getElementById("bw-import-btn").addEventListener("click", function(){
    document.getElementById("bw-import-file-input").click();
  });

  document.getElementById("bw-import-file-input").addEventListener("change", function(e){
    if(e.target.files && e.target.files[0]) bwHandleImportFile(e.target.files[0]);
    e.target.value = "";
  });

  document.getElementById("bw-import-cancel-btn").addEventListener("click", function(){
    bwPendingImportState = null;
    bwPendingImportCovers = null;
    document.getElementById("bw-import-modal").style.display = "none";
  });

  document.getElementById("bw-import-confirm-btn").addEventListener("click", function(){
    if(!bwPendingImportState) return;
    var newState = bwPendingImportState;
    var newCovers = bwPendingImportCovers;
    bwPendingImportState = null;
    bwPendingImportCovers = null;
    document.getElementById("bw-import-modal").style.display = "none";

    bwClearAllCovers().then(function(){
      var ids = Object.keys(newCovers);
      return Promise.all(ids.map(function(id){ return bwStoreCover(id, newCovers[id]); }));
    }).then(function(){
      bwState = newState;
      bwExpandedNoteIds = {};
      bwEditingNoteIds = {};
      bwEditingBookIds = {};
      bwShowFinished = false;
      bwActiveTimerSessionId = null;
      bwPendingStopId = null;
      bwLogBookFilter = "";
      if(bwTimerTickHandle){ clearInterval(bwTimerTickHandle); bwTimerTickHandle = null; }

      bwSaveState();
      bwRenderAll();
      bwShowDatabarMessage("Import complete.");
    });
  });

  function bwRenderStorageEstimate(){
    var el = document.getElementById("bw-storage-estimate");
    var withCovers = bwState.books.filter(function(b){ return b.hasCover; }).length;
    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(function(est){
        var mb = est.usage ? (est.usage / (1024 * 1024)).toFixed(1) : "0.0";
        el.textContent = "Covers: " + withCovers + " books, about " + mb + " MB";
      }).catch(function(){
        el.textContent = "Covers: " + withCovers + " books";
      });
    } else {
      el.textContent = "Covers: " + withCovers + " books";
    }
  }

  // =========================================================================
  // init
  // =========================================================================

  function bwRenderAll(){
    bwRenderHeader();
    bwRenderToday();
    bwRenderLibrary();
    bwRenderLog();
    bwRenderTracker();
    bwRenderStorageEstimate();
  }

  bwRenderAll();
  if(bwState.sessions.some(function(s){ return !!s.timerStartedAt; })){
    bwActiveTimerSessionId = bwState.sessions.filter(function(s){ return !!s.timerStartedAt; })[0].id;
    bwEnsureTicking();
    bwRenderToday();
  }

  // =========================================================================
  // cloud sync — optional account (shared cloud-sync.js) so progress follows
  // you across devices/games. Fully opt-in; cover images stay local-only
  // (IndexedDB), only the book/session/settings JSON syncs.
  // =========================================================================
  var BW_GAME_ID = "bookworm";

  var bwAuthBar = document.createElement("div");
  bwAuthBar.innerHTML =
    '<style>' +
    '#bwAuthWrap{position:fixed;bottom:10px;left:10px;z-index:999;display:flex;flex-direction:column;align-items:flex-start;gap:4px;}' +
    '#bwAuthHint{font-family:var(--font-body);font-size:10px;color:var(--text-primary);opacity:0.7;' +
    'background:var(--bg-primary);border-radius:6px;padding:2px 7px;max-width:200px;}' +
    '#bwAuthBox{font-family:var(--font-body);font-size:12px;' +
    'background:var(--bg-primary);border:1px solid var(--accent-cognac);border-radius:10px;padding:8px 10px;' +
    'display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,0.12);color:var(--text-primary);}' +
    '#bwAuthBox input{border:1px solid var(--muted-accent);border-radius:6px;padding:4px 6px;font-size:12px;width:160px;' +
    'font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);}' +
    '#bwAuthBox button{border:1px solid var(--accent-cognac);border-radius:6px;padding:5px 10px;font-size:12px;' +
    'font-weight:600;cursor:pointer;background:var(--accent-cognac);color:var(--bg-primary);font-family:var(--font-body);}' +
    '#bwAuthBox button:hover{background:var(--accent-cognac-hover);}' +
    '</style><div id="bwAuthWrap"><div id="bwAuthHint">If data does not appear, sign out and back in.</div><div id="bwAuthBox"></div></div>';
  document.body.appendChild(bwAuthBar);

  function bwSyncFromCloud(){
    CloudSync.pullSave(BW_GAME_ID).then(function(data){
      if(data){
        bwState = data;
        bwSaveState();
        bwRenderAll();
      }
    });
  }

  CloudSync.mountAuthWidget("bwAuthBox", BW_GAME_ID, {
    syncFromCloud: bwSyncFromCloud,
    getLocalState: function(){ return bwState; },
  });
</script>
</body></html>
